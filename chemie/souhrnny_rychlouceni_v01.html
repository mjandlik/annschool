<!-- ===== KONEC HLAVIČKY ===== -->
<!--
  ŠABLONA RYCHLOUČENÍ – Ann School (system/Sablona_rychlouceni_vXX.html)
  Nové Rychloučení = kopie této šablony do složky předmětu: <předmět>/<tema>_rychlouceni_vXX.html.
  Měň JEN bloky HLAVIČKA (<title>), NÁZEV V PANELU (název a verze) a KONFIGURACE RYCHLOUČENÍ. Postup: system/Navod_rychlouceni_vXX.md.
  v01 (09.11.2026): učení formou testu.
  v02 (09.11.2026): časová osa dole – kolečko za každý fakt v pořadí kapitol (šedá = ještě nebylo, oranžová = učí se,
       červená = poslední odpověď špatně, zelená = naučeno; aktuální otázka orámovaná).
  - Fakt = jedna věc, kterou má žák umět (stálé id, kapitola, priorita jadro / doplnek, 2+ varianty otázky).
    Otázka = výběr z 5 zamíchaných možností + „Nevím“ (počítá se jako špatně). Po odpovědi hned vyhodnocení,
    vysvětlení, pomůcka a co znamená vybraná špatná možnost (ze slovníku POJMY). „Další“ je pod vyhodnocením,
    400 ms po vyhodnocení se na klepnutí nereaguje (dvojité klepnutí nepřeskočí vysvětlení).
  - Plánovač (čistá funkce bez DOM, Rychlouceni.planovac): fronta podle toho, kdy je fakt na řadě – špatně za 3 otázky,
    správně za 6; vždy fakt, který je na řadě nejdřív; když nic není na řadě a v práci je < 8 faktů, přidá nový
    (nejdřív jadro, kapitoly v pořadí); jinak nejbližší i dřív. Nikdy stejný fakt dvakrát po sobě (kromě posledního).
    Naučený = 2 správné odpovědi za sebou s jinou otázkou mezi nimi (u posledního faktu je mezi nimi výplň = naučený
    fakt s nejvíc chybami). Varianta = nejdéle nepoužitá, jiná než minule.
  - Kapitola s kostra: true – možnosti až po „Ukázat možnosti“ (nejdřív si odpověď řekne v duchu).
  - Závěrečné kolo: fakta s aspoň jednou chybou, promíchaná, každé jednou v jiné variantě.
  - Ranní opakování: nejslabší fakta (nejvíc chyb, pak nejméně správných), stačí 1 správná odpověď; po 10 min
    nebo 30 otázkách nabídne „Pokračovat“. Bez uloženého stavu: nejdřív kostra, pak náhodně.
  - Pauza po 25 min učení, po 60 min „Zbytek nech na ráno“. Odhad zbývajícího času podle úspěšnosti a tempa.
  - Stav po každé odpovědi v localStorage „annschool:rychlouceni:<cesta>“; nová verze stránky převezme stav
    z nejvyšší starší verze (Sledovani.zPredchoziVerze), fakta podle id.
  - Záznam (sledovani.js, Sledovani.udalost): rychlo_start, rychlo_odpoved, rychlo_naucen, rychlo_souhrn,
    rychlo_reset, rychlo_rano; oblast = kapitola. Pro kontrolu jen pro čtení window.Rychlouceni { stav(), otazka() }.
  - Na stránce se nic neoznačuje dlouhým stiskem (jako šablona testu v22), malá tlačítka, touch-action: manipulation.
-->

    {"id": "l-led", "kap": "k2", "pri": "jadro", "vysv": "Voda + led: 2 fáze (kapalina a pevná látka), 1 složka (obojí H₂O) – heterogenní soustava. Tenhle chyták teď už máš pod kontrolou.", "var": [{"t": "Kolik fází a složek má voda s ledem?", "ok": "2 fáze, 1 složka", "s": [["1 fáze, 2 složky", "Je to obráceně – nejčastější chyták."], ["1 fáze, 1 složka", "Led a voda jsou dvě různé části."], ["2 fáze, 2 složky", "Led i voda jsou H₂O – jedna látka."], ["3 fáze, 1 složka", "Kapalina a pevná látka = 2 fáze."]]}, {"t": "Co je fáze?", "ok": "stejnorodá část soustavy oddělená rozhraním", "s": [["každá chemická látka ve směsi", "To je složka."], ["každý kousek ledu zvlášť", "Všechny kostky ledu jsou jedna fáze."], ["chemický prvek", "Prvek s fází nesouvisí."], ["teplota tání látky", "To je vlastnost látky."]]}], "pomucka": "fáze = co vidíš, složka = jaké látky"},
    {"id": "l-olej", "kap": "k2", "pri": "jadro", "vysv": "Voda + olej: heterogenní, 2 fáze, 2 složky. Voda + ethanol: homogenní, 1 fáze, 2 složky.", "var": [{"t": "Voda + olej je…", "ok": "heterogenní, 2 fáze, 2 složky", "s": [["homogenní, 1 fáze, 2 složky", "Olej se s vodou nemísí – vzniknou vrstvy."], ["heterogenní, 2 fáze, 1 složka", "Voda a olej jsou dvě různé látky."], ["homogenní, 2 fáze, 2 složky", "Homogenní má vždy 1 fázi."], ["heterogenní, 1 fáze, 2 složky", "Heterogenní má aspoň 2 fáze."]]}, {"t": "Voda + ethanol (líh) je…", "ok": "homogenní, 1 fáze, 2 složky", "s": [["heterogenní, 2 fáze, 2 složky", "Líh se ve vodě úplně rozpustí."], ["homogenní, 1 fáze, 1 složka", "Voda a líh jsou dvě látky."], ["heterogenní, 1 fáze, 2 složky", "Heterogenní má aspoň 2 fáze."], ["homogenní, 2 fáze, 2 složky", "Homogenní má vždy 1 fázi."]]}]},
    {"id": "l-suspenze", "kap": "k2", "pri": "jadro", "vysv": "Suspenze = pevná nerozpuštěná látka v kapalině (písek ve vodě, bahnitá řeka).", "var": [{"t": "Co je suspenze?", "ok": "pevná nerozpuštěná látka v kapalině", "s": [["pevná látka rozpuštěná v kapalině", "roztok"], ["kapalina v kapalině", "emulze"], ["plyn v kapalině", "pěna"], ["kapky v plynu", "aerosol"]]}, {"t": "Která směs je suspenze?", "ok": "písek ve vodě", "s": [["slaná voda", "roztok"], ["mlha", "aerosol"], ["olej protřepaný s vodou", "emulze"], ["šlehačka", "pěna"]]}], "pomucka": "suspenze se po čase usadí na dně"},
    {"id": "l-druhy", "kap": "k2", "pri": "doplnek", "vysv": "Mlha = aerosol (kapky ve vzduchu), majonéza = emulze, šlehačka = pěna, rosol = gel.", "var": [{"t": "Mlha je…", "ok": "aerosol", "s": [["suspenze", "suspenze"], ["emulze", "emulze"], ["pěna", "pěna"], ["gel", "gel"]]}, {"t": "Šlehačka (vzduch ve smetaně) je…", "ok": "pěna", "s": [["aerosol", "aerosol"], ["emulze", "emulze"], ["suspenze", "suspenze"], ["gel", "gel"]]}]},
    {"id": "l-castice", "kap": "k2", "pri": "doplnek", "vysv": "Homogenní soustava má částice menší než 10⁻⁹ m, koloidní 10⁻⁹ až 10⁻⁷ m, heterogenní větší než 10⁻⁷ m.", "var": [{"t": "Jak velké jsou částice v homogenní soustavě?", "ok": "menší než 10⁻⁹ m", "s": [["10⁻⁹ m až 10⁻⁷ m", "To je koloidní soustava."], ["větší než 10⁻⁷ m", "To je heterogenní soustava."], ["větší než 1 mm", "To jsou viditelná zrnka – heterogenní."], ["přesně 1 m", "Nesmysl – částice jsou mikroskopické."]]}, {"t": "Mléko a vaječný bílek jsou podle pracovního listu soustavy…", "ok": "koloidní", "s": [["homogenní", "Částice jsou větší než u roztoku."], ["heterogenní", "Vypadají stejnorodě – pracovní list je řadí mezi koloidní soustavy."], ["čisté látky", "Jsou to směsi."], ["pěny", "pěna"]]}]},
    {"id": "a-na", "kap": "k3", "pri": "jadro", "vysv": "²³₁₁Na: 11 protonů, 23 − 11 = 12 neutronů, 11 elektronů. Je to jen odečítání – tohle zvládneš na jedničku.", "var": [{"t": "Kolik neutronů má atom ²³₁₁Na?", "ok": "12", "s": [["11", "To jsou protony."], ["23", "To je nukleonové číslo A."], ["34", "Sečetla jsi 23 + 11."], ["10", "Tolik elektronů má iont Na⁺."]]}, {"t": "Kolik elektronů má neutrální atom ²³₁₁Na?", "ok": "11", "s": [["12", "To jsou neutrony."], ["23", "To je A."], ["10", "To má iont Na⁺."], ["34", "Sečtení nedává smysl."]]}], "pomucka": "elektronů = protonů (u neutrálního atomu)"},
    {"id": "a-cl", "kap": "k3", "pri": "jadro", "vysv": "³⁵₁₇Cl: 17 protonů, 35 − 17 = 18 neutronů, 17 elektronů.", "var": [{"t": "Kolik neutronů má atom ³⁵₁₇Cl?", "ok": "18", "s": [["17", "To jsou protony."], ["35", "To je A."], ["52", "Sečetla jsi 35 + 17."], ["19", "Spočítej znovu: 35 − 17."]]}, {"t": "Kolik protonů má atom ³⁵₁₇Cl?", "ok": "17", "s": [["35", "To je A – protony + neutrony."], ["18", "To jsou neutrony."], ["52", "Sečtení nedává smysl."], ["16", "Protony = dolní číslo."]]}]},
    {"id": "a-al", "kap": "k3", "pri": "jadro", "vysv": "²⁷₁₃Al³⁺: 13 protonů, 14 neutronů, 13 − 3 = 10 elektronů.", "var": [{"t": "Kolik elektronů má iont ²⁷₁₃Al³⁺?", "ok": "10", "s": [["13", "To má neutrální atom."], ["16", "Kation elektrony odevzdal – odečítá se."], ["14", "To jsou neutrony."], ["27", "To je A."]]}, {"t": "Kolik neutronů má iont ²⁷₁₃Al³⁺?", "ok": "14", "s": [["10", "To jsou elektrony."], ["13", "To jsou protony."], ["11", "Neutrony se u iontu nemění: 27 − 13."], ["27", "To je A."]]}]},
    {"id": "a-o", "kap": "k3", "pri": "jadro", "vysv": "¹⁶₈O²⁻: 8 protonů, 8 neutronů, 8 + 2 = 10 elektronů (anion elektrony přijal).", "var": [{"t": "Kolik elektronů má iont ¹⁶₈O²⁻?", "ok": "10", "s": [["6", "Anion elektrony přijal – přičítá se."], ["8", "To má neutrální atom."], ["16", "To je A."], ["18", "Přičítá se jen 2."]]}, {"t": "Iont O²⁻ je…", "ok": "anion – přijal 2 elektrony", "s": [["kation – odevzdal 2 elektrony", "Kation má náboj +."], ["anion – ztratil 2 protony", "Protony se u iontu nemění."], ["izotop kyslíku", "Izotop se liší neutrony, ne nábojem."], ["kation – přijal 2 protony", "Protony se nemění."]]}], "pomucka": "anion = minus = elektrony navíc"},
    {"id": "a-zmena", "kap": "k3", "pri": "doplnek", "vysv": "Jiný počet protonů = jiný prvek, jiný počet neutronů = izotop, jiný počet elektronů = iont.", "var": [{"t": "Co vznikne, když se v atomu změní počet protonů?", "ok": "úplně jiný prvek", "s": [["izotop téhož prvku", "Izotop = jiný počet neutronů."], ["iont", "Iont = jiný počet elektronů."], ["izobar téhož prvku", "Izobary jsou různé prvky se stejným A."], ["nic se nezmění", "Protony určují prvek."]]}, {"t": "Co vznikne, když se změní jen počet neutronů?", "ok": "izotop téhož prvku", "s": [["jiný prvek", "Prvek určují protony."], ["iont", "Iont = jiný počet elektronů."], ["kation", "Kation = méně elektronů."], ["sloučenina", "Sloučenina vzniká spojením prvků."]]}]},
    {"id": "i-dvojice", "kap": "k4", "pri": "jadro", "vysv": "¹²₆C a ¹⁴₆C jsou izotopy (stejné Z = 6). ⁴⁰₁₈Ar a ⁴⁰₁₉K jsou izobary (stejné A = 40).", "var": [{"t": "Která dvojice jsou izotopy?", "ok": "¹²₆C a ¹⁴₆C", "s": [["¹⁴₆C a ¹⁴₇N", "Stejné A, různé Z – izobary."], ["⁴⁰₁₈Ar a ⁴⁰₂₀Ca", "Stejné A – izobary."], ["²³₁₁Na a ²⁴₁₂Mg", "Různé prvky i různé A."], ["¹⁶₈O a ¹⁹₉F", "Různé prvky."]]}, {"t": "Která dvojice jsou izobary?", "ok": "⁴⁰₁₈Ar a ⁴⁰₁₉K", "s": [["¹₁H a ²₁H", "Stejné Z – izotopy."], ["³⁵₁₇Cl a ³⁷₁₇Cl", "Stejné Z – izotopy."], ["¹²₆C a ¹³₆C", "Stejné Z – izotopy."], ["¹⁶₈O a ¹⁷₈O", "Stejné Z – izotopy."]]}], "pomucka": "dole stejné = izotopy, nahoře stejné = izobary"},
    {"id": "i-vodik", "kap": "k4", "pri": "jadro", "vysv": "Izotopy vodíku: protium ¹H (0 neutronů), deuterium ²H (1 neutron), tritium ³H (2 neutrony, radioaktivní).", "var": [{"t": "Kolik neutronů má deuterium ²₁H?", "ok": "1", "s": [["0", "To má protium ¹H."], ["2", "To má tritium ³H."], ["3", "Spočítej 2 − 1."], ["4", "Nesmysl."]]}, {"t": "Jak se jmenuje izotop ³₁H?", "ok": "tritium", "s": [["deuterium", "To je ²H."], ["protium", "To je ¹H."], ["helium", "To je jiný prvek (Z = 2)."], ["triton", "Triton je jádro tritia – izotop se jmenuje tritium."]]}], "pomucka": "deuterium = druhý, tritium = třetí"},
    {"id": "i-prvek", "kap": "k4", "pri": "jadro", "vysv": "Všechny atomy jednoho prvku mají stejné protonové číslo Z; počet neutronů se může lišit.", "var": [{"t": "Co mají stejné všechny atomy jednoho prvku?", "ok": "protonové číslo Z", "s": [["počet neutronů", "Ten se může lišit (izotopy)."], ["nukleonové číslo A", "Ten se může lišit (izotopy)."], ["hmotnost atomu", "Izotopy se liší hmotností."], ["počet elektronů i v iontech", "Ionty mají jiný počet elektronů."]]}, {"t": "Atom má 8 protonů. Který je to prvek?", "ok": "kyslík", "s": [["dusík", "Dusík má 7 protonů."], ["fluor", "Fluor má 9 protonů."], ["uhlík", "Uhlík má 6 protonů."], ["neon", "Neon má 10 protonů."]]}]},
    {"id": "i-c14", "kap": "k4", "pri": "doplnek", "vysv": "Podle radioaktivního izotopu ¹⁴C se zjišťuje stáří kostí a dřeva z vykopávek.", "var": [{"t": "K čemu se používá izotop ¹⁴C?", "ok": "k určení stáří kostí a dřeva", "s": [["do zubní pasty", "Tam je fluor."], ["k plnění balonků", "To je helium."], ["jako palivo do aut", "Nesmysl."], ["k dezinfekci bazénů", "To je chlor."]]}, {"t": "Izotopy téhož prvku mají…", "ok": "stejné chemické a různé fyzikální vlastnosti", "s": [["různé chemické vlastnosti", "Chemicky se chovají (skoro) stejně."], ["stejnou hmotnost", "Liší se hmotností."], ["různé protonové číslo", "Pak by to nebyl stejný prvek."], ["stejný počet neutronů", "Liší se právě neutrony."]]}]},
    {"id": "o-olej", "kap": "k5", "pri": "jadro", "vysv": "Voda a olej se oddělí dělicí nálevkou – olej má menší hustotu a je nahoře, voda se vypustí kohoutem.", "var": [{"t": "Jak oddělíš vodu a olej?", "ok": "dělicí nálevkou", "s": [["filtrací", "filtrace"], ["magnetem", "magnet"], ["sublimací", "sublimace"], ["krystalizací", "krystalizace"]]}, {"t": "K čemu slouží dělicí nálevka?", "ok": "k oddělení dvou kapalin, které se nemísí", "s": [["k oddělení soli z vody", "To je krystalizace."], ["k oddělení písku od vody", "To je filtrace."], ["k oddělení železa", "To je magnet."], ["k oddělení jodu od písku", "To je sublimace."]]}]},
    {"id": "o-jod", "kap": "k5", "pri": "jadro", "vysv": "Jod se oddělí od písku sublimací – zahřátím přejde rovnou na páry.", "var": [{"t": "Jak oddělíš jod a písek?", "ok": "sublimací", "s": [["filtrací", "filtrace"], ["krystalizací", "krystalizace"], ["magnetem", "magnet"], ["dělicí nálevkou", "dělicí nálevka"]]}, {"t": "Co je sublimace?", "ok": "přeměna pevné látky přímo na plyn", "s": [["přeměna kapaliny na plyn", "To je var / vypařování."], ["přeměna plynu na kapalinu", "To je kapalnění."], ["usazení pevné látky na dně", "usazování"], ["vylučování krystalů z roztoku", "krystalizace"]]}]},
    {"id": "o-magnet", "kap": "k5", "pri": "jadro", "vysv": "Železné piliny se vytáhnou magnetem – železo je magnetické, popel ani písek ne.", "var": [{"t": "Jak oddělíš železné piliny a popel?", "ok": "magnetem", "s": [["filtrací", "filtrace"], ["krystalizací", "krystalizace"], ["sublimací", "sublimace"], ["dělicí nálevkou", "dělicí nálevka"]]}, {"t": "Která látka se dá oddělit magnetem?", "ok": "železné piliny", "s": [["sůl", "Sůl není magnetická."], ["písek", "Písek není magnetický."], ["jod", "Jod není magnetický."], ["hliníkové piliny", "Hliník magnet nepřitahuje."]]}], "pomucka": "železo = magnet"},
    {"id": "o-sul", "kap": "k5", "pri": "jadro", "vysv": "Rozpuštěnou sůl z vody získáš krystalizací – voda se odpaří, sůl zůstane (solné pánve u moře).", "var": [{"t": "Jak získáš sůl z mořské vody?", "ok": "krystalizací (odpařením vody)", "s": [["filtrací", "Rozpuštěná sůl projde filtrem."], ["magnetem", "Sůl není magnetická."], ["dělicí nálevkou", "Je to jedna kapalina – roztok."], ["usazováním", "Rozpuštěná sůl se neusadí."]]}, {"t": "Co filtrací oddělit NEJDE?", "ok": "rozpuštěnou sůl z vody", "s": [["písek z vody", "To filtrací jde."], ["křídu z vody", "To filtrací jde."], ["popel z vody", "To filtrací jde."], ["piliny z vody", "To filtrací jde."]]}]},
    {"id": "o-poradi", "kap": "k5", "pri": "doplnek", "vysv": "Železné piliny, sůl a popel: magnet → rozpustit ve vodě → filtrace (popel) → krystalizace (sůl).", "var": [{"t": "Železné piliny, sůl a popel – co uděláš jako první?", "ok": "vytáhnu železo magnetem", "s": [["přefiltruji směs", "Ve směsi není kapalina – není co filtrovat."], ["zahřeji to, ať sublimuje", "Nic z toho nesublimuje."], ["dám to do dělicí nálevky", "Nejsou to kapaliny."], ["odpařím vodu", "Voda tam zatím není."]]}, {"t": "Písek, sůl a jod – co uděláš jako první?", "ok": "sublimací oddělím jod", "s": [["magnetem vytáhnu písek", "Písek není magnetický."], ["filtrací oddělím sůl", "Sůl je pevná a nerozpuštěná – filtr nic neoddělí."], ["krystalizací oddělím jod", "Krystalizace je na rozpuštěné látky."], ["dělicí nálevkou oddělím sůl", "Nejsou to kapaliny."]]}]},
    {"id": "o-usazovani", "kap": "k5", "pri": "doplnek", "vysv": "Usazováním (sedimentací) se oddělí nerozpustná látka podle hustoty – těžší klesne ke dnu.", "var": [{"t": "Při usazování klesne ke dnu látka…", "ok": "s větší hustotou", "s": [["s menší hustotou", "Ta zůstane nahoře."], ["která je rozpuštěná", "Rozpuštěná látka se neusadí."], ["která je magnetická", "Usazování nesouvisí s magnetismem."], ["která sublimuje", "Usazování nesouvisí se sublimací."]]}, {"t": "Čím se dá usazování urychlit?", "ok": "odstředivkou (centrifugou)", "s": [["magnetem", "Magnet vytáhne jen železo."], ["filtračním papírem", "To je filtrace."], ["zahřátím do sublimace", "To je jiná metoda."], ["přidáním soli", "Sůl usazování neurychlí."]]}]},
    {"id": "n-kriz", "kap": "k6", "pri": "jadro", "vysv": "Oxid hlinitý: Al^III a O^−II → do kříže → Al₂O₃. Minule to zlobilo – teď už víš proč.", "var": [{"t": "Vzorec oxidu hlinitého je…", "ok": "Al₂O₃", "s": [["Al₃O₂", "Indexy jsou prohozené – Al dostane číslo kyslíku (2)."], ["AlO", "Al má III, O −II – to nesedí."], ["Al₂O", "Al₂ dá +6, jeden O jen −2."], ["AlO₃", "Jeden Al +3, tři O −6 – nesedí."]]}, {"t": "Vzorec sulfidu sodného je…", "ok": "Na₂S", "s": [["NaS", "Na má I, S −II – potřebuješ 2 Na."], ["NaS₂", "Indexy prohozené."], ["Na₂S₃", "Na₂ dá +2, S₃ −6 – nesedí."], ["Na₃S", "Na₃ dá +3, S jen −2."]]}], "pomucka": "oxidační číslo jednoho prvku = index druhého"},
    {"id": "n-zkratit", "kap": "k6", "pri": "jadro", "vysv": "Oxid siřičitý: S^IV a O^−II → S₂O₄ → zkrátit dvěma → SO₂. Na zkracování se zapomíná nejčastěji – ty už si na něj vzpomeneš.", "var": [{"t": "Vzorec oxidu siřičitého je…", "ok": "SO₂", "s": [["S₂O₄", "Správně křížem, ale zapomněla jsi zkrátit."], ["SO₃", "To je oxid sírový (VI)."], ["S₄O₂", "Indexy prohozené."], ["S₂O", "Síra by měla I."]]}, {"t": "Vzorec oxidu uhličitého je…", "ok": "CO₂", "s": [["C₂O₄", "Nezkrácené."], ["CO", "To je oxid uhelnatý (II)."], ["C₄O₂", "Indexy prohozené."], ["C₂O₃", "Uhlík by měl III."]]}], "pomucka": "když jdou oba indexy vydělit, zkrať"},

function seedNahodny() { return (Math.random() * 4294967296) >>> 0; }
function novyStav() { return { planovac: Planovac.novy(F, seedNahodny()), cas: { uceni_s: 0, rano_s: 0, rano_otazek: 0, pauza: false, naRano: false }, ulozeno: 0, otazka: null }; }

const esc = s => String(s).replace(/[&<>"]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
function zamichej(a) { a = a.slice(); for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; }

function odhadMin(p) {

  if (!vynutit && podpis === posledniSouhrn) return;
  posledniSouhrn = podpis;
  Sledovani.udalost("rychlo_souhrn", "souhrn", d);
}
function udalost(u, sekce, detail) { if (window.Sledovani) Sledovani.udalost(u, sekce, detail); }
function oblast(k) { if (window.Sledovani) Sledovani.oblast(k); }
function toast(t) {
  const el = document.createElement("div"); el.id = "toast"; el.textContent = t; document.body.appendChild(el);
  setTimeout(() => el.classList.add("pryc"), 3500); setTimeout(() => el.remove(), 4300);
}
// dialog místo confirm() (blokující okna prohlížeče nepoužívat)
function dialog(text, tlacitka) {
  $("dText").textContent = text; const box = $("dTlacitka"); box.innerHTML = "";
  tlacitka.forEach(([popis, fn, hl]) => {
    const b = document.createElement("button"); b.type = "button"; b.className = "btn" + (hl ? " hl" : ""); b.textContent = popis;
    b.onclick = () => { $("dialog").hidden = true; if (fn) fn(); }; box.appendChild(b);
  });
  $("dialog").hidden = false;
}
// v02: časová osa – kolečko za každý fakt v pořadí konfigurace (kapitoly)
function vykresliOsu() {
  const osa = $("osa"), p = S && S.planovac;
  if (osa.children.length !== RYCHLO.fakta.length) osa.innerHTML = RYCHLO.fakta.map(() => "<i></i>").join("");
  RYCHLO.fakta.forEach((f, i) => {
    const x = p && p.fakta[f.id], w = p && p.fronta && p.fronta.prace[f.id];
    const cls = !x ? "" : x.naucen && !(p.rezim === "rano" && w && w.streak === 0 && w.posl >= 0) ? "nauceno"
      : w && w.streak === 0 && w.posl >= 0 ? "chyba" : (w || x.spatne + x.spravne > 0) ? "prace" : "";
    osa.children[i].className = cls + (OT && OT.id === f.id ? " ted" : "");
  });
}
function ukaz(sc) { vykresliOsu(); ["scUvod", "scOtazka", "scMezi"].forEach(x => { $(x).hidden = x !== sc; }); window.scrollTo(0, 0); }

/* ---------- úvod ---------- */
function uvod() {
  OT = null; zodpovezeno = null; oblast("Úvod"); ukaz("scUvod");
  $("uvodNadpis").textContent = RYCHLO.title;
  $("uvodText").innerHTML = "<p>Učíš se tím, že odpovídáš: u každé otázky vyber jednu možnost, a když nevíš, klepni na „Nevím“ – nehádej.</p>" +
    "<p>Po každé odpovědi hned uvidíš správnou odpověď a krátké vysvětlení.</p>" +
    "<p>Co ještě neumíš, se ti vrací, dokud to dvakrát po sobě neodpovíš správně; ráno si nejslabší věci zopakuješ tlačítkem „Ranní opakování“.</p>";
  const p = S && S.planovac, rozprac = p && p.n > 0;
  $("btnZacit").hidden = !!rozprac;
  $("btnPokracovat").hidden = !rozprac || p.rezim === "hotovo";
  $("btnZnovu").hidden = !rozprac;
  $("uvodStav").textContent = rozprac ? `Naučeno ${pocetNaucenych(p)} z ${F.length}` + (p.rezim === "rano" ? " · rozpracované ranní opakování" : p.rezim === "hotovo" ? " · hotovo" : p.rezim === "zaver" ? " · závěrečné kolo" : ` · zbývá asi ${odhadMin(p)} min`) : `${F.length} věcí k naučení, asi 45–60 minut.`;
}
function zacit(pokracovani) {
  if (!S) S = novyStav();
  udalost("rychlo_start", "start", { rezim: S.planovac.rezim, pokracovani: !!pokracovani, faktu: F.length, nauceno: pocetNaucenych(S.planovac), odpovedi: statistika(S.planovac).odpovedi, prevzato: prevzato || undefined });
  dalsiOtazka(true);
}
function ranniOpakovani() {
  if (!S) S = novyStav();
  const ulozeny = S.planovac.n > 0;
  S.planovac = Planovac.rano(S.planovac, F, KOSTRA);
  S.cas.rano_s = 0; S.cas.rano_otazek = 0;
  uloz();
  udalost("rychlo_rano", "ranní opakování", { ulozeny, poradi: S.planovac.fronta.nove.slice(0, 30), faktu: F.length });
  dalsiOtazka(true);
}
function zacitZnovu() {
  dialog("Začít znovu? Všechno, co máš naučené, se tu smaže (výsledky zůstanou v přehledu).", [
    ["Zrušit", null], ["Začít znovu", () => {
      if (S) udalost("rychlo_reset", "reset", souhrnDetail());
      smazStav(); S = novyStav(); uloz(); OT = null; zodpovezeno = null; uvod();
    }, true]]);
}

/* ---------- otázka ---------- */
function dalsiOtazka(obnovit) {
  zodpovezeno = null;
  const p = S.planovac;
  // obnovení po reloadu uprostřed otázky
  if (obnovit && S.otazka && FAKT[S.otazka.id] && S.otazka.rezim === p.rezim) {
    OT = Object.assign({}, S.otazka, { zobrazeno: Date.now() }); vykresli(); return;
  }
  if (nabidkaCasu()) return;
  const d = Planovac.dalsi(p, F);
  const predRezim = p.rezim;
  S.planovac = d.stav;
  if (!d.otazka) { uloz(); konecRezimu(predRezim); return; }
  if (predRezim === "uceni" && d.stav.rezim === "zaver" && !obnovit) { OT = null; uloz(); mezistrankaZaver(d.otazka); return; }
  pripravOtazku(d.otazka);
}
function pripravOtazku(o) {
  const f = FAKT[o.id], v = f.var[o.v];
  OT = Object.assign({}, o, { moznosti: zamichej([v.ok, ...v.s.map(x => x[0])]), odkryto: !KAP[f.kap].kostra, zobrazeno: Date.now() });
  uloz(); vykresli();
}
function vykresli() {
  const f = FAKT[OT.id], v = f.var[OT.v], p = S.planovac, k = KAP[f.kap];
  ukaz("scOtazka"); oblast(k.nazev);
  $("oKap").textContent = k.nazev;
  $("oRezim").textContent = p.rezim === "rano" ? "Ranní opakování" : p.rezim === "zaver" ? "Závěrečné kolo" : "";
  const nauc = pocetNaucenych(p);
  $("oStav").textContent = p.rezim === "rano" ? `otázka ${S.cas.rano_otazek + 1}` :
    p.rezim === "zaver" ? `${p.zaver.i + 1} z ${p.zaver.seznam.length}` : `Naučeno ${nauc} z ${F.length} · zbývá asi ${odhadMin(p)} min`;
  $("oLista").style.width = (p.rezim === "zaver" ? p.zaver.i / Math.max(1, p.zaver.seznam.length) : nauc / F.length) * 100 + "%";
  $("oZadani").textContent = v.t;
  $("vyhodnoceni").hidden = true;
  const box = $("moznosti"); box.innerHTML = "";
  OT.moznosti.forEach((m, i) => {
    const b = document.createElement("button"); b.type = "button"; b.className = "moznost"; b.textContent = m; b.dataset.i = i;
    b.onclick = () => odpovez(m, false); box.appendChild(b);
  });
  box.hidden = !OT.odkryto;
  $("oVduchu").hidden = OT.odkryto;
  $("btnUkazat").hidden = OT.odkryto;
  $("btnNevim").hidden = false; $("btnNevim").disabled = false;
}
function odkryj() {
  if (!OT || OT.odkryto) return;
  OT.odkryto = true; OT.odkryto_s = Math.round((Date.now() - OT.zobrazeno) / 1000); uloz(); vykresli();
}
function vysvetliSpatnou(f, v, text) {
  const x = v.s.find(s => s[0] === text); if (!x) return "";
  const e = x[1], P = RYCHLO.pojmy;
  if (P[e] !== undefined) return text === e ? `<b>${esc(e)}</b> = ${esc(P[e])}` : `„${esc(text)}“ – to je <b>${esc(e)}</b> = ${esc(P[e])}`;
  return `„${esc(text)}“ – ${esc(e)}`;
}
function odpovez(text, nevim) {
  if (!OT || zodpovezeno) return;
  if (!OT.odkryto && !nevim) return;
  const f = FAKT[OT.id], v = f.var[OT.v], spravne = !nevim && text === v.ok;
  const doba = Math.round((Date.now() - OT.zobrazeno) / 1000);
  zodpovezeno = { spravne, vybrala: nevim ? "nevím" : text, nevim, cas: Date.now() };
  const p0 = S.planovac, rezim = p0.rezim;
  const o = Planovac.odpoved(p0, F, OT, spravne);
  S.planovac = o.stav;
  const fs = S.planovac.fakta[OT.id];
  if (!spravne) fs.vybrala = fs.vybrala.concat(nevim ? "nevím" : text).slice(-20);
  if (rezim === "rano") S.cas.rano_otazek++;
  uloz();
  udalost("rychlo_odpoved", KAP[f.kap].nazev, { id: f.id, varianta: OT.v + 1, kapitola: f.kap, vybrala: zodpovezeno.vybrala, spravne, nevim,
    doba_s: doba, poradi: OT.poradi, rezim, otazka: v.t, spravna: v.ok, odkryto_s: OT.odkryto_s });
  if (o.naucen) udalost("rychlo_naucen", KAP[f.kap].nazev, { id: f.id, poradi: OT.poradi, spatne: fs.spatne, spravne: fs.spravne });
  if (S.planovac.n % 10 === 0) posliSouhrn(false);
  // vyhodnocení
  document.querySelectorAll("#moznosti .moznost").forEach(b => {
    b.disabled = true;
    if (b.textContent === v.ok) b.classList.add("spravna");
    else if (!nevim && b.textContent === text) b.classList.add("vybrana-spatne");
    else b.classList.add("ztlumena");
  });
  $("moznosti").hidden = false; $("oVduchu").hidden = true; $("btnUkazat").hidden = true;
  $("btnNevim").disabled = true;
  const vy = $("vyhodnoceni");
  vy.className = spravne ? "ok" : "bad";
  $("vVerdikt").textContent = spravne ? (o.naucen ? "✓ Správně – naučeno!" : "✓ Správně") : nevim ? "✗ Nevím – teď se to nauč:" : "✗ Špatně";
  $("vSpravna").innerHTML = "Správně: <b>" + esc(v.ok) + "</b>";
  $("vVysv").textContent = f.vysv;
  $("vPomucka").hidden = !f.pomucka; $("vPomucka").textContent = f.pomucka ? "Pomůcka: " + f.pomucka : "";
  const volba = !spravne && !nevim ? vysvetliSpatnou(f, v, text) : "";
  $("vVolba").hidden = !volba; $("vVolba").innerHTML = volba ? "Tvoje volba: " + volba : "";
  vy.hidden = false;
  vykresliOsu();
  zamekDo = Date.now() + NAST.zamekMs;
  // vyhodnocení i „Další“ musí být vidět
  requestAnimationFrame(() => { const r = $("btnDalsi").getBoundingClientRect(), dole = $("osa").getBoundingClientRect().top; if (r.bottom > dole - 10) window.scrollBy(0, r.bottom - dole + 20); });
}
function dalsiKlik() {
  if (!zodpovezeno || Date.now() < zamekDo) return;
  const p = S.planovac;
  if (p.rezim === "rano" && (S.cas.rano_otazek >= NAST.ranoOtazek || S.cas.rano_s >= NAST.ranoMin * 60) && !S.cas.ranoNabidnuto) {
    S.cas.ranoNabidnuto = true; uloz();
    dialog(`Ranní opakování: ${S.cas.rano_otazek} otázek za ${Math.round(S.cas.rano_s / 60)} min. Chceš pokračovat?`, [
      ["Konec", () => { posliSouhrn(true); S.planovac = Planovac.konecRano(S.planovac); uloz(); uvod(); }],
      ["Pokračovat", () => { S.cas.rano_otazek = 0; S.cas.rano_s = 0; S.cas.ranoNabidnuto = false; uloz(); dalsiOtazka(false); }, true]]);
    return;
  }
  dalsiOtazka(false);
}
// pauza po 25 min, po 60 min „zbytek na ráno“ (jen při učení, mezi otázkami)
function nabidkaCasu() {
  const p = S.planovac;
  if (p.rezim !== "uceni") return false;
  if (!S.cas.naRano && S.cas.uceni_s >= NAST.naRanoMin * 60) {
    S.cas.naRano = true; S.cas.pauza = true; uloz();
    udalost("rychlo_souhrn", "nabídka na ráno", Object.assign(souhrnDetail(), { nabidka: "na_rano" }));
    dialog(`Učíš se už hodinu (naučeno ${pocetNaucenych(p)} z ${F.length}). Zbytek nech na ráno – ráno klepni na „Ranní opakování“, nebo „Pokračovat“.`, [
      ["Konec na dnes", () => uvod()], ["Ještě pokračovat", () => dalsiOtazka(false), true]]);
    return true;
  }
  if (!S.cas.pauza && S.cas.uceni_s >= NAST.pauzaMin * 60) {
    S.cas.pauza = true; uloz();
    dialog(`Učíš se už ${NAST.pauzaMin} minut. Dej si krátkou pauzu (5 minut) – protáhni se, napij se. Pak pokračuj.`, [["Pokračovat", () => dalsiOtazka(false), true]]);
    return true;
  }
  return false;
}
function mezistrankaZaver(prvni) {
  ukaz("scMezi"); oblast("Závěrečné kolo");
  const n = S.planovac.zaver.seznam.length;
  $("mNadpis").textContent = "Všechno naučeno!";
  $("mText").textContent = `Teď závěrečné kolo: ${n} ${n === 1 ? "otázka" : n < 5 ? "otázky" : "otázek"} z toho, co ti dělalo potíže – každá jednou, jinak položená.`;
  $("mTabulka").innerHTML = "";
  const t = $("mTlacitka"); t.innerHTML = "";
  const b = document.createElement("button"); b.type = "button"; b.className = "btn hl"; b.id = "btnZaver"; b.textContent = "Spustit závěrečné kolo";
  b.onclick = () => pripravOtazku(prvni); t.appendChild(b);
  posliSouhrn(true);
}
function konecRezimu(rezim) {
  if (rezim === "rano") {
    posliSouhrn(true);
    S.planovac = Planovac.konecRano(S.planovac); uloz();
    ukaz("scMezi"); oblast("Souhrn");
    $("mNadpis").textContent = "Ranní opakování hotové";
    $("mText").textContent = "Všechno z ranního opakování jsi odpověděla správně. Hodně štěstí v testu!";
    $("mTabulka").innerHTML = "";
    tlacitkaSouhrnu();
    return;
  }
  souhrn();
}
function souhrn() {
  const p = S.planovac, st = statistika(p);
  ukaz("scMezi"); oblast("Souhrn");
  posliSouhrn(true);
  $("mNadpis").textContent = "Hotovo!";
  $("mText").textContent = `Naučeno ${pocetNaucenych(p)} z ${F.length}. Odpovědí ${st.odpovedi}, správně napoprvé ${st.spravne_napoprve_pct ?? 0} %, ` +
    `čas asi ${Math.round(S.cas.uceni_s / 60)} min. Ráno si dej „Ranní opakování“.`;
  const slabe = F.filter(f => p.fakta[f.id].spatne > 0).sort((a, b) => p.fakta[b.id].spatne - p.fakta[a.id].spatne).slice(0, 12);
  $("mTabulka").innerHTML = slabe.length ? "<table class='slabe'><tr><th>Co ti dělalo potíže</th><th>chyb</th></tr>" +
    slabe.map(f => `<tr><td>${esc(FAKT[f.id].var[0].t)}<br><span class="muted">${esc(FAKT[f.id].var[0].ok)}</span></td><td>${p.fakta[f.id].spatne}</td></tr>`).join("") + "</table>" : "";
  tlacitkaSouhrnu();
}
function tlacitkaSouhrnu() {
  const t = $("mTlacitka"); t.innerHTML = "";
  [["Ranní opakování", ranniOpakovani, true], ["Úvod", uvod], ["Začít znovu", zacitZnovu]].forEach(([l, fn, hl]) => {
    const b = document.createElement("button"); b.type = "button"; b.className = "btn" + (hl ? " hl" : ""); b.textContent = l; b.onclick = fn; t.appendChild(b);
  });
}

/* ---------- čas učení (jen viditelná stránka s otázkou, bez dlouhé nečinnosti) ---------- */
let tik = Date.now(), posledniVstup = Date.now();
["pointerdown", "keydown", "touchstart"].forEach(t => window.addEventListener(t, () => { posledniVstup = Date.now(); }, { passive: true, capture: true }));
setInterval(() => {
  const now = Date.now(), d = Math.min(now - tik, 5000) / 1000; tik = now;
  if (!S || document.visibilityState !== "visible" || $("scOtazka").hidden || now - posledniVstup > NAST.necinnostS * 1000) return;
  if (S.planovac.rezim === "rano") S.cas.rano_s += d; else S.cas.uceni_s += d;
}, 1000);
setInterval(() => { if (S && document.visibilityState === "visible") uloz(); }, 15000);
document.addEventListener("visibilitychange", () => { if (document.visibilityState === "hidden") { uloz(); posliSouhrn(false); } else tik = Date.now(); });
window.addEventListener("pagehide", () => { uloz(); posliSouhrn(false); });

/* ---------- ovládání ---------- */
$("btnZacit").onclick = () => zacit(false);
$("btnPokracovat").onclick = () => zacit(true);
$("btnRano").onclick = ranniOpakovani;
$("btnZnovu").onclick = zacitZnovu;
$("btnUkazat").onclick = odkryj;
$("btnNevim").onclick = () => { if (!OT || zodpovezeno) return; if (!OT.odkryto) { OT.odkryto = true; } odpovez("", true); };
$("btnDalsi").onclick = dalsiKlik;
$("btnUvod").onclick = () => { uloz(); uvod(); };
$("btnHome").onclick = () => { uloz(); posliSouhrn(false); if (window.Zaznam) Zaznam.beacon(); location.href = "../index.html"; };

/* ---------- jen pro čtení (kontrola) ---------- */
window.Rychlouceni = Object.freeze({
  stav: () => (S ? JSON.parse(JSON.stringify(S)) : null),
  otazka: () => {
    if (!OT) return null;
    const f = FAKT[OT.id], v = f.var[OT.v];
    return { id: OT.id, varianta: OT.v, rezim: OT.rezim, poradi: OT.poradi, text: v.t, moznosti: OT.moznosti.slice(), spravna: OT.moznosti.indexOf(v.ok),
      spravnaText: v.ok, kostra: !!KAP[f.kap].kostra, odkryto: !!OT.odkryto, zodpovezeno: !!zodpovezeno };
  },
  planovac: Planovac,
  poradiFaktu: () => F.map(f => Object.assign({}, f)),
  nastaveni: Object.freeze(Object.assign({}, NAST))
});

S = nactiStav();
if (S && prevzato) { uloz(); toast("Pokračuješ, kde jsi skončila ve starší verzi."); }
uvod();
</script>
</body>
</html>
