<!--
  ŠABLONA RYCHLOUČENÍ – Ann School (system/Sablona_rychlouceni_vXX.html)
  Nové Rychloučení = kopie této šablony do složky předmětu: <předmět>/<tema>_rychlouceni_vXX.html.
  Měň JEN bloky HLAVIČKA (<title>), NÁZEV V PANELU (název a verze) a KONFIGURACE RYCHLOUČENÍ. Postup: system/Navod_rychlouceni_vXX.md.
  v01 (09.11.2026): učení formou testu.
  v02 (09.11.2026): časová osa dole – kolečko za každý fakt v pořadí kapitol (šedá = ještě nebylo, oranžová = učí se,
       červená = poslední odpověď špatně, zelená = naučeno; aktuální otázka orámovaná).
  - Fakt = jedna věc, kterou má žák umět (stálé id, kapitola, priorita jadro / doplnek, 2+ varianty otázky).
    Otázka = výběr z 5 zamíchaných možností + „Nevím“ (počítá se jako špatně). Po odpovědi hned vyhodnocení,
    vysvětlení, pomůcka a co znamená vybraná špatná možnost (ze slovníku POJMY). „Další“ je pod vyhodnocením,
    400 ms po vyhodnocení se na klepnutí nereaguje (dvojité klepnutí nepřeskočí vysvětlení).
  - Plánovač (čistá funkce bez DOM, Rychlouceni.planovac): fronta podle toho, kdy je fakt na řadě – špatně za 3 otázky,
    správně za 6; vždy fakt, který je na řadě nejdřív; když nic není na řadě a v práci je < 8 faktů, přidá nový
    (nejdřív jadro, kapitoly v pořadí); jinak nejbližší i dřív. Nikdy stejný fakt dvakrát po sobě (kromě posledního).
    Naučený = 2 správné odpovědi za sebou s jinou otázkou mezi nimi (u posledního faktu je mezi nimi výplň = naučený
    fakt s nejvíc chybami). Varianta = nejdéle nepoužitá, jiná než minule.
  - Kapitola s kostra: true – možnosti až po „Ukázat možnosti“ (nejdřív si odpověď řekne v duchu).
  - Závěrečné kolo: fakta s aspoň jednou chybou, promíchaná, každé jednou v jiné variantě.
  - Ranní opakování: nejslabší fakta (nejvíc chyb, pak nejméně správných), stačí 1 správná odpověď; po 10 min
    nebo 30 otázkách nabídne „Pokračovat“. Bez uloženého stavu: nejdřív kostra, pak náhodně.
  - Pauza po 25 min učení, po 60 min „Zbytek nech na ráno“. Odhad zbývajícího času podle úspěšnosti a tempa.
  - Stav po každé odpovědi v localStorage „annschool:rychlouceni:<cesta>“; nová verze stránky převezme stav
    z nejvyšší starší verze (Sledovani.zPredchoziVerze), fakta podle id.
  - Záznam (sledovani.js, Sledovani.udalost): rychlo_start, rychlo_odpoved, rychlo_naucen, rychlo_souhrn,
    rychlo_reset, rychlo_rano; oblast = kapitola. Pro kontrolu jen pro čtení window.Rychlouceni { stav(), otazka() }.
  - Na stránce se nic neoznačuje dlouhým stiskem (jako šablona testu v22), malá tlačítka, touch-action: manipulation.
-->

<style>
  :root {
    --bg: #fafaf7; --paper: #ffffff; --text: #1d1d1b; --muted: #6b6b66; --line: #dcdcd5;
    --ok: #1f7a3a; --ok-bg: #e6f4ea; --bad: #b3261e; --bad-bg: #fbe9e7; --accent: #2b5cab; --panel-h: 48px;
  }
  * { box-sizing: border-box; }
  html { -webkit-text-size-adjust: 100%; }
  /* dlouhý stisk (dlaň, prst, pero) nic neoznačuje ani neotevře nabídku */
  html, body { -webkit-user-select: none; user-select: none; -webkit-touch-callout: none; }
  body { margin: 0; background: var(--bg); color: var(--text); font: 17px/1.45 -apple-system, "Segoe UI", Roboto, sans-serif;
    -webkit-tap-highlight-color: transparent; }
  button { touch-action: manipulation; font: inherit; cursor: pointer; }

  /* ---------- horní panel ---------- */
  #panel { position: fixed; top: 0; left: 0; right: 0; z-index: 20; min-height: var(--panel-h);
    padding: 6px 12px; padding-top: calc(6px + env(safe-area-inset-top));
    background: rgba(255,255,255,.97); border-bottom: 1px solid var(--line); display: flex; align-items: center; gap: 12px; }
  .panel-title { flex: 1 1 auto; min-width: 0; font-size: 15px; font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .panel-title .ver { color: var(--muted); font-weight: 400; }
  .panel-actions, .panel-home { flex: 0 0 auto; display: flex; gap: 6px; }
  .btn { font-size: 14px; line-height: 1.25; padding: 4px 10px; border-radius: 8px; border: 1px solid var(--accent);
    background: var(--paper); color: var(--accent); white-space: nowrap; }
  .btn.hl { background: var(--accent); color: #fff; }
  .btn.tiche { border-color: var(--line); color: var(--muted); }
  .btn:disabled { opacity: .4; cursor: default; }
  @media (max-width: 700px) { .panel-home .lbl { display: none; } }

  main { max-width: 820px; margin: 0 auto; padding: calc(var(--panel-h) + env(safe-area-inset-top) + 14px) 16px 110px; }
  .obrazovka[hidden] { display: none; }
  h1 { font-size: 22px; margin: 4px 0 8px; }
  .muted { color: var(--muted); font-size: 14px; }
  .radek { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; margin: 14px 0; }

  /* ---------- úvod ---------- */
  #uvodText p { margin: 6px 0; }
  .stavUceni { margin: 12px 0; font-size: 15px; }

  /* ---------- otázka ---------- */
  .hlava { display: flex; flex-wrap: wrap; gap: 4px 12px; align-items: baseline; font-size: 13px; color: var(--muted); }
  .hlava .kap { flex: 1 1 auto; min-width: 0; }
  .hlava .rez { font-weight: 600; color: var(--accent); }
  .lista { height: 5px; background: var(--line); border-radius: 3px; margin: 6px 0 14px; overflow: hidden; }
  .lista i { display: block; height: 100%; width: 0; background: var(--ok); transition: width .3s; }
  .zadani { font-size: 20px; font-weight: 600; margin: 0 0 12px; overflow-wrap: anywhere; }
  .vduchu { font-size: 14px; color: var(--muted); margin: 0 0 10px; }
  #moznosti { display: flex; flex-direction: column; gap: 8px; }
  #moznosti[hidden] { display: none; }
  .moznost { text-align: left; font-size: 16px; line-height: 1.35; padding: 8px 12px; border-radius: 8px;
    border: 2px solid var(--line); background: var(--paper); color: var(--text); overflow-wrap: anywhere; }
  .moznost:disabled { cursor: default; }
  .moznost.spravna { border-color: var(--ok); background: var(--ok-bg); }
  .moznost.vybrana-spatne { border-color: var(--bad); background: var(--bad-bg); }
  .moznost.ztlumena { opacity: .55; }
  .pod { display: flex; gap: 8px; align-items: center; margin-top: 10px; min-height: 30px; }
  #vyhodnoceni { margin-top: 14px; padding: 10px 14px 12px; border-radius: 10px; border: 1px solid var(--line); background: var(--paper); }
  #vyhodnoceni[hidden] { display: none; }
  #vyhodnoceni.ok { border-color: var(--ok); }
  #vyhodnoceni.bad { border-color: var(--bad); }
  #vyhodnoceni .verdikt { font-weight: 700; font-size: 17px; }
  #vyhodnoceni.ok .verdikt { color: var(--ok); }
  #vyhodnoceni.bad .verdikt { color: var(--bad); }
  #vyhodnoceni p { margin: 6px 0; font-size: 16px; }
  #vyhodnoceni .pomucka { font-size: 15px; color: #2f3d57; background: #eef4fb; border-radius: 6px; padding: 4px 8px; }
  #vyhodnoceni .volba { font-size: 15px; color: #5c2a20; }
  .dalsiRadek { display: flex; justify-content: flex-end; margin-top: 10px; }

  /* ---------- souhrn, mezistránka ---------- */
  table.slabe { border-collapse: collapse; font-size: 14px; margin-top: 8px; width: 100%; }
  table.slabe td, table.slabe th { padding: 4px 6px; border-bottom: 1px solid var(--line); text-align: left; vertical-align: top; overflow-wrap: anywhere; }

  /* ---------- dialog ---------- */
  #dialog { position: fixed; inset: 0; z-index: 40; background: rgba(0,0,0,.35); display: flex; align-items: center; justify-content: center; padding: 16px; }
  #dialog[hidden] { display: none; }
  #dialog .box { background: var(--paper); border-radius: 12px; padding: 16px 18px; max-width: 460px; width: 100%; box-shadow: 0 6px 30px rgba(0,0,0,.25); }
  #dialog .box p { margin: 0 0 12px; }
  #dialog .tl { display: flex; gap: 8px; justify-content: flex-end; flex-wrap: wrap; }
  /* ---------- v02: časová osa dole ---------- */
  #osa { position: fixed; left: 0; right: 0; bottom: 0; z-index: 15; background: rgba(255,255,255,.97); border-top: 1px solid var(--line);
    padding: 6px 12px; padding-bottom: calc(6px + env(safe-area-inset-bottom)); display: flex; flex-wrap: wrap; gap: 4px; justify-content: center; }
  #osa i { width: 12px; height: 12px; border-radius: 50%; background: var(--line); display: block; }
  #osa i.prace { background: #e08a00; }
  #osa i.chyba { background: var(--bad); }
  #osa i.nauceno { background: var(--ok); }
  #osa i.ted { outline: 2px solid var(--text); outline-offset: 1px; }
  #toast { position: fixed; left: 50%; top: calc(var(--panel-h) + 8px); transform: translateX(-50%); z-index: 30;
    background: #1d1d1b; color: #fff; font-size: 14px; padding: 6px 14px; border-radius: 8px; opacity: .92;
    transition: opacity .6s; pointer-events: none; max-width: 90vw; text-align: center; }
  #toast.pryc { opacity: 0; }
</style>
</head>
<body>

 {"id": "m2-otzi-nalez", "kap": "k6", "pri": "jadro", "vysv": "Ötzi byl nalezen v roce 1991 v ledovci v Ötztalských Alpách (Rakousko/Itálie), žil asi 3300 př. n. l. (eneolit).", "var": [{"t": "Kde byl nalezen Ötzi?", "ok": "v ledovci v Alpách", "s": [["v egyptské pyramidě", "to by byla mumie faraona"], ["v rašelině v Dánsku", "Ötzi je z Alp"], ["v jeskyni Lascaux", "Lascaux je jeskyně s malbami"], ["v Dolních Věstonicích", "tam je naleziště lovců mamutů"]]}, {"t": "Ve kterém období žil Ötzi?", "ok": "v eneolitu (asi 3300 př. n. l.)", "s": [["v paleolitu", "měl měděnou sekeru – to je doba měděná"], ["v době železné", "neměl železo"], ["v době římské", "je o víc než 3 000 let starší"], ["v mezolitu", "měď v mezolitu ještě neznali"]]}]},
 {"id": "o3-nalez", "kap": "k6", "pri": "jadro", "vysv": "Ötziho našli turisté roku 1991 v ledovci v Ötztalských Alpách na hranici Rakouska a Itálie.", "var": [{"t": "Ve kterém roce byl Ötzi nalezen?", "ok": "1991", "s": [["1922", "roku 1922 objevil Howard Carter Tutanchamonovu hrobku"], ["1974", "roku 1974 byla objevena terakotová armáda"], ["1950", "roku 1950 sestavil V. G. Childe 10 znaků civilizace"], ["1891", "Ötzi byl nalezen až o sto let později, roku 1991"]]}, {"t": "Na hranici kterých dvou států byl Ötzi nalezen?", "ok": "Rakouska a Itálie", "s": [["Francie a Španělska", "tam jsou jeskyně s malbami (Lascaux, Altamira), Ötzi je z Alp"], ["Německa a Česka", "Ötztalské Alpy leží mezi Rakouskem a Itálií"], ["Švýcarska a Francie", "Ötztalské Alpy leží mezi Rakouskem a Itálií"], ["Egypta a Izraele", "Ötzi je z evropských Alp, ne z Předního východu"]]}, {"t": "Kdo našel Ötziho?", "ok": "turisté v horách", "s": [["archeologové při vykopávkách města", "našli ho náhodou turisté v ledovci"], ["Howard Carter", "ten objevil Tutanchamonovu hrobku"], ["Bedřich Hrozný", "ten rozluštil jazyk Chetitů (chetitštinu)"], ["dělníci při stavbě pyramidy", "Ötzi ležel v ledovci v Alpách, našli ho turisté"]]}]},
 {"id": "o3-zobecneni", "kap": "k6", "pri": "jadro", "vysv": "Z Ötziho můžeme zobecnit, že jeho současníci uměli vyrábět nástroje, zbraně a oblečení, zpracovat kůže, rozdělat oheň, znali měď, léčili se – a docházelo mezi nimi k násilným konfliktům. Mumie je dnes v muzeu v italském Bolzanu.", "var": [{"t": "Co můžeme z Ötziho nálezu zobecnit na jeho současníky?", "ok": "uměli zpracovat kůže, rozdělat oheň, znali měď a léčili se", "s": [["uměli číst a psát a vedli si záznamy", "písmo tehdy v Evropě nebylo"], ["vyráběli železné zbraně a nástroje", "železo se v Evropě šířilo až o víc než 2 000 let později"], ["stavěli pyramidy pro své vládce", "pyramidy stavěli Egypťané"], ["všichni měli na těle 61 tetování", "to platí jen pro Ötziho, zobecnit to nejde"]]}, {"t": "Kde je dnes uložena Ötziho mumie?", "ok": "v muzeu v italském Bolzanu", "s": [["v Údolí králů", "tam je mumie Tutanchamona"], ["v Národním muzeu v Praze", "Ötzi je v Bolzanu v Itálii"], ["u města Si-an", "u Si-anu je terakotová armáda"], ["zůstala v ledovci", "mumie je v chladicí komoře muzea"]]}]},
 {"id": "m-otzi-tet", "kap": "k6", "pri": "doplnek", "vysv": "Ötziho 61 tetování je na místech postižených artrózou – asi šlo o léčbu.", "var": [{"t": "Proč měl Ötzi 61 tetování?", "ok": "asi kvůli léčbě bolestí kloubů (artróza)", "s": [["jako ozdobu na svatbu", "tetování jsou na místech, kde ho bolely klouby"], ["jako značku otroka", "měl cennou měděnou sekeru – nebyl to otrok"], ["jako válečné vyznamenání", "souvisí s místy bolesti kloubů"], ["aby ho poznali v ledovci", "do ledovce se dostal až po smrti; tetování jsou na bolavých kloubech"]]}, {"t": "Který předmět ukazuje, že Ötzi byl asi vážený muž?", "ok": "měděná sekera", "s": [["boty z medvědí kůže", "boty měli všichni, kdo chodili do hor"], ["nádobka z březové kůry", "ta sloužila k přenášení ohně"], ["nedokončený luk", "luk měl každý lovec"], ["sušené houby", "houby byly lék nebo troud"]]}]},
 {"id": "m2-otzi-prameny", "kap": "k6", "pri": "doplnek", "vysv": "Ötzi: krev dvou lidí na hrotu šípu, krev cizího člověka na kabátě, jídlo (kozorožec) méně než 2 h před smrtí, nádobka s uhlíky na oheň.", "var": [{"t": "Co ukazuje nádobka z březové kůry s uhlíky v javorových listech?", "ok": "Ötzi přenášel oheň", "s": [["Ötzi vařil polévku", "uhlíky v listech slouží k přenášení ohně"], ["Ötzi byl kovář", "kováře ukazují spíš kovové nástroje"], ["Ötzi pil čaj", "v nádobce byly uhlíky"], ["Ötzi byl nemocný", "zdraví ukazuje nehet"]]}, {"t": "Co ukazuje obsah Ötziho žaludku (maso kozorožce méně než 2 h před smrtí)?", "ok": "krátce před smrtí v klidu jedl – útok nečekal", "s": [["umřel hlady", "méně než 2 h před smrtí jedl"], ["byl vegetarián", "jedl maso"], ["byl otráven masem", "nic tomu nenasvědčuje"], ["byl lovcem mamutů", "mamuti v jeho době v Alpách nežili"]]}]},
 {"id": "o3-vybava", "kap": "k6", "pri": "doplnek", "vysv": "Ötzi měl boty a čepici z medvědí kůže, kabát z kůží sešitých šlachami a kalhoty z kozí kůže – byl dobře vybavený na hory a chlad.", "var": [{"t": "Co plyne z Ötziho oblečení (boty a čepice z medvědí kůže, kožený kabát a kalhoty)?", "ok": "byl dobře vybavený na hory a chlad", "s": [["lidé tehdy nosili hedvábí", "jeho oblečení bylo z kůží; hedvábí pochází z Číny"], ["byl to kněz", "z oblečení se to poznat nedá"], ["žil v teplém podnebí u moře", "teplé kožené oblečení ukazuje na hory a chlad"], ["oblečení si koupil za mince", "mince v jeho době neexistovaly"]]}, {"t": "Z čeho měl Ötzi boty a čepici?", "ok": "z medvědí kůže", "s": [["z hedvábí", "hedvábí pochází z Číny"], ["z ovčí vlny", "boty a čepice byly z medvědí kůže"], ["z bronzu", "bronz je kov – a v Ötziho době ho v Evropě ještě neznali"], ["z březové kůry", "z březové kůry měl nádobku na uhlíky"]]}]},
 {"id": "o3-boj", "kap": "k6", "pri": "doplnek", "vysv": "Krev dvou lidí na hrotu šípu, krev dalšího člověka na dýce, podlitiny a řezy na rukou ukazují, že Ötzi krátce před smrtí bojoval.", "var": [{"t": "Co plyne z toho, že na hrotu Ötziho šípu byla krev dvou různých lidí?", "ok": "šípem zranil nebo zabil dva lidi a šíp si vzal zpět", "s": [["ulovil dva kozorožce", "šlo o krev lidí, ne zvířat"], ["šíp nikdy nepoužil", "krev na hrotu ukazuje, že ho použil"], ["dvakrát se při výrobě šípu sám řízl", "krev patřila dvěma různým lidem"], ["šíp dostal darem od kněze", "nic takového z pramene neplyne"]]}, {"t": "Co ukazují podlitiny, řezy na rukou a krev cizího člověka na Ötziho dýce?", "ok": "krátce před smrtí bojoval", "s": [["zemřel na artrózu", "artróza je nemoc kloubů, řezy nezpůsobí"], ["byl dlouho nemocný", "to ukázal rozbor nehtu, ne zranění"], ["byl bohatý", "na to ukazuje měděná sekera"], ["uměl rozdělat oheň", "na to ukazuje nádobka s uhlíky a křesací kamínek"]]}]},
 {"id": "o3-zdravi", "kap": "k6", "pri": "doplnek", "vysv": "Rozbor nehtu ukázal, že Ötzi byl za posledních 6 měsíců třikrát vážně nemocen. Trpěl artrózou (bolestivou nemocí kloubů) a zemřel asi ve 40–45 letech.", "var": [{"t": "Co ukázal rozbor Ötziho nehtu?", "ok": "za posledních 6 měsíců byl třikrát vážně nemocen", "s": [["co jedl před smrtí", "to ukázal obsah žaludku"], ["že uměl psát", "písmo v jeho době v Evropě nebylo"], ["že měl 61 tetování", "tetování jsou vidět na kůži"], ["jakou měl měděnou sekeru", "sekera se našla u něj, z nehtu se poznají nemoci"]]}, {"t": "V kolika letech asi Ötzi zemřel?", "ok": "asi ve 40–45 letech", "s": [["v 18–19 letech", "tak mladý zemřel Tutanchamon"], ["asi v 10 letech", "byl to dospělý muž"], ["asi v 90 letech", "zemřel kolem 40–45 let"], ["asi ve 25 letech", "zemřel kolem 40–45 let"]]}, {"t": "Co je artróza, kterou Ötzi trpěl?", "ok": "bolestivá nemoc kloubů", "s": [["nemoc zubů z obilné stravy", "to jsou zubní kazy"], ["zranění šípem", "šíp byl příčinou smrti, artróza je nemoc"], ["otrava jídlem", "artróza je nemoc kloubů"], ["oční zákal", "oční zákal uměli operovat indičtí lékaři"]]}]},
 {"id": "c-pricina", "kap": "k7", "pri": "jadro", "vysv": "Víc jídla → víc lidí → potřeba organizace (zavlažování) → vládci, úředníci, daně, města a písmo.", "var": [{"t": "Co je důsledkem vzniku prvních civilizací?", "ok": "vznik měst, vládců, daní a písma", "s": [["návrat ke kočovnému životu", "lidé byli usedlí"], ["konec zemědělství", "zemědělství bylo základem civilizací"], ["rovnost všech lidí", "naopak vznikla nerovnost a vrstvy"], ["vznik doby kamenné", "doba kamenná byla dávno předtím"]]}, {"t": "Proč lidé u řek potřebovali společnou organizaci a vládce?", "ok": "kvůli stavbě zavlažovacích kanálů a správě zásob", "s": [["kvůli lovu mamutů", "mamuty lovili lovci v paleolitu"], ["kvůli výrobě bronzu", "bronz nebyl důvodem vzniku států"], ["protože neměli vodu", "u řek vody bylo dost – šlo o to ji rozvést"], ["kvůli olympijským hrám", "ty vznikly až v Řecku 776 př. n. l."]]}]},
 {"id": "c2-zacatek", "kap": "k7", "pri": "jadro", "vysv": "Nejstarší civilizace vznikly v Mezopotámii a Egyptě ve 4. tisíciletí př. n. l. – tam začíná starověk, v Evropě trvá pravěk.", "var": [{"t": "Kde začal starověk nejdřív?", "ok": "v Mezopotámii a Egyptě", "s": [["v Řecku", "Řecko patří do antiky, ta začala až v 8. stol. př. n. l."], ["v Římě", "Řím je antika"], ["v Čechách", "u nás tehdy trval pravěk"], ["v Číně", "čínská civilizace vznikla až o víc než tisíc let později"]]}, {"t": "Ve kterém tisíciletí vznikly první civilizace?", "ok": "ve 4. tisíciletí př. n. l.", "s": [["v 1. tisíciletí n. l.", "to už byla antika i středověk"], ["v 10. tisíciletí př. n. l.", "tehdy začínalo zemědělství"], ["ve 2. tisíciletí př. n. l.", "tehdy už civilizace dávno existovaly"], ["v paleolitu", "v paleolitu žili lovci a sběrači"]]}]},
 {"id": "s3-deleni", "kap": "k7", "pri": "jadro", "vysv": "Starověk dělíme na nejstarší civilizace (asi 4. tisíciletí – 8. stol. př. n. l.) a antiku (8. stol. př. n. l. – 476 n. l.). Roku 476 n. l. zanikla Západořímská říše.", "var": [{"t": "Na které dvě části dělíme starověk?", "ok": "nejstarší civilizace a antika", "s": [["paleolit a neolit", "to jsou části doby kamenné (pravěk)"], ["doba bronzová a železná", "to jsou doby pravěku"], ["Stará a Nová říše", "tak se dělí dějiny Egypta"], ["halštat a latén", "to jsou části doby železné"]]}, {"t": "Kdy trvala antika?", "ok": "8. stol. př. n. l. – 476 n. l.", "s": [["4. tisíciletí – 8. stol. př. n. l.", "to je období nejstarších civilizací"], ["2700–2180 př. n. l.", "to je egyptská Stará říše"], ["750 př. n. l. – přelom letopočtu", "to je doba železná"], ["476–1492 n. l.", "rokem 476 antika končí"]]}, {"t": "Co se stalo roku 476 n. l.?", "ok": "zanikla Západořímská říše", "s": [["Egypt se stal římskou provincií", "to bylo roku 30 př. n. l."], ["vzniklo první písmo", "písmo vzniklo už ve 4. tisíciletí př. n. l."], ["Alexandr Makedonský dobyl Egypt", "to bylo roku 332 př. n. l."], ["byla sjednocena Čína", "to bylo roku 221 př. n. l."]]}]},
 {"id": "s3-reky", "kap": "k7", "pri": "jadro", "vysv": "Egypt vznikl u Nilu, Mezopotámie u Eufratu a Tigridu, Indie u Indu (a Gangy), Čína u Žluté řeky a Jang-c'-ťiang. V Mezopotámii stavěli zavlažovací kanály a zařízení na zvedání vody. Egypt je z 95 % poušť.", "var": [{"t": "U které řeky vznikla nejstarší indická civilizace?", "ok": "Indus", "s": [["Nil", "u Nilu vznikl Egypt"], ["Eufrat", "Eufrat teče Mezopotámií"], ["Žlutá řeka", "u Žluté řeky vznikla Čína"], ["Jordán", "Jordán teče Palestinou"]]}, {"t": "Jak si zemědělci v Mezopotámii zajistili vodu na pole?", "ok": "stavěli kanály a zařízení na zvedání vody", "s": [["čekali jen na déšť a nic nestavěli", "úrodu zajistilo umělé zavlažování z řek"], ["vozili na pole vodu z moře", "mořská voda je slaná, vodu brali z řek"], ["tavili sníh přinesený z hor", "vodu brali z Eufratu a Tigridu"], ["vodu na pole vůbec nepotřebovali", "bez zavlažování by v suchém kraji nic nevyrostlo"]]}, {"t": "Proč skoro všichni Egypťané žili v úzkém pásu podél Nilu?", "ok": "zbytek země je poušť", "s": [["jinde byly husté lesy", "Egypt je z 95 % poušť"], ["faraon jinde bydlet zakázal", "důvodem je poušť – žít se dalo jen u řeky"], ["jinde žili Chetité", "Chetité žili v Malé Asii"], ["u Nilu nebyly daně", "daně se platily; rozhodovala voda a úrodná půda"]]}]},
 {"id": "s3-priciny", "kap": "k7", "pri": "jadro", "vysv": "Příčiny vzniku civilizací: usazení na jednom místě, lepší úroda, zavlažování, víc lidí. Důsledky: města a státy, vládci a úředníci, daně, písmo, specializace (řemeslníci, kněží, vojáci, které živí zemědělci) a společenská nerovnost.", "var": [{"t": "Co patří mezi PŘÍČINY vzniku prvních civilizací?", "ok": "lepší úroda díky zavlažování a růst počtu lidí", "s": [["vznik písma", "písmo je až důsledek – stát potřeboval evidenci"], ["vybírání daní", "daně jsou až důsledek vzniku státu"], ["společenská nerovnost", "nerovnost je až důsledek"], ["vznik úředníků", "úředníci jsou až důsledek – stát je potřeboval ke správě"]]}, {"t": "Co znamená specializace ve starověké společnosti?", "ok": "každý dělá jedno povolání, třeba řemeslník nebo kněz", "s": [["každý si všechno potřebné vyrábí sám", "to je opak specializace"], ["všichni lidé pracují jen jako zemědělci", "specializace znamená různá povolání"], ["lidé kočují za zvěří a nikde nezůstávají", "civilizace vznikly z usedlých zemědělců"], ["všichni lidé jsou si rovni a mají stejně", "se specializací přišla naopak nerovnost"]]}]},
 {"id": "c-childe", "kap": "k7", "pri": "doplnek", "vysv": "V. G. Childe (1950) – 10 znaků civilizace: města, specializace, daně, monumentální stavby, písmo, vědy, obchod…", "var": [{"t": "Co NEpatří mezi znaky civilizace podle V. G. Childa?", "ok": "kočovný způsob života", "s": [["velká městská centra", "to znak je"], ["monumentální architektura", "to znak je"], ["systém zaznamenávání informací", "to znak je"], ["dálkový obchod", "to znak je"]]}, {"t": "Proč nestačí říct, že civilizaci poznáme jen podle písma?", "ok": "některé civilizace (Peru, mexická vysočina) písmo nepoužívaly", "s": [["protože písmo vymysleli až Římané", "písmo je mnohem starší – Sumer"], ["protože písmo měly i tlupy lovců", "tlupy lovců písmo neměly"], ["protože písmo sloužilo jen k zábavě", "sloužilo hlavně k účetnictví"], ["protože písmo vzniklo v pravěku", "vznik písma je hranice pravěku a starověku"]]}]},
 {"id": "c2-pulmesic", "kap": "k7", "pri": "doplnek", "vysv": "Úrodný půlměsíc = oblast od Egypta přes Palestinu po Mezopotámii (tvar na mapě).", "var": [{"t": "Co je úrodný půlměsíc?", "ok": "úrodná oblast od Egypta přes Palestinu po Mezopotámii", "s": [["tvar Měsíce při první čtvrti", "jde o oblast na mapě, ne o Měsíc"], ["delta Nilu", "delta je jen část Egypta"], ["Kréta", "Kréta je ostrov ve Středozemním moři"], ["povodí Indu", "Indus je v Indii"]]}, {"t": "Proč vznikla civilizace právě v Egyptě?", "ok": "Nil se každý rok rozvodní a zanechá úrodné bahno", "s": [["v Egyptě hodně prší", "Egypt je suchý – vodu dává Nil"], ["Egypt má úrodné hory", "Egypt je z velké části poušť"], ["Egypt ležel u Perského zálivu", "Egypt je u Nilu a Středozemního moře"], ["Egypt založili Féničané", "Féničané žili na pobřeží dnešního Libanonu a Egypt nezaložili"]]}]},
 {"id": "c2-childe-mesta", "kap": "k7", "pri": "doplnek", "vysv": "Mezi Childovy znaky civilizace patří i monumentální architektura a umění a vědy pro praktické účely.", "var": [{"t": "Co je příkladem monumentální architektury?", "ok": "egyptské pyramidy", "s": [["dlouhé domy z neolitu", "to jsou obytné domy, ne monumentální stavby"], ["jeskynní malby", "to je umění, ne architektura"], ["pěstní klín", "to je nástroj"], ["oppidum", "oppidum je opevněné hradiště, ne monumentální chrám nebo hrobka"]]}, {"t": "Kdo sestavil 10 znaků civilizace?", "ok": "V. G. Childe", "s": [["Bedřich Hrozný", "Bedřich Hrozný"], ["Homér", "Homér"], ["Howard Carter", "Howard Carter"], ["Konfucius", "Konfucius"]]}]},
 {"id": "s3-childe", "kap": "k7", "pri": "doplnek", "vysv": "Australský archeolog Vere Gordon Childe sestavil roku 1950 deset znaků civilizace. Dnes se k nim přidává role války a armády, krále, rodiny a práva.", "var": [{"t": "Kolik znaků civilizace sestavil V. G. Childe a kdy?", "ok": "10 znaků, roku 1950", "s": [["3 znaky, roku 1922", "roku 1922 byla objevena Tutanchamonova hrobka"], ["7 znaků, roku 1991", "roku 1991 byl nalezen Ötzi"], ["12 znaků, roku 1850", "Childe jich sestavil 10 roku 1950"], ["5 znaků, roku 1974", "roku 1974 byla objevena terakotová armáda"]]}, {"t": "Co se dnes ke Childovým znakům civilizace přidává?", "ok": "role války a armády, krále, rodiny a práva", "s": [["kočovný způsob života", "civilizace jsou usedlé"], ["lov mamutů", "to patří do paleolitu"], ["jeskynní malby", "ty patří do paleolitu"], ["používání pěstního klínu", "to je nástroj paleolitu"]]}, {"t": "Který znak civilizace podle Childa souvisí s daněmi?", "ok": "výrobci odvádějí přebytky božstvu nebo vládci", "s": [["dálkový obchod", "to je dovoz surovin a luxusního zboží"], ["monumentální umění", "to jsou velké sochy a výzdoba"], ["velká městská centra", "to je znak o městech, ne o daních"], ["systém zaznamenávání informací", "to je písmo"]]}]},
 {"id": "c-piktogram", "kap": "k8", "pri": "jadro", "vysv": "Piktogramy = obrázky skutečných předmětů (Sumer 3500–3000 př. n. l.), sloužily hlavně k evidenci.", "var": [{"t": "Co jsou piktogramy?", "ok": "obrázky skutečných předmětů", "s": [["znaky pro slovo, pojem nebo myšlenku", "ideogramy"], ["znaky pro slabiky", "slabičné písmo"], ["znaky pro hlásky", "hláskové písmo"], ["klínky vtlačené do hlíny", "klínové písmo patří k ideogramům"]]}, {"t": "K čemu sloužilo nejstarší písmo nejčastěji?", "ok": "k evidenci – účetnictví zásob a daní", "s": [["k psaní básní", "literatura přišla až později"], ["k psaní dopisů přátelům", "to není hlavní účel nejstaršího písma"], ["k psaní zákonů", "zákoníky jsou pozdější"], ["ke zdobení keramiky", "zdobení není písmo"]]}]},
 {"id": "c-ideogram", "kap": "k8", "pri": "jadro", "vysv": "Ideogramy = znaky pro slovo, pojem nebo myšlenku: klínové písmo (Mezopotámie), hieroglyfy (Egypt).", "var": [{"t": "Které písmo patří k ideogramům a používalo se v Egyptě?", "ok": "hieroglyfy", "s": [["klínové písmo", "klínové písmo je z Mezopotámie"], ["latinka", "latinka je hláskové písmo"], ["řecká alfabeta", "alfabeta je hláskové písmo"], ["fénické písmo", "fénické písmo je hláskové"]]}, {"t": "Jaké písmo používali v Mezopotámii?", "ok": "klínové", "s": [["hieroglyfy", "hieroglyfy jsou egyptské"], ["latinku", "latinka je římská"], ["alfabetu", "alfabeta je řecká"], ["runy", "runy jsou germánské"]]}]},
 {"id": "c-hlaskove", "kap": "k8", "pri": "jadro", "vysv": "Hláskové písmo (abeceda) vzniklo ve 2. tisíciletí př. n. l.: jeden znak = jedna hláska.", "var": [{"t": "Co platí pro hláskové písmo?", "ok": "jeden znak = jedna hláska", "s": [["jeden znak = jedna slabika", "slabičné písmo"], ["jeden znak = jeden předmět", "piktogramy"], ["jeden znak = jeden pojem", "ideogramy"], ["má desítky tisíc znaků", "to má čínské písmo – hláskové jen 20–30"]]}, {"t": "Kdy vzniklo hláskové písmo?", "ok": "ve 2. tisíciletí př. n. l.", "s": [["v paleolitu", "v pravěku se nepsalo"], ["v 1. století n. l.", "to už Římané psali latinkou"], ["kolem 3500 př. n. l.", "to vznikly piktogramy"], ["až ve středověku", "abeceda je starší"]]}]},
 {"id": "p3-pocty", "kap": "k8", "pri": "jadro", "vysv": "Počet znaků: piktogramy obrovské množství, ideogramy tisíce, slabičné písmo desítky až stovky, hláskové 20–30. Čínské písmo má asi 50 000 znaků, běžně se jich užívá asi 3 000.", "var": [{"t": "Kolik znaků má přibližně hláskové písmo?", "ok": "20–30", "s": [["tisíce", "tolik mají ideogramy"], ["desítky až stovky", "tolik má slabičné písmo"], ["asi 50 000", "tolik znaků má čínské písmo"], ["2–3", "tak málo znaků žádné písmo nemá"]]}, {"t": "Které písmo má tisíce znaků a učit se je trvá roky?", "ok": "ideogramy", "s": [["hláskové písmo", "má jen 20–30 znaků"], ["slabičné písmo", "má desítky až stovky znaků"], ["latinka", "latinka je hláskové písmo"], ["fénická abeceda", "měla jen 22 znaků"]]}, {"t": "Kolik znaků čínského písma se běžně používá?", "ok": "asi 3 000", "s": [["26", "tolik písmen má latinka"], ["asi 50 000", "to je celkový počet znaků, běžně se jich užívá mnohem méně"], ["asi 100", "čínské písmo jich potřebuje tisíce"], ["22", "tolik znaků měla fénická abeceda"]]}]},
 {"id": "c2-ideogram-proc", "kap": "k8", "pri": "doplnek", "vysv": "Od piktogramů k ideogramům: abstraktní pojmy (spravedlnost, král) se nedají nakreslit a kreslení je pomalé.", "var": [{"t": "Proč lidé přešli od piktogramů k ideogramům?", "ok": "abstraktní pojmy se nedají nakreslit jako předmět", "s": [["piktogramy byly zakázané", "nikdo je nezakázal – jen nestačily na abstraktní pojmy"], ["ideogramy mají méně znaků než abeceda", "ideogramů jsou tisíce"], ["piktogramy neuměli číst", "šlo o to, co se dá zapsat"], ["chtěli psát jen hlásky", "to je až hláskové písmo"]]}, {"t": "Která nevýhoda patří k hláskovému písmu?", "ok": "text přečteš, jen když znáš jazyk", "s": [["má obrovské množství znaků", "to piktogramy a ideogramy"], ["nedají se jím psát složité texty", "hláskovým písmem se dají psát nejlépe"], ["každá slabika má zvláštní znak", "to slabičné písmo"], ["musí se všechno kreslit", "to piktogramy"]]}]},
 {"id": "c2-rebus", "kap": "k8", "pri": "doplnek", "vysv": "Slabičné písmo funguje jako rébus: obrázek „žá“ + obrázek „ba“ = žába.", "var": [{"t": "Které písmo funguje jako rébus (žá + ba = žába)?", "ok": "slabičné písmo", "s": [["piktogramy", "piktogramy"], ["hláskové písmo", "hláskové písmo"], ["ideogramy", "ideogramy"], ["emoji", "emoji jsou spíš ideogramy"]]}, {"t": "Kolik znaků má přibližně slabičné písmo?", "ok": "desítky až stovky", "s": [["několik tisíc", "tolik mají ideogramy"], ["desítky tisíc", "tolik má čínské písmo (ideogramy)"], ["jen 1", "jeden znak písmo neudělá"], ["přes 50 000", "tolik má čínské písmo celkem"]]}]},
 {"id": "c2-hieroglyfy", "kap": "k8", "pri": "doplnek", "vysv": "Hieroglyfy jsou egyptské; jméno panovníka se psalo do kartuše (oválu) – např. Kleopatra.", "var": [{"t": "Které písmo používá kartuše se jménem Kleopatra?", "ok": "hieroglyfy", "s": [["klínové písmo", "klínové písmo je mezopotámské"], ["latinka", "latinka je římská"], ["fénické písmo", "fénické písmo je hláskové, bez kartuší"], ["čínské písmo", "čínské písmo nepoužívá kartuše"]]}, {"t": "Které písmo je na nápisu SENATVS POPVLVSQVE ROMANVS?", "ok": "latinka", "s": [["řecká alfabeta", "alfabeta má jiná písmena (Σ, Ω…)"], ["hieroglyfy", "hieroglyfy jsou obrázkové"], ["klínové písmo", "klínky vypadají jako trojúhelníčky"], ["fénické písmo", "fénická písmena vypadají jinak"]]}]},
 {"id": "p3-alfabeta", "kap": "k8", "pri": "doplnek", "vysv": "Řekové fénickou abecedu upravili – doplnili samohlásky. Vznikla řecká alfabeta a z ní římská latinka, ale i runy nebo hlaholice.", "var": [{"t": "Co doplnili Řekové do fénické abecedy?", "ok": "samohlásky", "s": [["souhlásky", "ty fénická abeceda měla"], ["číslice", "číslice pocházejí z Indie"], ["obrázky předmětů", "to jsou piktogramy, abeceda je hláskové písmo"], ["háčky a čárky", "ty má až čeština"]]}, {"t": "Jak se jmenuje řecká abeceda?", "ok": "alfabeta", "s": [["latinka", "latinka je římská a vznikla z alfabety"], ["hlaholice", "hlaholice vznikla z alfabety až mnohem později"], ["hieroglyfy", "hieroglyfy jsou egyptské"], ["klínové písmo", "klínové písmo je z Mezopotámie"]]}]},
 {"id": "p3-vyhody", "kap": "k8", "pri": "doplnek", "vysv": "Piktogramy jsou snadno pochopitelné a univerzální, ale na delší sdělení pomalé. Ideogramy zapíšou i myšlenky, ale znaků je moc. Hláskové písmo je jednoduché a přehledné.", "var": [{"t": "Jakou výhodu mají piktogramy?", "ok": "jsou snadno pochopitelné i bez znalosti jazyka", "s": [["stačí jich 20–30", "to platí pro hláskové písmo"], ["dobře se jimi píšou dlouhé a složité texty", "složité texty jimi skoro nejdou zapsat"], ["zapíšou každou hlásku", "to umí hláskové písmo"], ["píšou se nejrychleji ze všech písem", "kreslit všechno obrázky je pomalé"]]}, {"t": "Jakou nevýhodu mají ideogramy?", "ok": "znaků je velmi mnoho a učit se je trvá roky", "s": [["nedají se jimi zapsat myšlenky", "právě myšlenky a pojmy jimi zapsat jdou"], ["mají jen 20–30 znaků", "tolik má hláskové písmo – a je to výhoda"], ["používali je jen Féničané", "Féničané měli hláskové písmo"], ["umějí zapsat jen čísla", "zapíšou slova, pojmy i myšlenky"]]}]},
 {"id": "z-sumer", "kap": "k9", "pri": "jadro", "vysv": "Sumerové: městské státy (Ur, Uruk, Lagaš), zikkuraty, klínové písmo, Epos o Gilgamešovi.", "var": [{"t": "Která města patřila Sumerům?", "ok": "Ur, Uruk, Lagaš", "s": [["Babylon, Ninive", "Babylon je babylonské, Ninive asyrské město"], ["Týros, Sidón", "fénická města"], ["Knóssos, Faistos", "paláce na Krétě"], ["Harappa, Mohendžodáro", "indická města"]]}, {"t": "Co je zikkurat?", "ok": "stupňovitý chrám v Mezopotámii", "s": [["egyptská hrobka", "to je pyramida"], ["keltské hradiště", "oppidum"], ["řecký městský stát", "polis"], ["čínský palác", "zikkurat je mezopotámský"]]}]},
 {"id": "z-babylon", "kap": "k9", "pri": "jadro", "vysv": "Babylon: Ištařina brána, Chammurapi (18. stol. př. n. l.), Nabukadnezar II. (605–562 př. n. l.) – vrchol rozkvětu.", "var": [{"t": "Který babylonský král dobyl Jeruzalém a odvlekl obyvatele Judska do Babylonu?", "ok": "Nabukadnezar II.", "s": [["Chammurapi", "Chammurapi"], ["Kýros II.", "Kýros II."], ["David", "David"], ["Ramesse II.", "Ramesse II."]]}, {"t": "Kdy vládl Chammurapi?", "ok": "v 18. stol. př. n. l.", "s": [["v 6. stol. př. n. l.", "tehdy vládl Nabukadnezar II."], ["ve 4. tis. př. n. l.", "to teprve vznikaly sumerské městské státy"], ["v 1. stol. př. n. l.", "to byla Kleopatra"], ["ve 3. stol. př. n. l.", "to sjednotil Čínu Čchin Š'-chuang-ti"]]}]},
 {"id": "z-zakonik", "kap": "k9", "pri": "jadro", "vysv": "Chammurapiho zákoník: odveta „oko za oko“ (talio) a nerovnost – trest závisel na tom, komu ublížíš.", "var": [{"t": "Co platilo v Chammurapiho zákoníku, když někdo vyrazil oko nevolníkovi?", "ok": "zaplatil jednu minu stříbra", "s": [["vyrazili mu oko", "to platilo jen u plnoprávného občana (§ 196)"], ["byl usmrcen", "smrt hrozila například za křivé obvinění z vraždy (§ 1)"], ["nestalo se mu nic", "zaplatil – trest byl, jen mírnější"], ["musel se stát nevolníkem", "zákoník určuje platbu"]]}, {"t": "Jak se jmenuje princip „oko za oko, zub za zub“?", "ok": "talio (odveta)", "s": [["monoteismus", "monoteismus"], ["aristokracie", "aristokracie"], ["diferenciace", "diferenciace je rozdělení společnosti na vrstvy"], ["kolonizace", "kolonizace je osidlování území"]]}]},
 {"id": "z2-klinove", "kap": "k9", "pri": "jadro", "vysv": "Klínové písmo (Sumer, od začátku 3. tis. př. n. l.) se psalo rydlem do hliněných tabulek.", "var": [{"t": "Čím a na co se psalo klínové písmo?", "ok": "rydlem do hliněných tabulek", "s": [["štětcem na papyrus", "to Egypťané"], ["na papír", "papír je čínský vynález a pozdější"], ["na hedvábí", "hedvábí je čínské"], ["tesáním do pyramid", "klínové písmo se vyrývalo do hliněných tabulek; pyramidy jsou v Egyptě"]]}, {"t": "Kdo vytvořil klínové písmo?", "ok": "Sumerové", "s": [["Egypťané", "Egypťané psali hieroglyfy"], ["Féničané", "Féničané měli hláskové písmo"], ["Římané", "Římané psali latinkou"], ["Číňané", "Číňané mají vlastní znakové písmo"]]}]},
 {"id": "z3-mapa", "kap": "k9", "pri": "jadro", "vysv": "Mezopotámie leží v dnešním Iráku. Sumer byl na jihu u Perského zálivu, kam se vlévají Eufrat a Tigris; Babylon ležel na Eufratu, Asýrie na severu.", "pomucka": "Sumer = jih u moře (Perský záliv), Asýrie = sever", "var": [{"t": "Kde ležel Sumer?", "ok": "na jihu Mezopotámie u Perského zálivu", "s": [["na severu Mezopotámie", "tam ležela Asýrie"], ["v Arábii", "Sumer ležel v Mezopotámii mezi Eufratem a Tigridem"], ["v Malé Asii", "tam ležela Chetitská říše"], ["u Středozemního moře", "tam ležela Fénicie"]]}, {"t": "Na území kterého dnešního státu leží Mezopotámie?", "ok": "Irák", "s": [["Írán", "tam ležela Perská říše"], ["Turecko", "tam ležela Chetitská říše"], ["Libanon", "tam ležela Fénicie"], ["Pákistán", "tam byla harappská kultura"]]}, {"t": "Kam se vlévají Eufrat a Tigris?", "ok": "do Perského zálivu", "s": [["do Středozemního moře", "tam se vlévá Nil"], ["do Černého moře", "obě řeky tečou na jihovýchod do Perského zálivu"], ["do Rudého moře", "obě řeky tečou do Perského zálivu"], ["do Indu", "Indus je řeka v Indii, daleko na východě"]]}, {"t": "Na které řece leželo město Babylon?", "ok": "na Eufratu", "s": [["na Nilu", "Nil teče Egyptem"], ["na Indu", "Indus teče Indií"], ["na Jordánu", "Jordán teče Palestinou"], ["na Žluté řece", "Žlutá řeka teče Čínou"]]}]},
 {"id": "z3-zakonik2", "kap": "k9", "pri": "jadro", "vysv": "V Chammurapiho zákoníku platila nerovnost před zákonem: trest závisel na tom, komu jsi ublížil (plnoprávný občan × nevolník). Pokrokem bylo, že pravidla byla sepsaná a nezáleželo na náladě soudce.", "var": [{"t": "Co znamená nerovnost před zákonem v Chammurapiho zákoníku?", "ok": "trest závisel na tom, do které vrstvy patřil poškozený", "s": [["zákony platily jen pro krále", "platily pro všechny, jen tresty se lišily podle vrstvy"], ["každý soudce rozhodoval podle sebe", "právě naopak – pravidla byla sepsaná"], ["tresty se losovaly", "tresty byly přesně sepsané"], ["za ublížení nevolníkovi nebyl žádný trest", "trest byl, ale mírnější – pokuta jedna mina stříbra"]]}, {"t": "V čem byl Chammurapiho zákoník pokrokem?", "ok": "pravidla byla sepsaná, takže nezáleželo na náladě soudce", "s": [["zrušil všechny tresty", "tresty byly naopak kruté"], ["všichni si byli před zákonem rovni", "platila nerovnost – trest podle vrstvy"], ["zakázal mít nevolníky", "nevolníci v zákoníku běžně vystupují"], ["zavedl volby krále", "o volbách v něm nic není"]]}, {"t": "Co hrozilo podle § 197 tomu, kdo zlomil kost plnoprávnému občanovi?", "ok": "zlomí mu kost", "s": [["zaplatí jednu minu stříbra", "to platilo při ublížení nevolníkovi (§ 198)"], ["bude usmrcen", "smrt hrozila za křivé obvinění z vraždy (§ 1)"], ["vyrvou mu oko", "to je trest za vyražené oko (§ 196)"], ["nestane se mu nic", "za zranění plnoprávného občana platila odveta"]]}]},
 {"id": "z-gilgames", "kap": "k9", "pri": "doplnek", "vysv": "Epos o Gilgamešovi je jedno z nejstarších dochovaných literárních děl – pochází ze Sumeru.", "var": [{"t": "Ze které civilizace pochází Epos o Gilgamešovi?", "ok": "Sumerové", "s": [["Egypt", "egyptské texty jsou hlavně náboženské"], ["Řecko", "z Řecka jsou Ilias a Odyssea"], ["Izrael", "z Izraele je Bible (Starý zákon)"], ["Indie", "indické eposy jsou mladší"]]}, {"t": "Co je Epos o Gilgamešovi?", "ok": "jedno z nejstarších dochovaných literárních děl", "s": [["sbírka zákonů krále Chammurapiho", "to je Chammurapiho zákoník"], ["mírová smlouva Egypta s Chetity", "tu uzavřel Ramesse II."], ["seznam deseti znaků civilizace", "ten sestavil V. G. Childe roku 1950"], ["nápis na Ištařině bráně", "Ištařina brána stála v Babylonu; epos je literární dílo ze Sumeru"]]}]},

 {"id": "z2-60", "kap": "k9", "pri": "doplnek", "vysv": "Z Mezopotámie máme šedesátkovou soustavu: hodina má 60 minut, kruh 360°.", "var": [{"t": "Co dnes používáme díky šedesátkové soustavě z Mezopotámie?", "ok": "60 minut v hodině a 360° v kruhu", "s": [["desítkovou soustavu", "tu máme s číslicemi z Indie"], ["abecedu", "ta pochází od Féničanů"], ["papír", "papír pochází z Číny"], ["olympijské hry", "ty jsou z Řecka"]]}, {"t": "Odkud pochází počítání minut po šedesáti?", "ok": "z Mezopotámie (Sumerové)", "s": [["z Indie", "z Indie máme číslice a desítkovou soustavu"], ["z Číny", "z Číny je papír a kompas"], ["z Egypta", "šedesátkovou soustavu měli Sumerové v Mezopotámii"], ["z Řecka", "Řekové ji převzali"]]}]},

 {"id": "z3-nabukadnezar", "kap": "k9", "pri": "doplnek", "vysv": "Nabukadnezar II. (605–562 př. n. l.) – vrchol rozkvětu Babylonie (Novobabylonská říše): vládl většině Mezopotámie, Sýrii a Palestině a dobyl Jeruzalém.", "var": [{"t": "Kdy vládl Nabukadnezar II.?", "ok": "605–562 př. n. l.", "s": [["v 18. stol. př. n. l.", "tehdy vládl Chammurapi"], ["2340–2200 př. n. l.", "to je doba Akkadské říše"], ["2700–2180 př. n. l.", "to je egyptská Stará říše"], ["1600–1046 př. n. l.", "to je čínská dynastie Šang"]]}, {"t": "Za kterého krále zažila Babylonie vrchol rozkvětu (Novobabylonská říše)?", "ok": "Nabukadnezar II.", "s": [["Sargon Akkadský", "Sargon Akkadský"], ["Chammurapi", "založil říši a vydal zákoník v 18. stol. př. n. l.; vrchol přišel až za Nabukadnezara II."], ["Ramesse II.", "Ramesse II."], ["Kýros II.", "Kýros II."]]}]},
 {"id": "e-spolecnost", "kap": "k10", "pri": "jadro", "vysv": "V čele Egypta stál faraon – vtělený bůh s neomezenou mocí; nejpočetnější byli zemědělci.", "var": [{"t": "Kdo stál v čele egyptské společnosti?", "ok": "faraon – vtělený bůh", "s": [["velekněz Atona", "kněží byli pod faraonem"], ["rada úředníků", "úředníci faraonovi pomáhali"], ["lidové shromáždění", "to je až v Řecku"], ["perský satrapa", "Peršané Egypt ovládli až 525 př. n. l."]]}, {"t": "Která skupina byla v Egyptě nejpočetnější?", "ok": "zemědělci", "s": [["otroci", "otroci byli nejníže, ale ne nejpočetnější"], ["kněží", "kněží bylo málo"], ["úředníci", "úředníků bylo málo"], ["řemeslníci", "řemeslníků bylo méně než zemědělců"]]}]},

 {"id": "e3-stara", "kap": "k10", "pri": "jadro", "vysv": "Ve Staré říši tvořily Dolní a Horní Egypt jeden sjednocený stát. Pyramidy jsou hrobky králů z tisíců přesně opracovaných kvádrů bez malty; Cheopsova měřila původně asi 146 m.", "var": [{"t": "K čemu sloužily pyramidy?", "ok": "jako hrobky králů", "s": [["jako chrámy pro bohoslužby", "stupňovité chrámy (zikkuraty) stavěli v Mezopotámii; pyramidy byly hrobky"], ["jako sýpky na obilí", "byly to hrobky králů"], ["jako pevnosti proti nepřátelům", "Egypt chránila hlavně poušť; pyramidy byly hrobky"], ["jako paláce, kde faraon bydlel", "byly to hrobky, ne obydlí"]]}, {"t": "V jakém stavu byl Egypt ve Staré říši?", "ok": "Dolní a Horní Egypt tvořily jeden sjednocený stát", "s": [["byl perskou provincií", "tou se stal až roku 525 př. n. l."], ["byl rozdělen na samostatné městské státy", "městské státy byly v Sumeru"], ["ovládali ho Hyksósové", "ti pronikli do Egypta až ve 2. přechodném období"], ["byl římskou provincií", "tou se stal až roku 30 př. n. l."]]}, {"t": "Jak vysoká byla původně Cheopsova pyramida?", "ok": "asi 146 m", "s": [["asi 15 m", "byla skoro desetkrát vyšší"], ["asi 1 460 m", "tak vysoká stavba neexistuje"], ["asi 46 m", "měřila asi 146 m"], ["asi 300 m", "měřila asi 146 m"]]}]},
 {"id": "e3-polyteismus", "kap": "k10", "pri": "jadro", "vysv": "Polyteismus = víra v mnoho bohů (tak věřili Egypťané). Monoteismus = víra v jediného boha (Achnatonův Aton).", "pomucka": "poly = mnoho, mono = jeden (monolog = mluví jeden)", "var": [{"t": "Co je polyteismus?", "ok": "víra v mnoho bohů", "s": [["víra v jediného boha", "monoteismus"], ["vláda mnoha králů najednou", "polyteismus se týká náboženství, ne vlády"], ["stavba pyramid", "polyteismus je víra v mnoho bohů"], ["uctívání faraona jako jediného boha", "Egypťané uctívali mnoho bohů"]]}, {"t": "Jak se nazývá víra v jediného boha (například v Atona)?", "ok": "monoteismus", "s": [["polyteismus", "polyteismus"], ["hinduismus", "hinduismus"], ["talio", "talio"], ["taoismus", "taoismus"]]}]},
 {"id": "e3-persane", "kap": "k10", "pri": "jadro", "vysv": "Roku 525 př. n. l. dobyli Egypt Peršané. Roku 332 př. n. l. ho dobyl Alexandr Makedonský – Egypťané ho brali jako osvoboditele – a roku 331 založil Alexandrii.", "var": [{"t": "Kdo dobyl Egypt roku 525 př. n. l.?", "ok": "Peršané", "s": [["Římané", "ti z Egypta udělali provincii až roku 30 př. n. l."], ["Asyřané", "Asýrie ovládla Egypt už v 7. stol. př. n. l."], ["Alexandr Makedonský", "ten dobyl Egypt až roku 332 př. n. l."], ["Chetité", "s těmi uzavřel Ramesse II. mír"]]}, {"t": "Které město založil v Egyptě Alexandr Makedonský?", "ok": "Alexandrii", "s": [["Achetaton", "Achetaton"], ["Gízu", "v Gíze stojí pyramidy ze Staré říše"], ["Babylon", "Babylon leží v Mezopotámii"], ["Kartágo", "Kartágo"]]}, {"t": "Jak Egypťané přijali Alexandra Makedonského?", "ok": "jako osvoboditele", "s": [["jako krutého dobyvatele", "brali ho jako osvoboditele od Peršanů"], ["jako boha Atona", "Aton byl bůh z doby Achnatona"], ["do země ho vůbec nepustili", "Egypt roku 332 př. n. l. dobyl"], ["jako posla římského císaře", "Alexandr byl makedonský král, ne Říman"]]}]},

 {"id": "e2-uzemi", "kap": "k10", "pri": "doplnek", "vysv": "Egypt je ze tří stran obklopen pouští – život jen u Nilu, poušť je přirozená ochrana. Řemeslníci byli osobně svobodní, nejpočetnější byli zemědělci.", "var": [{"t": "Jakou výhodu měl Egypt díky poušti kolem?", "ok": "přirozenou ochranu před nepřáteli", "s": [["hodně dřeva na stavby", "v poušti dřevo není"], ["úrodnou půdu", "úrodná je jen půda u Nilu"], ["hodně deště", "poušť je suchá"], ["snadný obchod po souši", "poušť obchod spíš ztěžovala"]]}, {"t": "Jaké bylo postavení řemeslníků v Egyptě?", "ok": "byli osobně svobodní", "s": [["byli otroci", "otroci byli nejníže"], ["vládli státu", "vládl faraon"], ["byli vtělení bohové", "to faraon"], ["byli nejpočetnější skupina", "nejpočetnější byli zemědělci"]]}]},

 {"id": "e3-stredni", "kap": "k10", "pri": "doplnek", "vysv": "Střední říše (2040–1786 př. n. l.): nové sjednocení Egypta, obnova prosperity, menší pyramidy. Před ní bylo 1. přechodné období – oslabení ústřední moci, moc správců krajů.", "var": [{"t": "Kdy byla Střední říše?", "ok": "2040–1786 př. n. l.", "s": [["2700–2180 př. n. l.", "to je Stará říše"], ["cca 1560–1080 př. n. l.", "to je Nová říše"], ["605–562 př. n. l.", "tehdy vládl v Babylonu Nabukadnezar II."], ["1600–1046 př. n. l.", "to je čínská dynastie Šang"]]}, {"t": "Co přinesla Egyptu Střední říše?", "ok": "nové sjednocení země a obnovu prosperity", "s": [["největší územní rozmach", "ten přinesla až Nová říše"], ["stavbu největších pyramid", "ty jsou ze Staré říše"], ["nadvládu Peršanů", "ta přišla až roku 525 př. n. l."], ["uctívání jediného boha Atona", "to zavedl Achnaton v Nové říši"]]}]},

 {"id": "e3-tut2", "kap": "k10", "pri": "doplnek", "vysv": "Tutanchamon zemřel asi v 18–19 letech; hrobka je malá a narychlo upravená, asi byla původně určena pro někoho jiného. Bylo v ní přes 5 000 předmětů – poznáváme z nich materiální kulturu a technologie Egypťanů.", "var": [{"t": "V kolika letech asi zemřel Tutanchamon?", "ok": "v 18–19 letech", "s": [["ve 40–45 letech", "v tom věku zemřel Ötzi"], ["v 5 letech", "zemřel jako mladý muž"], ["v 70 letech", "zemřel velmi mladý"], ["ve 30 letech", "zemřel už v 18–19 letech"]]}, {"t": "Proč se soudí, že Tutanchamonova hrobka byla původně určena pro někoho jiného?", "ok": "je malá a narychlo upravená", "s": [["leží v Mezopotámii", "leží v Údolí králů v Egyptě"], ["je největší v celém Údolí králů", "je naopak malá"], ["byla úplně prázdná", "bylo v ní přes 5 000 předmětů"], ["je to pyramida", "je to hrobka vytesaná do skály v Údolí králů"]]}, {"t": "Co se egyptologové dozvídají z předmětů v Tutanchamonově hrobce?", "ok": "jak vypadala materiální kultura a technologie Egypťanů", "s": [["jak Egypťané dobyli Čínu", "nic takového se nestalo"], ["kdo postavil Cheopsovu pyramidu", "ta je o víc než tisíc let starší"], ["jak vzniklo klínové písmo", "klínové písmo je z Mezopotámie"], ["kdy zanikla Západořímská říše", "to bylo až roku 476 n. l."]]}]},
 {"id": "e3-rim", "kap": "k10", "pri": "doplnek", "vysv": "Kleopatra uzavřela spojenectví s Juliem Caesarem a Markem Antoniem. Po porážce Antonia umírá a Octavianus (pozdější Augustus) mění roku 30 př. n. l. Egypt v římskou provincii.", "var": [{"t": "Kdo změnil Egypt v římskou provincii?", "ok": "Octavianus (pozdější Augustus)", "s": [["Julius Caesar", "byl Kleopatřin spojenec; provincii z Egypta udělal až Octavianus"], ["Alexandr Makedonský", "ten Egypt dobyl roku 332 př. n. l. a nebyl Říman"], ["Marcus Antonius", "byl Kleopatřin spojenec a Octavianus ho porazil"], ["Ptolemaios", "Ptolemaios"]]}, {"t": "Se kterými Římany uzavřela Kleopatra spojenectví?", "ok": "s Juliem Caesarem a Markem Antoniem", "s": [["s Octavianem a Augustem", "Octavianus a Augustus je tentýž muž – a byl to její protivník"], ["s Alexandrem Makedonským a Ptolemaiem", "to nebyli Římané a žili asi o 300 let dřív"], ["s Ramessem II. a Chetity", "Ramesse II. žil o víc než tisíc let dřív"], ["s Kýrem II. a Dareiem I.", "to byli perští králové"]]}]},

const esc = s => String(s).replace(/[&<>"]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));

let posledniSouhrn = "";
function posliSouhrn(vynutit) {
  if (!S || !window.Sledovani) return;
  const d = souhrnDetail(), podpis = JSON.stringify([d.odpovedi, d.nauceno, d.rezim]);
  if (!vynutit && podpis === posledniSouhrn) return;
  posledniSouhrn = podpis;
  Sledovani.udalost("rychlo_souhrn", "souhrn", d);
}
function udalost(u, sekce, detail) { if (window.Sledovani) Sledovani.udalost(u, sekce, detail); }
function oblast(k) { if (window.Sledovani) Sledovani.oblast(k); }
function toast(t) {
  const el = document.createElement("div"); el.id = "toast"; el.textContent = t; document.body.appendChild(el);
  setTimeout(() => el.classList.add("pryc"), 3500); setTimeout(() => el.remove(), 4300);
}
// dialog místo confirm() (blokující okna prohlížeče nepoužívat)
function dialog(text, tlacitka) {
  $("dText").textContent = text; const box = $("dTlacitka"); box.innerHTML = "";
  tlacitka.forEach(([popis, fn, hl]) => {
    const b = document.createElement("button"); b.type = "button"; b.className = "btn" + (hl ? " hl" : ""); b.textContent = popis;
    b.onclick = () => { $("dialog").hidden = true; if (fn) fn(); }; box.appendChild(b);
  });
  $("dialog").hidden = false;
}
// v02: časová osa – kolečko za každý fakt v pořadí konfigurace (kapitoly)
function vykresliOsu() {
  const osa = $("osa"), p = S && S.planovac;
  if (osa.children.length !== RYCHLO.fakta.length) osa.innerHTML = RYCHLO.fakta.map(() => "<i></i>").join("");
  RYCHLO.fakta.forEach((f, i) => {
    const x = p && p.fakta[f.id], w = p && p.fronta && p.fronta.prace[f.id];
    const cls = !x ? "" : x.naucen && !(p.rezim === "rano" && w && w.streak === 0 && w.posl >= 0) ? "nauceno"
      : w && w.streak === 0 && w.posl >= 0 ? "chyba" : (w || x.spatne + x.spravne > 0) ? "prace" : "";
    osa.children[i].className = cls + (OT && OT.id === f.id ? " ted" : "");
  });
}
function ukaz(sc) { vykresliOsu(); ["scUvod", "scOtazka", "scMezi"].forEach(x => { $(x).hidden = x !== sc; }); window.scrollTo(0, 0); }

/* ---------- úvod ---------- */
function uvod() {
  OT = null; zodpovezeno = null; oblast("Úvod"); ukaz("scUvod");
  $("uvodNadpis").textContent = RYCHLO.title;
  $("uvodText").innerHTML = "<p>Učíš se tím, že odpovídáš: u každé otázky vyber jednu možnost, a když nevíš, klepni na „Nevím“ – nehádej.</p>" +
    "<p>Po každé odpovědi hned uvidíš správnou odpověď a krátké vysvětlení.</p>" +
    "<p>Co ještě neumíš, se ti vrací, dokud to dvakrát po sobě neodpovíš správně; ráno si nejslabší věci zopakuješ tlačítkem „Ranní opakování“.</p>";
  const p = S && S.planovac, rozprac = p && p.n > 0;
  $("btnZacit").hidden = !!rozprac;
  $("btnPokracovat").hidden = !rozprac || p.rezim === "hotovo";
  $("btnZnovu").hidden = !rozprac;
  $("uvodStav").textContent = rozprac ? `Naučeno ${pocetNaucenych(p)} z ${F.length}` + (p.rezim === "rano" ? " · rozpracované ranní opakování" : p.rezim === "hotovo" ? " · hotovo" : p.rezim === "zaver" ? " · závěrečné kolo" : ` · zbývá asi ${odhadMin(p)} min`) : `${F.length} věcí k naučení, asi 45–60 minut.`;
}
function zacit(pokracovani) {
  if (!S) S = novyStav();
  udalost("rychlo_start", "start", { rezim: S.planovac.rezim, pokracovani: !!pokracovani, faktu: F.length, nauceno: pocetNaucenych(S.planovac), odpovedi: statistika(S.planovac).odpovedi, prevzato: prevzato || undefined });
  dalsiOtazka(true);
}
function ranniOpakovani() {
  if (!S) S = novyStav();
  const ulozeny = S.planovac.n > 0;
  S.planovac = Planovac.rano(S.planovac, F, KOSTRA);
  S.cas.rano_s = 0; S.cas.rano_otazek = 0;
  uloz();
  udalost("rychlo_rano", "ranní opakování", { ulozeny, poradi: S.planovac.fronta.nove.slice(0, 30), faktu: F.length });
  dalsiOtazka(true);
}
function zacitZnovu() {
  dialog("Začít znovu? Všechno, co máš naučené, se tu smaže (výsledky zůstanou v přehledu).", [
    ["Zrušit", null], ["Začít znovu", () => {
      if (S) udalost("rychlo_reset", "reset", souhrnDetail());
      smazStav(); S = novyStav(); uloz(); OT = null; zodpovezeno = null; uvod();
    }, true]]);
}

/* ---------- otázka ---------- */
function dalsiOtazka(obnovit) {
  zodpovezeno = null;
  const p = S.planovac;
  // obnovení po reloadu uprostřed otázky
  if (obnovit && S.otazka && FAKT[S.otazka.id] && S.otazka.rezim === p.rezim) {
    OT = Object.assign({}, S.otazka, { zobrazeno: Date.now() }); vykresli(); return;
  }
  if (nabidkaCasu()) return;
  const d = Planovac.dalsi(p, F);
  const predRezim = p.rezim;
  S.planovac = d.stav;
  if (!d.otazka) { uloz(); konecRezimu(predRezim); return; }
  if (predRezim === "uceni" && d.stav.rezim === "zaver" && !obnovit) { OT = null; uloz(); mezistrankaZaver(d.otazka); return; }
  pripravOtazku(d.otazka);
}
function pripravOtazku(o) {
  const f = FAKT[o.id], v = f.var[o.v];
  OT = Object.assign({}, o, { moznosti: zamichej([v.ok, ...v.s.map(x => x[0])]), odkryto: !KAP[f.kap].kostra, zobrazeno: Date.now() });
  uloz(); vykresli();
}
function vykresli() {
  const f = FAKT[OT.id], v = f.var[OT.v], p = S.planovac, k = KAP[f.kap];
  ukaz("scOtazka"); oblast(k.nazev);
  $("oKap").textContent = k.nazev;
  $("oRezim").textContent = p.rezim === "rano" ? "Ranní opakování" : p.rezim === "zaver" ? "Závěrečné kolo" : "";
  const nauc = pocetNaucenych(p);
  $("oStav").textContent = p.rezim === "rano" ? `otázka ${S.cas.rano_otazek + 1}` :
    p.rezim === "zaver" ? `${p.zaver.i + 1} z ${p.zaver.seznam.length}` : `Naučeno ${nauc} z ${F.length} · zbývá asi ${odhadMin(p)} min`;
  $("oLista").style.width = (p.rezim === "zaver" ? p.zaver.i / Math.max(1, p.zaver.seznam.length) : nauc / F.length) * 100 + "%";
  $("oZadani").textContent = v.t;
  $("vyhodnoceni").hidden = true;
  const box = $("moznosti"); box.innerHTML = "";
  OT.moznosti.forEach((m, i) => {
    const b = document.createElement("button"); b.type = "button"; b.className = "moznost"; b.textContent = m; b.dataset.i = i;
    b.onclick = () => odpovez(m, false); box.appendChild(b);
  });
  box.hidden = !OT.odkryto;
  $("oVduchu").hidden = OT.odkryto;
  $("btnUkazat").hidden = OT.odkryto;
  $("btnNevim").hidden = false; $("btnNevim").disabled = false;
}
function odkryj() {
  if (!OT || OT.odkryto) return;
  OT.odkryto = true; OT.odkryto_s = Math.round((Date.now() - OT.zobrazeno) / 1000); uloz(); vykresli();
}
function vysvetliSpatnou(f, v, text) {
  const x = v.s.find(s => s[0] === text); if (!x) return "";
  const e = x[1], P = RYCHLO.pojmy;
  if (P[e] !== undefined) return text === e ? `<b>${esc(e)}</b> = ${esc(P[e])}` : `„${esc(text)}“ – to je <b>${esc(e)}</b> = ${esc(P[e])}`;
  return `„${esc(text)}“ – ${esc(e)}`;
}
function odpovez(text, nevim) {
  if (!OT || zodpovezeno) return;
  if (!OT.odkryto && !nevim) return;
  const f = FAKT[OT.id], v = f.var[OT.v], spravne = !nevim && text === v.ok;
  const doba = Math.round((Date.now() - OT.zobrazeno) / 1000);
  zodpovezeno = { spravne, vybrala: nevim ? "nevím" : text, nevim, cas: Date.now() };
  const p0 = S.planovac, rezim = p0.rezim;
  const o = Planovac.odpoved(p0, F, OT, spravne);
  S.planovac = o.stav;
  const fs = S.planovac.fakta[OT.id];
  if (!spravne) fs.vybrala = fs.vybrala.concat(nevim ? "nevím" : text).slice(-20);
  if (rezim === "rano") S.cas.rano_otazek++;
  uloz();
  udalost("rychlo_odpoved", KAP[f.kap].nazev, { id: f.id, varianta: OT.v + 1, kapitola: f.kap, vybrala: zodpovezeno.vybrala, spravne, nevim,
    doba_s: doba, poradi: OT.poradi, rezim, otazka: v.t, spravna: v.ok, odkryto_s: OT.odkryto_s });
  if (o.naucen) udalost("rychlo_naucen", KAP[f.kap].nazev, { id: f.id, poradi: OT.poradi, spatne: fs.spatne, spravne: fs.spravne });
  if (S.planovac.n % 10 === 0) posliSouhrn(false);
  // vyhodnocení
  document.querySelectorAll("#moznosti .moznost").forEach(b => {
    b.disabled = true;
    if (b.textContent === v.ok) b.classList.add("spravna");
    else if (!nevim && b.textContent === text) b.classList.add("vybrana-spatne");
    else b.classList.add("ztlumena");
  });
  $("moznosti").hidden = false; $("oVduchu").hidden = true; $("btnUkazat").hidden = true;
  $("btnNevim").disabled = true;
  const vy = $("vyhodnoceni");
  vy.className = spravne ? "ok" : "bad";
  $("vVerdikt").textContent = spravne ? (o.naucen ? "✓ Správně – naučeno!" : "✓ Správně") : nevim ? "✗ Nevím – teď se to nauč:" : "✗ Špatně";
  $("vSpravna").innerHTML = "Správně: <b>" + esc(v.ok) + "</b>";
  $("vVysv").textContent = f.vysv;
  $("vPomucka").hidden = !f.pomucka; $("vPomucka").textContent = f.pomucka ? "Pomůcka: " + f.pomucka : "";
  const volba = !spravne && !nevim ? vysvetliSpatnou(f, v, text) : "";
  $("vVolba").hidden = !volba; $("vVolba").innerHTML = volba ? "Tvoje volba: " + volba : "";
  vy.hidden = false;
  vykresliOsu();
  zamekDo = Date.now() + NAST.zamekMs;
  // vyhodnocení i „Další“ musí být vidět
  requestAnimationFrame(() => { const r = $("btnDalsi").getBoundingClientRect(), dole = $("osa").getBoundingClientRect().top; if (r.bottom > dole - 10) window.scrollBy(0, r.bottom - dole + 20); });
}
function dalsiKlik() {
  if (!zodpovezeno || Date.now() < zamekDo) return;
  const p = S.planovac;
  if (p.rezim === "rano" && (S.cas.rano_otazek >= NAST.ranoOtazek || S.cas.rano_s >= NAST.ranoMin * 60) && !S.cas.ranoNabidnuto) {
    S.cas.ranoNabidnuto = true; uloz();
    dialog(`Ranní opakování: ${S.cas.rano_otazek} otázek za ${Math.round(S.cas.rano_s / 60)} min. Chceš pokračovat?`, [
      ["Konec", () => { posliSouhrn(true); S.planovac = Planovac.konecRano(S.planovac); uloz(); uvod(); }],
      ["Pokračovat", () => { S.cas.rano_otazek = 0; S.cas.rano_s = 0; S.cas.ranoNabidnuto = false; uloz(); dalsiOtazka(false); }, true]]);
    return;
  }
  dalsiOtazka(false);
}
// pauza po 25 min, po 60 min „zbytek na ráno“ (jen při učení, mezi otázkami)
function nabidkaCasu() {
  const p = S.planovac;
  if (p.rezim !== "uceni") return false;
  if (!S.cas.naRano && S.cas.uceni_s >= NAST.naRanoMin * 60) {
    S.cas.naRano = true; S.cas.pauza = true; uloz();
    udalost("rychlo_souhrn", "nabídka na ráno", Object.assign(souhrnDetail(), { nabidka: "na_rano" }));
    dialog(`Učíš se už hodinu (naučeno ${pocetNaucenych(p)} z ${F.length}). Zbytek nech na ráno – ráno klepni na „Ranní opakování“, nebo „Pokračovat“.`, [
      ["Konec na dnes", () => uvod()], ["Ještě pokračovat", () => dalsiOtazka(false), true]]);
    return true;
  }
  if (!S.cas.pauza && S.cas.uceni_s >= NAST.pauzaMin * 60) {
    S.cas.pauza = true; uloz();
    dialog(`Učíš se už ${NAST.pauzaMin} minut. Dej si krátkou pauzu (5 minut) – protáhni se, napij se. Pak pokračuj.`, [["Pokračovat", () => dalsiOtazka(false), true]]);
    return true;
  }
  return false;
}
function mezistrankaZaver(prvni) {
  ukaz("scMezi"); oblast("Závěrečné kolo");
  const n = S.planovac.zaver.seznam.length;
  $("mNadpis").textContent = "Všechno naučeno!";
  $("mText").textContent = `Teď závěrečné kolo: ${n} ${n === 1 ? "otázka" : n < 5 ? "otázky" : "otázek"} z toho, co ti dělalo potíže – každá jednou, jinak položená.`;
  $("mTabulka").innerHTML = "";
  const t = $("mTlacitka"); t.innerHTML = "";
  const b = document.createElement("button"); b.type = "button"; b.className = "btn hl"; b.id = "btnZaver"; b.textContent = "Spustit závěrečné kolo";
  b.onclick = () => pripravOtazku(prvni); t.appendChild(b);
  posliSouhrn(true);
}
function konecRezimu(rezim) {
  if (rezim === "rano") {
    posliSouhrn(true);
    S.planovac = Planovac.konecRano(S.planovac); uloz();
    ukaz("scMezi"); oblast("Souhrn");
    $("mNadpis").textContent = "Ranní opakování hotové";
    $("mText").textContent = "Všechno z ranního opakování jsi odpověděla správně. Hodně štěstí v testu!";
    $("mTabulka").innerHTML = "";
    tlacitkaSouhrnu();
    return;
  }
  souhrn();
}
function souhrn() {
  const p = S.planovac, st = statistika(p);
  ukaz("scMezi"); oblast("Souhrn");
  posliSouhrn(true);
  $("mNadpis").textContent = "Hotovo!";
  $("mText").textContent = `Naučeno ${pocetNaucenych(p)} z ${F.length}. Odpovědí ${st.odpovedi}, správně napoprvé ${st.spravne_napoprve_pct ?? 0} %, ` +
    `čas asi ${Math.round(S.cas.uceni_s / 60)} min. Ráno si dej „Ranní opakování“.`;
  const slabe = F.filter(f => p.fakta[f.id].spatne > 0).sort((a, b) => p.fakta[b.id].spatne - p.fakta[a.id].spatne).slice(0, 12);
  $("mTabulka").innerHTML = slabe.length ? "<table class='slabe'><tr><th>Co ti dělalo potíže</th><th>chyb</th></tr>" +
    slabe.map(f => `<tr><td>${esc(FAKT[f.id].var[0].t)}<br><span class="muted">${esc(FAKT[f.id].var[0].ok)}</span></td><td>${p.fakta[f.id].spatne}</td></tr>`).join("") + "</table>" : "";
  tlacitkaSouhrnu();
}
function tlacitkaSouhrnu() {
  const t = $("mTlacitka"); t.innerHTML = "";
  [["Ranní opakování", ranniOpakovani, true], ["Úvod", uvod], ["Začít znovu", zacitZnovu]].forEach(([l, fn, hl]) => {
    const b = document.createElement("button"); b.type = "button"; b.className = "btn" + (hl ? " hl" : ""); b.textContent = l; b.onclick = fn; t.appendChild(b);
  });
}

/* ---------- čas učení (jen viditelná stránka s otázkou, bez dlouhé nečinnosti) ---------- */
let tik = Date.now(), posledniVstup = Date.now();
["pointerdown", "keydown", "touchstart"].forEach(t => window.addEventListener(t, () => { posledniVstup = Date.now(); }, { passive: true, capture: true }));
setInterval(() => {
  const now = Date.now(), d = Math.min(now - tik, 5000) / 1000; tik = now;
  if (!S || document.visibilityState !== "visible" || $("scOtazka").hidden || now - posledniVstup > NAST.necinnostS * 1000) return;
  if (S.planovac.rezim === "rano") S.cas.rano_s += d; else S.cas.uceni_s += d;
}, 1000);
setInterval(() => { if (S && document.visibilityState === "visible") uloz(); }, 15000);
document.addEventListener("visibilitychange", () => { if (document.visibilityState === "hidden") { uloz(); posliSouhrn(false); } else tik = Date.now(); });
window.addEventListener("pagehide", () => { uloz(); posliSouhrn(false); });

/* ---------- ovládání ---------- */
$("btnZacit").onclick = () => zacit(false);
$("btnPokracovat").onclick = () => zacit(true);
$("btnRano").onclick = ranniOpakovani;
$("btnZnovu").onclick = zacitZnovu;
$("btnUkazat").onclick = odkryj;
$("btnNevim").onclick = () => { if (!OT || zodpovezeno) return; if (!OT.odkryto) { OT.odkryto = true; } odpovez("", true); };
$("btnDalsi").onclick = dalsiKlik;
$("btnUvod").onclick = () => { uloz(); uvod(); };
$("btnHome").onclick = () => { uloz(); posliSouhrn(false); if (window.Zaznam) Zaznam.beacon(); location.href = "../index.html"; };

/* ---------- jen pro čtení (kontrola) ---------- */
window.Rychlouceni = Object.freeze({
  stav: () => (S ? JSON.parse(JSON.stringify(S)) : null),
  otazka: () => {
    if (!OT) return null;
    const f = FAKT[OT.id], v = f.var[OT.v];
    return { id: OT.id, varianta: OT.v, rezim: OT.rezim, poradi: OT.poradi, text: v.t, moznosti: OT.moznosti.slice(), spravna: OT.moznosti.indexOf(v.ok),
      spravnaText: v.ok, kostra: !!KAP[f.kap].kostra, odkryto: !!OT.odkryto, zodpovezeno: !!zodpovezeno };
  },
  planovac: Planovac,
  poradiFaktu: () => F.map(f => Object.assign({}, f)),
  nastaveni: Object.freeze(Object.assign({}, NAST))
});

S = nactiStav();
if (S && prevzato) { uloz(); toast("Pokračuješ, kde jsi skončila ve starší verzi."); }
uvod();
</script>
</body>
</html>
