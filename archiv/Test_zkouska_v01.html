<!doctype html>
<html lang="cs">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Zkušební test – převody jednotek</title>
<style>
  :root {
    --bg: #fafaf7; --text: #1d1d1b; --muted: #6b6b66; --line: #dcdcd5;
    --ok: #1f7a3a; --ok-bg: #e6f4ea; --bad: #b3261e; --bad-bg: #fbe9e7;
    --accent: #2b5cab; --grid: #d6e2f0;
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--text);
    font: 20px/1.45 -apple-system, "Segoe UI", Roboto, sans-serif; }
  main { max-width: 820px; margin: 0 auto; padding: 24px 16px 80px; }
  h1 { font-size: 28px; margin: 0 0 4px; }
  .sub { color: var(--muted); margin: 0 0 16px; font-size: 17px; }
  hr { border: 0; border-top: 1px solid var(--line); margin: 24px 0; }
  .score { font-size: 22px; font-weight: 600; min-height: 1.4em; }
  .q { padding: 14px 0; border-bottom: 1px solid var(--line); }
  .q-row { display: flex; align-items: center; flex-wrap: wrap; gap: 10px; font-size: 24px; }
  .num { color: var(--muted); font-size: 18px; width: 2em; }
  input.ans { width: 9em; font-size: 24px; padding: 8px 10px; border: 2px solid var(--line);
    border-radius: 8px; background: #fff; color: var(--text); text-align: right; }
  input.ans:focus { outline: none; border-color: var(--accent); }
  .q.ok input.ans { border-color: var(--ok); background: var(--ok-bg); }
  .q.bad input.ans { border-color: var(--bad); background: var(--bad-bg); }
  .fb { font-size: 17px; margin-top: 6px; min-height: 0; }
  .q.ok .fb { color: var(--ok); }
  .q.bad .fb { color: var(--bad); }
  .buttons { display: flex; gap: 12px; flex-wrap: wrap; margin-top: 20px; }
  button { font: inherit; font-size: 19px; padding: 12px 20px; border-radius: 10px;
    border: 2px solid var(--accent); background: #fff; color: var(--accent); cursor: pointer; }
  button.primary { background: var(--accent); color: #fff; }
  .tools { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; margin-bottom: 10px; }
  .tools button { font-size: 16px; padding: 8px 12px; }
  .tools button.on { background: var(--accent); color: #fff; }
  .swatch { width: 34px; height: 34px; border-radius: 50%; padding: 0; border: 3px solid transparent; }
  .swatch.on { border-color: var(--text); }
  .canvas-wrap { border: 1px solid var(--line); border-radius: 8px; overflow: hidden; background: #fff; }
  canvas { display: block; width: 100%; height: 420px; }
  .hint { font-size: 15px; color: var(--muted); margin-top: 6px; }
</style>
</head>
<body>
<main>
  <h1>Zkušební test – převody jednotek</h1>
  <p class="sub">Doplň číslo do prázdného pole. Desetinná čárka i tečka jsou v pořádku.</p>
  <div class="score" id="score"></div>

  <div id="questions"></div>

  <div class="buttons">
    <button class="primary" id="btnCheck">Vyhodnotit</button>
    <button id="btnReset">Zkusit znovu</button>
  </div>

  <hr>

  <h2 style="font-size:22px;margin:0 0 10px">Místo na výpočty</h2>
  <div class="tools">
    <button class="swatch on" data-color="#1d1d1b" style="background:#1d1d1b" aria-label="černá"></button>
    <button class="swatch" data-color="#2b5cab" style="background:#2b5cab" aria-label="modrá"></button>
    <button class="swatch" data-color="#b3261e" style="background:#b3261e" aria-label="červená"></button>
    <button id="toolPen" class="on">Pero</button>
    <button id="toolEraser">Guma</button>
    <button id="btnUndo">Zpět</button>
    <button id="btnClear">Smazat</button>
    <button id="btnFinger">Kreslit prstem: ne</button>
  </div>
  <div class="canvas-wrap"><canvas id="pad"></canvas></div>
  <p class="hint">Apple Pencil kreslí, prstem se posouvá stránka. Kresba se po zavření stránky neukládá.</p>
</main>

<script>
// ---------- Zadání ----------
const QUESTIONS = [
  { left: "5 m =",       unit: "mm",  answer: 5000,  hint: "dolů = násobím: m → dm → cm → mm, ×1000" },
  { left: "320 mm =",    unit: "m",   answer: 0.32,  hint: "nahoru = dělím: mm → m, :1000" },
  { left: "2,5 min =",   unit: "s",   answer: 150,   hint: "1 min = 60 s, 2,5 · 60" },
  { left: "36 km/h =",   unit: "m/s", answer: 10,    hint: "km/h → m/s: dělím 3,6" },
  { left: "3 m² =",      unit: "cm²", answer: 30000, hint: "1 m² = 100 · 100 cm² = 10 000 cm²" }
];

function fmt(n) {
  return n.toLocaleString("cs-CZ", { maximumFractionDigits: 10 });
}
// Přijme čárku i tečku, ignoruje mezery
function parseAnswer(s) {
  const t = String(s).replace(/[\s  ]/g, "").replace(",", ".");
  if (t === "" || !/^[-+]?(\d+\.?\d*|\.\d+)$/.test(t)) return null;
  return Number(t);
}
function isCorrect(value, answer, tol) {
  if (value === null) return false;
  const t = tol ?? Math.max(1e-9, Math.abs(answer) * 1e-9);
  return Math.abs(value - answer) <= t;
}

const qBox = document.getElementById("questions");
QUESTIONS.forEach((q, i) => {
  const d = document.createElement("div");
  d.className = "q";
  d.innerHTML = `<div class="q-row"><span class="num">${i + 1}.</span>
    <span>${q.left}</span>
    <input class="ans" type="text" inputmode="decimal" autocomplete="off" autocorrect="off" spellcheck="false" aria-label="odpověď ${i + 1}">
    <span>${q.unit}</span></div><div class="fb"></div>`;
  qBox.appendChild(d);
});

document.getElementById("btnCheck").addEventListener("click", () => {
  let ok = 0;
  document.querySelectorAll(".q").forEach((el, i) => {
    const q = QUESTIONS[i];
    const v = parseAnswer(el.querySelector("input").value);
    const good = isCorrect(v, q.answer, q.tol);
    el.classList.toggle("ok", good);
    el.classList.toggle("bad", !good);
    el.querySelector(".fb").textContent = good
      ? "Správně"
      : `Správně je ${fmt(q.answer)} ${q.unit}  (${q.hint})`;
    if (good) ok++;
  });
  const pct = Math.round(ok / QUESTIONS.length * 100);
  document.getElementById("score").textContent = `Výsledek: ${ok} / ${QUESTIONS.length}  (${pct} %)`;
  window.scrollTo({ top: 0, behavior: "smooth" });
});

document.getElementById("btnReset").addEventListener("click", () => {
  document.querySelectorAll(".q").forEach(el => {
    el.classList.remove("ok", "bad");
    el.querySelector("input").value = "";
    el.querySelector(".fb").textContent = "";
  });
  document.getElementById("score").textContent = "";
});

// ---------- Kreslení ----------
const canvas = document.getElementById("pad");
const ctx = canvas.getContext("2d");
let strokes = [];          // {color, width, eraser, pts:[[x,y,p],...]}
let current = null;
let color = "#1d1d1b", eraser = false, fingerDraw = false;
const CELL = 24;

function resize() {
  const r = canvas.getBoundingClientRect(), dpr = window.devicePixelRatio || 1;
  canvas.width = Math.round(r.width * dpr);
  canvas.height = Math.round(r.height * dpr);
  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  redraw();
}
function drawGrid() {
  const w = canvas.width / (window.devicePixelRatio || 1);
  const h = canvas.height / (window.devicePixelRatio || 1);
  ctx.save();
  ctx.fillStyle = "#fff"; ctx.fillRect(0, 0, w, h);
  ctx.strokeStyle = getComputedStyle(document.documentElement).getPropertyValue("--grid");
  ctx.lineWidth = 1;
  ctx.beginPath();
  for (let x = 0.5; x < w; x += CELL) { ctx.moveTo(x, 0); ctx.lineTo(x, h); }
  for (let y = 0.5; y < h; y += CELL) { ctx.moveTo(0, y); ctx.lineTo(w, y); }
  ctx.stroke();
  ctx.restore();
}
const ink = document.createElement("canvas");
const ictx = ink.getContext("2d");
function drawStroke(c, s) {
  c.save();
  c.lineCap = "round"; c.lineJoin = "round";
  c.globalCompositeOperation = s.eraser ? "destination-out" : "source-over";
  c.strokeStyle = s.color; c.fillStyle = s.color;
  for (let i = 1; i < s.pts.length; i++) {
    const [x0, y0] = s.pts[i - 1], [x1, y1, p] = s.pts[i];
    c.lineWidth = s.eraser ? 22 : s.width * (0.6 + p * 0.8);
    c.beginPath(); c.moveTo(x0, y0); c.lineTo(x1, y1); c.stroke();
  }
  if (s.pts.length === 1) {
    const [x, y] = s.pts[0];
    c.beginPath(); c.arc(x, y, s.eraser ? 11 : s.width / 2, 0, 7); c.fill();
  }
  c.restore();
}
function redraw() {
  const dpr = window.devicePixelRatio || 1;
  if (ink.width !== canvas.width || ink.height !== canvas.height) {
    ink.width = canvas.width; ink.height = canvas.height;
  }
  ictx.setTransform(1, 0, 0, 1, 0, 0);
  ictx.clearRect(0, 0, ink.width, ink.height);
  ictx.setTransform(dpr, 0, 0, dpr, 0, 0);
  strokes.forEach(s => drawStroke(ictx, s));   // guma maže jen kresbu, ne síť
  drawGrid();
  ctx.save(); ctx.setTransform(1, 0, 0, 1, 0, 0); ctx.drawImage(ink, 0, 0); ctx.restore();
}
function canDraw(e) {
  return e.pointerType === "pen" || e.pointerType === "mouse" || (e.pointerType === "touch" && fingerDraw);
}
function pos(e) {
  const r = canvas.getBoundingClientRect();
  const p = e.pointerType === "pen" ? (e.pressure || 0.5) : 0.5;
  return [e.clientX - r.left, e.clientY - r.top, p];
}
canvas.addEventListener("pointerdown", e => {
  if (!canDraw(e)) return;
  e.preventDefault();
  canvas.setPointerCapture(e.pointerId);
  current = { color, width: 2.5, eraser, pts: [pos(e)] };
  strokes.push(current);
  redraw();
});
canvas.addEventListener("pointermove", e => {
  if (!current) return;
  e.preventDefault();
  const evs = e.getCoalescedEvents ? e.getCoalescedEvents() : [e];
  evs.forEach(ev => current.pts.push(pos(ev)));
  redraw();
});
["pointerup", "pointercancel", "pointerleave"].forEach(t =>
  canvas.addEventListener(t, () => { current = null; }));

// iPad: Pencil (stylus) nesmí posouvat stránku, prst ano (pokud není zapnuté kreslení prstem)
function blockScroll(e) {
  const t = e.touches[0];
  if (!t) return;
  if (t.touchType === "stylus" || fingerDraw) e.preventDefault();
}
canvas.addEventListener("touchstart", blockScroll, { passive: false });
canvas.addEventListener("touchmove", blockScroll, { passive: false });

document.querySelectorAll(".swatch").forEach(b => b.addEventListener("click", () => {
  document.querySelectorAll(".swatch").forEach(x => x.classList.remove("on"));
  b.classList.add("on"); color = b.dataset.color; setEraser(false);
}));
function setEraser(on) {
  eraser = on;
  document.getElementById("toolEraser").classList.toggle("on", on);
  document.getElementById("toolPen").classList.toggle("on", !on);
}
document.getElementById("toolPen").addEventListener("click", () => setEraser(false));
document.getElementById("toolEraser").addEventListener("click", () => setEraser(true));
document.getElementById("btnUndo").addEventListener("click", () => { strokes.pop(); redraw(); });
document.getElementById("btnClear").addEventListener("click", () => {
  if (strokes.length && confirm("Smazat celou plochu?")) { strokes = []; redraw(); }
});
document.getElementById("btnFinger").addEventListener("click", e => {
  fingerDraw = !fingerDraw;
  e.target.textContent = "Kreslit prstem: " + (fingerDraw ? "ano" : "ne");
  e.target.classList.toggle("on", fingerDraw);
});
window.addEventListener("resize", resize);
resize();

// export pro test v Node
if (typeof module !== "undefined") module.exports = { parseAnswer, isCorrect };
</script>
</body>
</html>
