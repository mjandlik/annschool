<!-- ===== KONEC HLAVIČKY ===== -->
<!--
  ŠABLONA RYCHLOUČENÍ – Ann School (system/Sablona_rychlouceni_vXX.html)
  Nové Rychloučení = kopie této šablony do složky předmětu: <předmět>/<tema>_rychlouceni_vXX.html.
  Měň JEN bloky HLAVIČKA (<title>), NÁZEV V PANELU (název a verze) a KONFIGURACE RYCHLOUČENÍ. Postup: system/Navod_rychlouceni_vXX.md.
  v01 (09.11.2026): učení formou testu.
  v02 (09.11.2026): časová osa dole – kolečko za každý fakt v pořadí kapitol (šedá = ještě nebylo, oranžová = učí se,
       červená = poslední odpověď špatně, zelená = naučeno; aktuální otázka orámovaná).
  - Fakt = jedna věc, kterou má žák umět (stálé id, kapitola, priorita jadro / doplnek, 2+ varianty otázky).
    Otázka = výběr z 5 zamíchaných možností + „Nevím“ (počítá se jako špatně). Po odpovědi hned vyhodnocení,
    vysvětlení, pomůcka a co znamená vybraná špatná možnost (ze slovníku POJMY). „Další“ je pod vyhodnocením,
    400 ms po vyhodnocení se na klepnutí nereaguje (dvojité klepnutí nepřeskočí vysvětlení).
  - Plánovač (čistá funkce bez DOM, Rychlouceni.planovac): fronta podle toho, kdy je fakt na řadě – špatně za 3 otázky,
    správně za 6; vždy fakt, který je na řadě nejdřív; když nic není na řadě a v práci je < 8 faktů, přidá nový
    (nejdřív jadro, kapitoly v pořadí); jinak nejbližší i dřív. Nikdy stejný fakt dvakrát po sobě (kromě posledního).
    Naučený = 2 správné odpovědi za sebou s jinou otázkou mezi nimi (u posledního faktu je mezi nimi výplň = naučený
    fakt s nejvíc chybami). Varianta = nejdéle nepoužitá, jiná než minule.
  - Kapitola s kostra: true – možnosti až po „Ukázat možnosti“ (nejdřív si odpověď řekne v duchu).
  - Závěrečné kolo: fakta s aspoň jednou chybou, promíchaná, každé jednou v jiné variantě.
  - Ranní opakování: nejslabší fakta (nejvíc chyb, pak nejméně správných), stačí 1 správná odpověď; po 10 min
    nebo 30 otázkách nabídne „Pokračovat“. Bez uloženého stavu: nejdřív kostra, pak náhodně.
  - Pauza po 25 min učení, po 60 min „Zbytek nech na ráno“. Odhad zbývajícího času podle úspěšnosti a tempa.
  - Stav po každé odpovědi v localStorage „annschool:rychlouceni:<cesta>“; nová verze stránky převezme stav
    z nejvyšší starší verze (Sledovani.zPredchoziVerze), fakta podle id.
  - Záznam (sledovani.js, Sledovani.udalost): rychlo_start, rychlo_odpoved, rychlo_naucen, rychlo_souhrn,
    rychlo_reset, rychlo_rano; oblast = kapitola. Pro kontrolu jen pro čtení window.Rychlouceni { stav(), otazka() }.
  - Na stránce se nic neoznačuje dlouhým stiskem (jako šablona testu v22), malá tlačítka, touch-action: manipulation.
-->

 {"id": "k-dk", "kap": "kostra", "pri": "jadro", "vysv": "Doba kamenná: paleolit (starší), mezolit (střední), neolit (mladší), eneolit (pozdní).", "pomucka": "PAleolit = PAleo = starý; NEolit = neo = nový", "var": [{"t": "Jak se jmenuje mladší doba kamenná?", "ok": "neolit", "s": [["paleolit", "paleolit"], ["mezolit", "mezolit"], ["eneolit", "eneolit"], ["halštat", "halštatská"]]}, {"t": "Co je paleolit?", "ok": "starší doba kamenná", "s": [["mladší doba kamenná", "neolit"], ["střední doba kamenná", "mezolit"], ["pozdní doba kamenná", "eneolit"], ["starší doba železná", "halštatská"]]}]},
 {"id": "k-neolit-rev", "kap": "kostra", "pri": "jadro", "vysv": "Neolitická (zemědělská) revoluce = pozvolný přechod od lovu a sběru k zemědělství a chovu, trval tisíce let.", "var": [{"t": "Co je neolitická revoluce?", "ok": "pozvolný přechod od lovu a sběru k zemědělství", "s": [["rychlé povstání proti vládci v mladší době kamenné", "nebyla to vzpoura ani rychlá změna – trvala tisíce let"], ["objev výroby bronzu", "bronz patří do doby bronzové"], ["vznik prvních států v Mezopotámii", "to je eneolit / začátek starověku"], ["přechod od zemědělství zpět k lovu", "je to obráceně"]]}, {"t": "Jak dlouho trvala neolitická revoluce?", "ok": "několik tisíc let", "s": [["jeden rok", "revoluce v neolitu byla velmi pomalá"], ["asi 10 let", "byla mnohem pomalejší"], ["asi 100 let", "trvala tisíce let"], ["miliony let", "miliony let trvala hominizace, ne neolitická revoluce"]]}]},
 {"id": "k-reky", "kap": "kostra", "pri": "jadro", "vysv": "Nejstarší civilizace vznikly u velkých řek s úrodnou půdou.", "var": [{"t": "Co měly společného nejstarší civilizace (Egypt, Mezopotámie, Indie, Čína)?", "ok": "vznikly u velkých řek s úrodnou půdou", "s": [["ležely na pobřeží moře", "Féničané byli u moře, ale nejstarší civilizace vznikly u řek"], ["vznikly v horách", "hory nejsou úrodné; civilizace vznikly v údolích řek"], ["měly stejné písmo", "každá měla jiné písmo"], ["byly všechny v Evropě", "žádná z nich nebyla v Evropě"]]}, {"t": "Na které řece vznikl Egypt?", "ok": "Nil", "s": [["Eufrat", "Mezopotámie"], ["Indus", "Indie"], ["Žlutá řeka", "Čína"], ["Jordán", "Izrael / Palestina"]]}]},
 {"id": "k-mezopot-reky", "kap": "kostra", "pri": "jadro", "vysv": "Mezopotámie = země mezi řekami Eufratem a Tigridem (dnešní Irák).", "var": [{"t": "Mezi kterými řekami leží Mezopotámie?", "ok": "Eufrat a Tigris", "s": [["Nil a Jordán", "Nil je Egypt, Jordán Izrael"], ["Indus a Ganga", "Indie"], ["Žlutá řeka a Jang-c'-ťiang", "Čína"], ["Dunaj a Rýn", "to jsou evropské řeky (hranice Římské říše)"]]}, {"t": "Co znamená název Mezopotámie?", "ok": "země mezi řekami", "s": [["země faraonů", "to je Egypt"], ["úrodný půlměsíc", "úrodný půlměsíc je větší oblast od Egypta po Mezopotámii"], ["země purpuru", "to je význam názvu Fénicie"], ["městský stát", "to je polis"]]}]},
 {"id": "k-pismo-vyvoj", "kap": "kostra", "pri": "jadro", "vysv": "Vývoj písma: piktogramy → ideogramy → slabičné písmo → hláskové písmo (abeceda).", "pomucka": "obrázek → pojem → slabika → hláska", "var": [{"t": "Jaké je správné pořadí vývoje písma?", "ok": "piktogramy → ideogramy → slabičné → hláskové", "s": [["ideogramy → piktogramy → slabičné → hláskové", "na začátku byly obrázky předmětů – piktogramy"], ["piktogramy → hláskové → slabičné → ideogramy", "hláskové písmo je až na konci"], ["hláskové → slabičné → ideogramy → piktogramy", "je to přesně obráceně"], ["piktogramy → slabičné → ideogramy → hláskové", "ideogramy byly před slabičným písmem"]]}, {"t": "Které písmo vystačí s nejmenším počtem znaků?", "ok": "hláskové písmo", "s": [["piktogramy", "piktogramy"], ["ideogramy", "ideogramy"], ["slabičné písmo", "slabičné písmo"], ["klínové písmo", "klínové písmo patří k ideogramům – stovky znaků"]]}]},
 {"id": "k-fenicane", "kap": "kostra", "pri": "jadro", "vysv": "První hláskové písmo (abecedu) měli Féničané; Řekové ji upravili a z řecké alfabety vznikla latinka.", "var": [{"t": "Kdo měl první hláskové písmo?", "ok": "Féničané", "s": [["Sumerové", "Sumerové"], ["Egypťané", "Egypťané psali hieroglyfy"], ["Římané", "latinka vznikla až z řecké alfabety"], ["Číňané", "čínské písmo jsou znaky pro slova, ne hlásky"]]}, {"t": "Odkud se vzala latinka?", "ok": "z řecké alfabety, která vznikla z fénického písma", "s": [["přímo z egyptských hieroglyfů", "latinka vznikla z řecké alfabety"], ["z klínového písma", "klínové písmo je mezopotámské a z něj latinka nevznikla"], ["vymysleli ji Keltové", "Keltové latinku nevymysleli"], ["z čínského písma", "čínské písmo nemá s latinkou nic společného"]]}]},
 {"id": "k-egypt-rise", "kap": "kostra", "pri": "jadro", "vysv": "Dějiny Egypta: Stará říše (pyramidy) → Střední říše → Nová říše (největší rozmach), mezi nimi přechodná období.", "pomucka": "Stará = pyramidy, Nová = největší", "var": [{"t": "Ve které říši se v Egyptě stavěly největší pyramidy?", "ok": "Stará říše", "s": [["Střední říše", "ve Střední říši už jen menší pyramidy"], ["Nová říše", "v Nové říši se pohřbívalo ve skalních hrobkách v Údolí králů"], ["ptolemaiovské období", "to je až po Alexandru Makedonském"], ["2. přechodné období", "přechodná období byla úpadková"]]}, {"t": "Ve které říši měl Egypt největší územní rozmach?", "ok": "Nová říše", "s": [["Stará říše", "Stará říše = pyramidy"], ["Střední říše", "Střední říše = nové sjednocení"], ["1. přechodné období", "přechodná období byla úpadková"], ["římské období", "Egypt byl římskou provincií – nebyl samostatný"]]}]},
 {"id": "k-chammurapi", "kap": "kostra", "pri": "jadro", "vysv": "Chammurapi, král Babylonu v 18. stol. př. n. l., vydal jeden z nejstarších zákoníků (oko za oko).", "var": [{"t": "Kdo vydal jeden z nejstarších zákoníků s principem „oko za oko“?", "ok": "Chammurapi", "s": [["Nabukadnezar II.", "Nabukadnezar II."], ["Ramesse II.", "Ramesse II."], ["Kýros II.", "Kýros II."], ["Čchin Š'-chuang-ti", "Čchin Š'-chuang-ti"]]}, {"t": "Ve které říši vládl Chammurapi?", "ok": "Babylonská říše", "s": [["Asýrie", "Asýrie"], ["Akkadská říše", "Akkadská říše"], ["Egypt", "v Egyptě vládli faraoni"], ["Perská říše", "Peršané"]]}]},
 {"id": "k-starovek-konec", "kap": "kostra", "pri": "jadro", "vysv": "Starověk = nejstarší civilizace (asi 4. tis. – 8. stol. př. n. l.) a antika (8. stol. př. n. l. – 476 n. l.).", "var": [{"t": "Kterým rokem končí starověk?", "ok": "476 n. l.", "s": [["0", "rok 0 je hranice letopočtu, ne konec starověku"], ["332 př. n. l.", "to Alexandr Makedonský dobyl Egypt"], ["30 př. n. l.", "to se Egypt stal římskou provincií"], ["776 př. n. l.", "první olympijské hry"]]}, {"t": "Které civilizace patří do antiky?", "ok": "Řecko a Řím", "s": [["Egypt a Mezopotámie", "to jsou nejstarší civilizace"], ["Indie a Čína", "to jsou nejstarší civilizace"], ["Keltové a Germáni", "to jsou pravěké kmeny ve střední Evropě"], ["Fénicie a Persie", "patří k nejstarším civilizacím"]]}]},
 {"id": "k-polis", "kap": "kostra", "pri": "jadro", "vysv": "Polis = řecký městský stát (město + okolí, vlastní vláda a zákony).", "var": [{"t": "Co je polis?", "ok": "řecký městský stát", "s": [["aristokracie", "aristokracie"], ["opevněné keltské hradiště", "to je oppidum"], ["egyptská hrobka", "to je pyramida nebo skalní hrobka"], ["indická kasta", "kasta je skupina v Indii, do které se člověk narodí"]]}, {"t": "Jak se jmenuje řecký městský stát?", "ok": "polis", "s": [["oppidum", "oppidum je keltské opevněné hradiště"], ["zikkurat", "zikkurat je stupňovitý chrám v Mezopotámii"], ["metropole", "metropole je mateřská obec kolonie"], ["aristokracie", "aristokracie"]]}]},
 {"id": "p-dalsi-deleni", "kap": "k1", "pri": "jadro", "vysv": "Přisvojovací × výrobní hospodářství = dělení podle získávání potravy; tlupa × rod = podle uspořádání společnosti.", "pomucka": "přisvojit si = vzít si, co už je", "var": [{"t": "Podle čeho dělíme pravěk na přisvojovací a výrobní hospodářství?", "ok": "podle způsobu získávání potravy", "s": [["podle uspořádání společnosti", "to je dělení tlupa × rod"], ["podle materiálu nástrojů", "to je dělení na dobu kamennou, bronzovou a železnou"], ["podle vládnoucích dynastií", "tak se dělí Egypt"], ["podle druhů písma", "pravěk písmo neznal"]]}, {"t": "Co je přisvojovací hospodářství?", "ok": "lov, rybolov a sběr", "s": [["zemědělství a chov", "výrobní hospodářství"], ["obchod s kovy", "směnný obchod byl až v eneolitu, není to hospodářství podle potravy"], ["výroba keramiky", "keramika je řemeslo, ne způsob získávání potravy"], ["vláda žen v rodu", "matriarchát"]]}]},
 {"id": "p-matriarchat", "kap": "k1", "pri": "doplnek", "vysv": "Matriarchát = v rodu mají hlavní slovo ženy; v eneolitu se mění na patriarchát.", "var": [{"t": "Co je matriarchát?", "ok": "hlavní slovo v rodu mají ženy", "s": [["hlavní slovo v rodu mají muži", "patriarchát"], ["vláda kněží", "vláda kněží se jmenuje teokracie"], ["vláda šlechty", "aristokracie"], ["vláda jednoho samovládce", "tyran"]]}, {"t": "Jak se v eneolitu změnilo uspořádání společnosti?", "ok": "matriarchát → patriarchát", "s": [["patriarchát → matriarchát", "je to obráceně"], ["tlupa → polis", "polis vznikla až v Řecku"], ["aristokracie → demokracie", "to je až antické Řecko"], ["kasty → rody", "kasty jsou až v Indii za Árjů"]]}]},
 {"id": "p-hominizace", "kap": "k1", "pri": "jadro", "vysv": "Hominizace = proces polidštění: napřímení a chůze po dvou, vývoj ruky (palec proti prstům), řeč, větší mozek.", "var": [{"t": "Co je hominizace?", "ok": "proces polidštění – vývoj od předků člověka k dnešnímu člověku", "s": [["zemědělská revoluce", "to je neolitická revoluce"], ["ochočování zvířat", "to je domestikace"], ["vypalování lesů na pole", "to je žďáření"], ["osidlování prázdného území", "to je kolonizace"]]}, {"t": "Co NEpatří mezi znaky hominizace?", "ok": "výroba bronzu", "s": [["napřímení a chůze po dvou", "to znak hominizace je"], ["palec postavený proti prstům", "to znak hominizace je"], ["vznik řeči", "to znak hominizace je"], ["zvětšování mozku", "to znak hominizace je"]]}]},
 {"id": "p-habilis", "kap": "k1", "pri": "jadro", "vysv": "Homo habilis = člověk zručný: malý mozek, primitivní nástroje, žil jen v Africe.", "var": [{"t": "Který druh se nazývá „člověk zručný“?", "ok": "Homo habilis", "s": [["Homo erectus", "Homo erectus"], ["Homo sapiens", "Homo sapiens"], ["neandertálec", "neandertálec"], ["Australopithecus", "Australopithecus"]]}, {"t": "Co znamená Homo habilis?", "ok": "člověk zručný", "s": [["člověk vzpřímený", "Homo erectus"], ["člověk rozumný", "Homo sapiens"], ["jižní opice", "to znamená Australopithecus"], ["člověk z údolí Neander", "neandertálec"]]}]},
 {"id": "p-erectus", "kap": "k1", "pri": "jadro", "vysv": "Homo erectus = člověk vzpřímený: pěstní klín, uměl rozdělat a udržovat oheň, rozšířil se do Evropy a Asie.", "var": [{"t": "Který druh jako první uměl rozdělat a udržovat oheň?", "ok": "Homo erectus", "s": [["Homo habilis", "Homo habilis"], ["Australopithecus", "Australopithecus"], ["neandertálec", "neandertálec oheň znal, ale už po Homo erectus"], ["Homo sapiens", "Homo sapiens oheň znal, ale nebyl první"]]}, {"t": "Co je pěstní klín?", "ok": "opracovaný kamenný nástroj držený v dlani", "s": [["bronzová sekera", "pěstní klín je z kamene"], ["keramická nádoba", "keramika je až z neolitu"], ["dřevěný srp", "srpy byly až v neolitu"], ["železný meč", "železo je až v době železné"]]}]},
 {"id": "p-neandertalec", "kap": "k1", "pri": "jadro", "vysv": "Neandertálec měl velký mozek, pohřbíval mrtvé a je slepou vývojovou větví – vymřel.", "var": [{"t": "Co platí o neandertálci?", "ok": "pohřbíval mrtvé a je slepou vývojovou větví", "s": [["je náš přímý předek, ze kterého jsme se vyvinuli", "neandertálci žili současně s námi a vymřeli"], ["měl menší mozek než Homo habilis", "měl velký mozek – asi 1 450 cm³"], ["žil jen v Africe", "žil v Evropě a na Blízkém východě"], ["neuměl vyrábět nástroje", "jeho nástroje byly opracovanější a důmyslnější"]]}, {"t": "Co znamená „slepá vývojová větev“?", "ok": "druh, ze kterého se už nic dalšího nevyvinulo a vymřel", "s": [["druh, který neviděl", "slovo „slepá“ tu znamená, že větev nikam nevede"], ["nejstarší druh člověka", "nejstarší je Australopithecus"], ["druh, ze kterého vznikl dnešní člověk", "to je naopak hlavní větev"], ["druh, který žil jen v jeskyních", "nesouvisí s místem života"]]}]},
 {"id": "p-mozek", "kap": "k1", "pri": "doplnek", "vysv": "Během vývoje se mozek zvětšoval (asi 450 → 1 350 cm³) a nadočnicové oblouky se zmenšovaly.", "var": [{"t": "Jak se během vývoje člověka měnily nadočnicové oblouky?", "ok": "zmenšovaly se", "s": [["zvětšovaly se", "zvířecí rysy naopak ubývaly"], ["neměnily se", "měnily se – dnes skoro žádné nejsou"], ["objevily se až u Homo sapiens", "výrazné měly už starší druhy"], ["zmizely už u Australopitheka", "výrazné oblouky měl ještě neandertálec"]]}, {"t": "Jak se během vývoje měnil objem mozku?", "ok": "zvětšoval se", "s": [["zmenšoval se", "mozek se zvětšoval – z asi 450 na 1 350 cm³"], ["zůstával stejný", "měnil se výrazně"], ["byl největší u Australopitheka", "Australopithecus měl nejmenší mozek – asi 450 cm³"], ["zvětšil se až v době bronzové", "dnešní velikost měl už Homo sapiens v paleolitu"]]}]},
 {"id": "p-ker", "kap": "k1", "pri": "doplnek", "vysv": "Vývoj člověka byl rozvětvený keř: více druhů žilo současně, mnoho větví vymřelo, přežil jen Homo sapiens.", "var": [{"t": "Jak se dnes zobrazuje vývoj člověka?", "ok": "jako rozvětvený keř, kde více druhů žilo současně", "s": [["jako přímá řada, kde jeden druh vždy nahradil předchozí", "to je tradiční, zjednodušená představa"], ["jako vývoj jen v Evropě", "člověk vznikl v Africe"], ["jako vývoj trvající pár tisíc let", "trval miliony let"], ["jako vývoj přímo z gorily", "gorila je náš příbuzný, ne předek"]]}, {"t": "Kde vznikl člověk?", "ok": "v Africe", "s": [["v Evropě", "do Evropy se rozšířil až později"], ["v Asii", "do Asie se rozšířil z Afriky"], ["v Mezopotámii", "Mezopotámie je kolébka civilizace, ne člověka"], ["v Americe", "do Ameriky se lidé dostali až velmi pozdě (asi před 15–20 tisíci lety)"]]}]},
 {"id": "d-paleolit", "kap": "k2", "pri": "jadro", "vysv": "Paleolit: lovci a sběrači, pěstní klín, jeskynní malby (Lascaux, Altamira), venuše (Dolní Věstonice).", "var": [{"t": "Do kterého období patří jeskynní malby v Lascaux a Altamiře?", "ok": "paleolit", "s": [["neolit", "neolit"], ["mezolit", "mezolit"], ["eneolit", "eneolit"], ["doba bronzová", "doba bronzová"]]}, {"t": "Které naleziště z paleolitu je v Česku?", "ok": "Dolní Věstonice", "s": [["Altamira", "Altamira je ve Španělsku"], ["Lascaux", "Lascaux je ve Francii"], ["Hallstatt", "Hallstatt je v Rakousku a patří do doby železné"], ["Knóssos", "Knóssos je palác na Krétě"]]}]},
 {"id": "d-mezolit", "kap": "k2", "pri": "doplnek", "vysv": "Mezolit: oteplení po době ledové, osídlení celého světa, první počátky chovu a zemědělství, ale převládá lov a sběr.", "var": [{"t": "Co se stalo v mezolitu?", "ok": "oteplilo se a člověk osídlil celý svět", "s": [["vznikly první státy", "to je eneolit"], ["lidé začali vyrábět bronz", "to je doba bronzová"], ["převládlo zemědělství", "v mezolitu pořád převládá lov a sběr"], ["vznikla první města", "první města vznikla až v Mezopotámii"]]}, {"t": "Jaké hospodářství převládá v mezolitu?", "ok": "pořád přisvojovací (lov, rybolov, sběr)", "s": [["výrobní – zemědělství a chov", "výrobní převládne až v neolitu"], ["palácové hospodářství", "to je mykénské Řecko"], ["obchod s bronzem", "bronz je až v době bronzové"], ["řemeslná výroba", "specializovaná řemesla jsou až v době bronzové"]]}]},

  function novaFronta(ids, potreba) { return { potreba, nove: ids.slice(), prace: {}, posledni: null }; }

  function zFronty(stav, vypln) {

      const nauc = vypln ? Object.keys(stav.fakta).filter(id => stav.fakta[id].naucen && id !== fr.posledni) : [];

    if (jine.length) {

const $ = id => document.getElementById(id);
const CESTA = location.pathname.replace(/^.*\/annschool\//, "").replace(/^\//, "") || "rychlouceni.html";

let S = null;            // uložený stav: { planovac, cas, ulozeno, prevzato }

function seedNahodny() { return (Math.random() * 4294967296) >>> 0; }
function novyStav() { return { planovac: Planovac.novy(F, seedNahodny()), cas: { uceni_s: 0, rano_s: 0, rano_otazek: 0, pauza: false, naRano: false }, ulozeno: 0, otazka: null }; }
function nactiStav() {

// starý stav → nová konfigurace: statistiky podle id, neznámá fakta pryč, nová fakta jako nová, fronta znovu
function prevzit(s) {
  const n = novyStav(), p = n.planovac, st = s.planovac;

    const o = st.fakta && st.fakta[f.id];

  const vPraci = st.fronta && st.rezim === "uceni" ? Object.keys(st.fronta.prace || {}).filter(id => FAKT[id]) : [];
  p.fronta.nove = F.map(f => f.id).filter(id => !p.fakta[id].naucen && !vPraci.includes(id));
  vPraci.forEach(id => { if (!p.fakta[id].naucen) p.fronta.prace[id] = Object.assign({ due: p.n, streak: 0, posl: -1 }, st.fronta.prace[id], { due: p.n }); });

}

/* ---------- pomocné ---------- */
const esc = s => String(s).replace(/[&<>"]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
function zamichej(a) { a = a.slice(); for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; }
function pocetNaucenych(p) { return F.filter(f => p.fakta[f.id].naucen).length; }
function statistika(p) {
  let odp = 0, nap = 0, napOk = 0;
  F.forEach(f => { const x = p.fakta[f.id]; odp += x.spatne + x.spravne; if (x.napoprve !== null) { nap++; if (x.napoprve) napOk++; } });
  return { odpovedi: odp, spravne_napoprve_pct: nap ? Math.round(napOk / nap * 100) : null };
}
// odhad zbývajícího času učení (min): potřebné správné odpovědi / úspěšnost + závěrečné kolo, × tempo
function odhadMin(p) {

    const fr = p.fronta;
    F.forEach(f => { if (p.fakta[f.id].naucen) return; const w = fr.prace[f.id]; otazek += (NAST.naucenoPo - (w ? w.streak : 0)) / usp; });
    const chybne = F.filter(f => p.fakta[f.id].spatne > 0).length, zbyva = F.filter(f => !p.fakta[f.id].naucen && !p.fakta[f.id].spatne).length;
    otazek += chybne + zbyva * (1 - usp);

    S.cas.naRano = true; S.cas.pauza = true; uloz();
    udalost("rychlo_souhrn", "nabídka na ráno", Object.assign(souhrnDetail(), { nabidka: "na_rano" }));
    dialog(`Učíš se už hodinu (naučeno ${pocetNaucenych(p)} z ${F.length}). Zbytek nech na ráno – ráno klepni na „Ranní opakování“, nebo „Pokračovat“.`, [
      ["Konec na dnes", () => uvod()], ["Ještě pokračovat", () => dalsiOtazka(false), true]]);
    return true;
  }
  if (!S.cas.pauza && S.cas.uceni_s >= NAST.pauzaMin * 60) {
    S.cas.pauza = true; uloz();
    dialog(`Učíš se už ${NAST.pauzaMin} minut. Dej si krátkou pauzu (5 minut) – protáhni se, napij se. Pak pokračuj.`, [["Pokračovat", () => dalsiOtazka(false), true]]);
    return true;
  }
  return false;
}
function mezistrankaZaver(prvni) {
  ukaz("scMezi"); oblast("Závěrečné kolo");
  const n = S.planovac.zaver.seznam.length;
  $("mNadpis").textContent = "Všechno naučeno!";
  $("mText").textContent = `Teď závěrečné kolo: ${n} ${n === 1 ? "otázka" : n < 5 ? "otázky" : "otázek"} z toho, co ti dělalo potíže – každá jednou, jinak položená.`;
  $("mTabulka").innerHTML = "";
  const t = $("mTlacitka"); t.innerHTML = "";
  const b = document.createElement("button"); b.type = "button"; b.className = "btn hl"; b.id = "btnZaver"; b.textContent = "Spustit závěrečné kolo";
  b.onclick = () => pripravOtazku(prvni); t.appendChild(b);
  posliSouhrn(true);
}
function konecRezimu(rezim) {
  if (rezim === "rano") {
    posliSouhrn(true);
    S.planovac = Planovac.konecRano(S.planovac); uloz();
    ukaz("scMezi"); oblast("Souhrn");
    $("mNadpis").textContent = "Ranní opakování hotové";
    $("mText").textContent = "Všechno z ranního opakování jsi odpověděla správně. Hodně štěstí v testu!";
    $("mTabulka").innerHTML = "";
    tlacitkaSouhrnu();
    return;
  }
  souhrn();
}
function souhrn() {
  const p = S.planovac, st = statistika(p);
  ukaz("scMezi"); oblast("Souhrn");
  posliSouhrn(true);
  $("mNadpis").textContent = "Hotovo!";
  $("mText").textContent = `Naučeno ${pocetNaucenych(p)} z ${F.length}. Odpovědí ${st.odpovedi}, správně napoprvé ${st.spravne_napoprve_pct ?? 0} %, ` +
    `čas asi ${Math.round(S.cas.uceni_s / 60)} min. Ráno si dej „Ranní opakování“.`;
  const slabe = F.filter(f => p.fakta[f.id].spatne > 0).sort((a, b) => p.fakta[b.id].spatne - p.fakta[a.id].spatne).slice(0, 12);
  $("mTabulka").innerHTML = slabe.length ? "<table class='slabe'><tr><th>Co ti dělalo potíže</th><th>chyb</th></tr>" +
    slabe.map(f => `<tr><td>${esc(FAKT[f.id].var[0].t)}<br><span class="muted">${esc(FAKT[f.id].var[0].ok)}</span></td><td>${p.fakta[f.id].spatne}</td></tr>`).join("") + "</table>" : "";
  tlacitkaSouhrnu();
}
function tlacitkaSouhrnu() {
  const t = $("mTlacitka"); t.innerHTML = "";
  [["Ranní opakování", ranniOpakovani, true], ["Úvod", uvod], ["Začít znovu", zacitZnovu]].forEach(([l, fn, hl]) => {
    const b = document.createElement("button"); b.type = "button"; b.className = "btn" + (hl ? " hl" : ""); b.textContent = l; b.onclick = fn; t.appendChild(b);
  });
}

/* ---------- čas učení (jen viditelná stránka s otázkou, bez dlouhé nečinnosti) ---------- */
let tik = Date.now(), posledniVstup = Date.now();
["pointerdown", "keydown", "touchstart"].forEach(t => window.addEventListener(t, () => { posledniVstup = Date.now(); }, { passive: true, capture: true }));
setInterval(() => {
  const now = Date.now(), d = Math.min(now - tik, 5000) / 1000; tik = now;
  if (!S || document.visibilityState !== "visible" || $("scOtazka").hidden || now - posledniVstup > NAST.necinnostS * 1000) return;
  if (S.planovac.rezim === "rano") S.cas.rano_s += d; else S.cas.uceni_s += d;
}, 1000);
setInterval(() => { if (S && document.visibilityState === "visible") uloz(); }, 15000);
document.addEventListener("visibilitychange", () => { if (document.visibilityState === "hidden") { uloz(); posliSouhrn(false); } else tik = Date.now(); });
window.addEventListener("pagehide", () => { uloz(); posliSouhrn(false); });

/* ---------- ovládání ---------- */
$("btnZacit").onclick = () => zacit(false);
$("btnPokracovat").onclick = () => zacit(true);
$("btnRano").onclick = ranniOpakovani;
$("btnZnovu").onclick = zacitZnovu;
$("btnUkazat").onclick = odkryj;
$("btnNevim").onclick = () => { if (!OT || zodpovezeno) return; if (!OT.odkryto) { OT.odkryto = true; } odpovez("", true); };
$("btnDalsi").onclick = dalsiKlik;
$("btnUvod").onclick = () => { uloz(); uvod(); };
$("btnHome").onclick = () => { uloz(); posliSouhrn(false); if (window.Zaznam) Zaznam.beacon(); location.href = "../index.html"; };

/* ---------- jen pro čtení (kontrola) ---------- */
window.Rychlouceni = Object.freeze({
  stav: () => (S ? JSON.parse(JSON.stringify(S)) : null),
  otazka: () => {
    if (!OT) return null;
    const f = FAKT[OT.id], v = f.var[OT.v];
    return { id: OT.id, varianta: OT.v, rezim: OT.rezim, poradi: OT.poradi, text: v.t, moznosti: OT.moznosti.slice(), spravna: OT.moznosti.indexOf(v.ok),
      spravnaText: v.ok, kostra: !!KAP[f.kap].kostra, odkryto: !!OT.odkryto, zodpovezeno: !!zodpovezeno };
  },
  planovac: Planovac,
  poradiFaktu: () => F.map(f => Object.assign({}, f)),
  nastaveni: Object.freeze(Object.assign({}, NAST))
});

S = nactiStav();
if (S && prevzato) { uloz(); toast("Pokračuješ, kde jsi skončila ve starší verzi."); }
uvod();
</script>
