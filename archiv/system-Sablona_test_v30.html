<!doctype html>
<html lang="cs">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Test</title>
<!--
  ŠABLONA HTML TESTU – Ann School (system/Sablona_test_vXX.html)
  Nový test = kopie této šablony do složky předmětu: <předmět>/<tema>_<typ>_vXX.html (typ: test, test-1, test-opravny …).
  Měň JEN blok „KONFIGURACE TESTU“ níže. Postup: system/Navod_test_vXX.md.
  Knihovny: ../system/lib/ (stránka musí ležet o jednu složku pod rootem):
  PDF (html2canvas, jsPDF), vektorová síť (vektory.js + vektory.css), záznam výsledků (zaznam.js).
  v16: jedna stránka na příklad (zadání → odpověď → papír), časová osa dole, 3 pokusy,
       záznam výsledků do Google tabulky, iPad na výšku i na šířku.
  v17: píše se jen perem (Pencil, stylus) nebo myší, prst vždy jen posouvá (i na Androidu);
       ‹ › v časové ose, menší kolečka a tlačítka; rozpracovaný test se průběžně ukládá v prohlížeči
       a po znovuotevření se nabídne „Pokračovat“ (odpovědi, kresby, sítě, pokusy, časy).
  v18: název PDF obsahuje i podtyp testu (Test_<tema>_<typ>_vXX_<datum>_NN.pdf, typ ze jména souboru);
       z konfigurace odstraněny volby finalScratch, sideScratch, scratch (od v16 bez účinku).
  v19: tlačítka papíru (Zpět, Smazat, ↖ Na začátek) vlevo nahoře, text lišty za nimi –
       vpravo nahoře překážela pravákovi při psaní.
  v20: z lišty papíru odstraněno tlačítko „↖ Na začátek“ (není potřeba), zůstávají Zpět a Smazat.
  v21: náhled papíru pro přehled výsledků: každých 20 s (jen když se papír změnil a nic nečeká ve frontě)
       se pošle obrázek papíru (událost „nahled“, skript v03 drží jen poslední pro každý příklad);
       start posílá zadání a správné odpovědi všech příkladů; Zpět a Smazat na papíře mění verzi papíru
       (dřív se po nich obrázek u dalšího pokusu neposlal znovu).
  v22: na stránce se nic neoznačuje dlouhým stiskem (dlaň, prst, pero) – user-select: none, potlačené
       selectstart a místní nabídka; psát a označovat jde jen v polích odpovědí (dřív se náhodně označila
       lišta papíru nebo zadání).
  v23: poloha v testu pro přehled: přechod na jiný příklad = událost „presun“, každých 20 s (a při odchodu
       a návratu) událost „pozice“ – příklad, čas na něm v této návštěvě a celkem, aktivní ano/ne
       (skript v04 drží jen poslední stav v listu Stav); start posílá u příkladů i text nápovědy.
  v24: šedá (nedokončeno) jen když příklad rozpracovala – otevřela nápovědu, napsala něco na papír nebo
       vyplnila odpověď (_st.zacala); jen otevřený a přeskočený příklad zůstane bílý (souhrn posílá navstiveno, zacala).
  v25: dotyky pera (Apple Pencil) na papíře si stránka bere sama (touchstart/touchmove/touchend s touchType „stylus“
       → preventDefault); Safari je jinak u rychlých tahů po sobě bralo pro Scribble nebo dvojité klepnutí a tah
       se ztratil (H bez vodorovné čárky). Prst se nemění, Scribble v polích odpovědí funguje dál.
  v26: zlomky s vodorovnou zlomkovou čarou: v textech konfigurace [[čitatel/jmenovatel]] (např. [[3/4]], −[[27/8]],
       [[√5 + 1/2]], i v exponentu a^([[2/3]])); do záznamu jde jako 3/4, se závorkami u složeného čitatele/jmenovatele.
  v27: odmocniny jako ve škole – čára nad celým odmocněncem, bez závorek: v textech konfigurace √(a + b), ∛(−[[27/8]]),
       ⁴√(a³), ⁿ√(aᵏ), √12, 2√3, √a; závorka hned za √ jen ohraničuje odmocněnce a nezobrazí se. Do záznamu jde text beze změny.
  v28: znak odmocniny se kreslí (SVG) přes celou výšku odmocněnce a plynule navazuje na čáru nad ním (jako v zápiscích, KaTeX);
       odmocnitel (∛, ∜, ⁴√, ⁿ√) je malý vlevo nahoře v háčku odmocniny. Zápis v konfiguraci se nemění.
  v29: zlomek v exponentu (a^([[2/3]])) je menší a výš, aby se nepletl s normálními čísly (dřív skoro velikosti základu).
  v30: úvodní stránka s teorií (TEST.uvod – HTML i s obrázky SVG) před 1. příkladem, „📖 Úvod“ v časové ose,
       čas na úvodu jde do souhrnu (uvod_s); postup řešení u každého typu (reseni: [...] – řádky textu nebo
       { tabulka: [[…], […]] }): po uzavření příkladu (správně nebo 3. pokus) tlačítko „Ukázat řešení“
       (událost „postup“); cislice: true u číselného pole = správný výsledek bez mezer po tisících (dvojková soustava).
       Bez uvod, reseni a cislice se test chová jako v29. Opraveno: start posílal sablona „v26“ (od v27).
  Horní panel: nová systémová tlačítka přidávej do <div class="panel-actions">.
-->
<script src="../system/lib/html2canvas-1.4.1.min.js"></script>
<script src="../system/lib/jspdf-2.5.2.min.js"></script>
<link rel="stylesheet" href="../system/lib/vektory.css">
<script src="../system/lib/vektory.js"></script>
<script src="../system/lib/zaznam.js"></script>
<style>
  :root {
    --bg: #fafaf7; --paper: #ffffff; --text: #1d1d1b; --muted: #6b6b66; --line: #dcdcd5;
    --ok: #1f7a3a; --ok-bg: #e6f4ea; --bad: #b3261e; --bad-bg: #fbe9e7;
    --accent: #2b5cab; --panel-h: 48px; --tl-h: 56px;
    --st-zelena: #1f8a3c; --st-oranzova: #e08a00; --st-cervena: #b3261e; --st-seda: #a9a9a2; --st-hotovo: #2b5cab;
  }
  * { box-sizing: border-box; }
  html { -webkit-text-size-adjust: 100%; }
  html, body { height: 100%; overflow: hidden; }
  /* v22: dlouhý stisk (dlaň, prst, pero) nic neoznačuje ani neotevře nabídku; psát a označovat jde jen v polích */
  html, body { -webkit-user-select: none; user-select: none; -webkit-touch-callout: none; }
  input, textarea { -webkit-user-select: text; user-select: text; -webkit-touch-callout: default; }
  body { margin: 0; background: var(--bg); color: var(--text);
    font: 17px/1.4 -apple-system, "Segoe UI", Roboto, sans-serif; }

  /* ---------- horní panel ---------- */
  #panel { position: fixed; top: 0; left: 0; right: 0; z-index: 20;
    min-height: var(--panel-h); padding: 6px 12px; padding-top: calc(6px + env(safe-area-inset-top));
    background: rgba(255,255,255,.97); border-bottom: 1px solid var(--line);
    display: flex; align-items: center; gap: 12px; }
  .panel-title { flex: 1 1 auto; min-width: 0; font-size: 15px; font-weight: 600;
    white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .panel-title .ver { color: var(--muted); font-weight: 400; }
  .panel-title .timer { margin-left: 10px; color: var(--accent); }
  .panel-title .timer.over { color: var(--bad); }
  .panel-actions { flex: 0 0 auto; display: flex; align-items: center; gap: 6px; }
  .panel-actions .sep { width: 1px; height: 24px; background: var(--line); margin: 0 4px; }
  .panel-actions button { font: inherit; font-size: 13px; padding: 3px 8px; border-radius: 7px;
    border: 2px solid var(--accent); background: var(--paper); color: var(--accent); cursor: pointer; white-space: nowrap; }
  .panel-actions button.on { background: var(--accent); color: #fff; }
  .panel-actions button.ready { background: var(--ok); border-color: var(--ok); color: #fff; }
  .panel-actions .swatch { width: 22px; height: 22px; border-radius: 50%; padding: 0; border: 3px solid transparent; }
  .panel-actions .swatch.on { border-color: var(--text); background-clip: padding-box; }
  .panel-actions button.width { width: 30px; height: 26px; padding: 0 6px; display: inline-flex; align-items: center; }
  .panel-actions button.width i { display: block; width: 100%; background: currentColor; border-radius: 3px; }
  .draw-tools { display: flex; align-items: center; gap: 6px; }
  @media (max-width: 700px) {
    .panel-actions .swatch { width: 20px; height: 20px; }
    .panel-actions button { padding: 3px 6px; font-size: 12px; }
    .panel-actions button.width { width: 24px; }
    .panel-actions .sep { margin: 0 1px; }
  }

  /* ---------- plocha mezi panelem a časovou osou ---------- */
  #stage { position: fixed; left: 0; right: 0; top: var(--panel-h); bottom: var(--tl-h);
    overflow-y: auto; -webkit-overflow-scrolling: touch; padding: 10px 16px 12px; }
  .qpage { max-width: 1160px; margin: 0 auto; }
  .qpage[hidden] { display: none; }
  .q-head { display: flex; align-items: baseline; gap: 10px; flex-wrap: wrap; font-size: 13px; color: var(--muted); }
  .q-head .q-num { font-weight: 600; color: var(--text); font-size: 14px; }
  .q-head .q-state { margin-left: auto; font-weight: 600; }
  .q-head .q-state.st-zelena { color: var(--st-zelena); }
  .q-head .q-state.st-oranzova { color: var(--st-oranzova); }
  .q-head .q-state.st-cervena { color: var(--st-cervena); }
  .q-head .q-state.st-hotovo { color: var(--st-hotovo); }
  .intro { margin: 4px 0 0; font-size: 14px; color: var(--muted); }
  /* v30: úvodní stránka s teorií a postup řešení */
  .uvod { max-width: 1160px; margin: 0 auto; }
  .uvod[hidden] { display: none; }
  .uvod h1 { font-size: 22px; margin: 4px 0 6px; }
  .uvod h2 { font-size: 18px; margin: 18px 0 6px; color: var(--accent); }
  .uvod p, .uvod li { font-size: 16px; line-height: 1.5; }
  .uvod .obr { margin: 8px 0 4px; max-width: 620px; }
  .uvod .obr svg { width: 100%; height: auto; display: block; }
  .uvod .start { margin: 18px 0 10px; }
  .uvod hr { border: 0; border-top: 1px solid var(--line); margin: 16px 0; }
  .reseni table.rt { border-collapse: collapse; margin: 4px 0; font-size: 15px; }
  .reseni table.rt td { border: 1px solid var(--line); padding: 2px 8px; text-align: center; background: #fff; }
  .reseni table.rt:not(.bp) td:first-child { text-align: left; color: var(--muted); background: transparent; }
  .reseni table.rt tr:first-child td { font-weight: 600; }
  .q-text { font-size: 19px; margin-top: 6px; }
  .q-row { display: flex; align-items: center; flex-wrap: wrap; gap: 8px; font-size: 19px; margin-top: 8px; }
  input.ans { width: 8em; font-size: 19px; padding: 4px 8px; border: 2px solid var(--line);
    border-radius: 6px; background: var(--paper); color: var(--text); text-align: right; }
  input.ans:focus { outline: none; border-color: var(--accent); }
  input.ans:disabled { color: var(--text); -webkit-text-fill-color: var(--text); opacity: 1; }
  input.ans.f-ok { border-color: var(--ok); background: var(--ok-bg); }
  input.ans.f-bad { border-color: var(--bad); background: var(--bad-bg); }
  .q-row.multi input.ans { width: 4.6em; }
  /* šipka nad písmenem: {F} v textu konfigurace (CSS rámečky – html2canvas ji přenese do PDF) */
  .vec { position: relative; display: inline-block; font-family: Georgia, "Times New Roman", serif; font-style: italic; padding: 0 1px; }
  .vec::before { content: ""; position: absolute; left: 2px; right: 2px; top: 1px; border-top: 1.3px solid currentColor; }
  .vec::after { content: ""; position: absolute; right: 0; top: -1.6px; width: 0; height: 0;
    border-left: 5px solid currentColor; border-top: 3px solid transparent; border-bottom: 3px solid transparent; }
  sup { font-size: .72em; line-height: 0; }
  .per { text-decoration: overline; }
  /* v26: zlomek s vodorovnou čarou – [[čitatel/jmenovatel]] v textu konfigurace (html2canvas ho přenese do PDF) */
  .zl { display: inline-flex; flex-direction: column; align-items: stretch; vertical-align: middle;
    text-align: center; line-height: 1.12; font-size: .9em; margin: 0 .12em; }
  .zl > .zc { padding: 0 .18em 1px; border-bottom: 1.5px solid currentColor; white-space: nowrap; }
  .zl > .zj { padding: 1px .18em 0; white-space: nowrap; }
  /* v29: zlomek v exponentu menší a výš – nesmí vypadat jako normální číslo vedle základu */
  sup .zl { font-size: .75em; line-height: 1; vertical-align: .55em; margin: 0 .05em; }
  sup .zl > .zc, sup .zl > .zj { padding-left: .08em; padding-right: .08em; }
  sup .zl > .zc { border-bottom-width: 1px; }
  /* v27: odmocnina s čarou nad celým odmocněncem – √(a + b), ∛(…), ⁿ√(…), √12 (html2canvas ho přenese do PDF) */
  /* v28: znak odmocniny je SVG přes celou výšku odmocněnce a navazuje na čáru nad ním */
  .odm { position: relative; display: inline-block; white-space: nowrap; padding-left: .62em; margin: 0 .04em; }
  .odm > .oz { position: absolute; left: 0; top: 0; width: .66em; height: 100%; overflow: visible; }
  .odm > .oz path { fill: none; stroke: currentColor; stroke-width: 1.3px; stroke-linejoin: round; stroke-linecap: round; vector-effect: non-scaling-stroke; }
  .odm > .op { display: inline-block; border-top: 1.3px solid currentColor; padding: .1em .12em 0 .1em; line-height: 1.15; }
  .odm > .oi { position: absolute; left: .02em; bottom: 52%; font-size: .55em; line-height: 1; }
  .odm.si { padding-left: .72em; }
  sup .odm > .op { border-top-width: 1px; }
  sup .odm > .oz path { stroke-width: 1px; }
  /* výběr z možností */
  .opts { display: inline-flex; flex-wrap: wrap; gap: 8px; }
  .opts button { font: inherit; font-size: 16px; padding: 4px 12px; border-radius: 8px; border: 2px solid var(--line);
    background: var(--paper); color: var(--text); cursor: pointer; }
  .opts button.on { border-color: var(--accent); background: #e8eefa; font-weight: 600; }
  .opts button:disabled { cursor: default; }
  .opts.f-ok button.on { border-color: var(--ok); background: var(--ok-bg); }
  .opts.f-bad button.on { border-color: var(--bad); background: var(--bad-bg); }
  /* vektorová síť */
  .q-grid { max-width: 560px; margin-top: 6px; }
  .grid-tools { display: flex; flex-wrap: wrap; align-items: center; gap: 6px; margin-top: 6px; font-size: 14px; color: var(--muted); }
  .grid-tools button { font: inherit; font-size: 15px; padding: 3px 10px; border-radius: 8px; border: 2px solid var(--line);
    background: var(--paper); color: var(--text); cursor: pointer; }
  .grid-tools button.on { border-color: var(--accent); background: #e8eefa; font-weight: 600; }
  .grid-tools button:disabled { opacity: .5; cursor: default; }
  /* tlačítka příkladu */
  .q-actions { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; margin-top: 8px; }
  button.btn { font: inherit; font-size: 14px; padding: 4px 12px; border-radius: 7px;
    border: 2px solid var(--accent); background: var(--paper); color: var(--accent); cursor: pointer; }
  button.btn.primary { background: var(--accent); color: #fff; }
  button.btn:disabled { opacity: .4; cursor: default; }
  .fb { font-size: 15px; margin-top: 6px; }
  .fb:empty { display: none; }
  .fb.ok { color: var(--ok); } .fb.bad { color: var(--bad); }
  .hint { font-size: 15px; color: var(--muted); margin-top: 6px; padding: 4px 10px; border-left: 3px solid var(--line); }
  .hint[hidden], .reseni[hidden] { display: none; }
  .reseni { margin-top: 6px; padding: 6px 10px; border-left: 3px solid var(--accent); background: #f2f5fb; font-size: 15px; line-height: 1.5; }
  .reseni b { color: var(--accent); }

  /* ---------- papír (jeden, sdílený; tahy má každý příklad vlastní) ---------- */
  #paperBox { max-width: 1160px; margin: 10px auto 0; border: 1px solid var(--line); border-radius: 8px; background: var(--paper); overflow: hidden; }
  #paperBox[hidden] { display: none; }
  .paper-bar { display: flex; align-items: center; gap: 6px; padding: 4px 10px 4px 6px; border-bottom: 1px solid #ecece6; font-size: 12px; color: #9a9a93; }
  .paper-bar span { flex: 1 1 auto; margin-left: 6px; }
  .paper-bar button { font-size: 12px; padding: 2px 7px; border-radius: 6px; border: 1px solid var(--line); background: #fff; color: var(--text); cursor: pointer; }
  #paperView { overflow: auto; overscroll-behavior: contain; height: 300px; touch-action: none; }   /* v17: posun prstem řeší skript */
  #paper { display: block; background-color: #fff;
    background-image: linear-gradient(#edf1f6 1px, transparent 1px), linear-gradient(90deg, #edf1f6 1px, transparent 1px);
    background-size: 24px 24px; }

  /* ---------- souhrn ---------- */
  .sum h1 { font-size: 22px; margin: 4px 0 2px; }
  .sum .meta { color: var(--muted); font-size: 13px; }
  .sum .big { font-size: 26px; font-weight: 700; margin: 10px 0 2px; }
  .sum table { border-collapse: collapse; margin-top: 10px; font-size: 15px; }
  .sum td, .sum th { padding: 4px 10px; border-bottom: 1px solid #ecece6; text-align: left; }
  .sum .legend { display: flex; gap: 14px; flex-wrap: wrap; font-size: 13px; color: var(--muted); margin-top: 12px; }
  .sum .legend i { display: inline-block; width: 12px; height: 12px; border-radius: 50%; vertical-align: -1px; margin-right: 4px; border: 1px solid #0002; }
  .sum .send { font-size: 13px; color: var(--muted); margin-top: 14px; }
  .note { font-size: 13px; color: var(--muted); margin-top: 12px; }

  /* ---------- časová osa ---------- */
  #timeline { position: fixed; left: 0; right: 0; bottom: 0; z-index: 20; background: rgba(255,255,255,.97);
    border-top: 1px solid var(--line); padding: 6px 8px; padding-bottom: calc(6px + env(safe-area-inset-bottom));
    display: flex; align-items: center; gap: 8px; }
  #tlItems { flex: 1 1 auto; min-width: 0; display: flex; flex-wrap: wrap; align-items: center; gap: 6px 14px; }
  .tl-sec { display: inline-flex; align-items: center; gap: 6px; flex-wrap: wrap; }
  .tl-sec .tl-lbl { font-size: 11px; color: var(--muted); max-width: 8em; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .tl-b { width: 28px; height: 28px; border-radius: 50%; border: 1.5px solid var(--line); background: #fff; color: var(--text);
    font: 600 12px/1 -apple-system, "Segoe UI", Roboto, sans-serif; cursor: pointer; padding: 0; flex: 0 0 auto; }
  .tl-b.st-seda { background: var(--st-seda); border-color: var(--st-seda); color: #fff; }
  .tl-b.st-zelena { background: var(--st-zelena); border-color: var(--st-zelena); color: #fff; }
  .tl-b.st-oranzova { background: var(--st-oranzova); border-color: var(--st-oranzova); color: #fff; }
  .tl-b.st-cervena { background: var(--st-cervena); border-color: var(--st-cervena); color: #fff; }
  .tl-b.st-hotovo { background: var(--st-hotovo); border-color: var(--st-hotovo); color: #fff; }
  .tl-b.cur { border: 2.5px solid var(--text); }
  .tl-b.sum-b { width: auto; border-radius: 14px; padding: 0 10px; border-color: var(--accent); color: var(--accent); }
  .tl-b.sum-b.cur { background: var(--accent); color: #fff; border-color: var(--text); }
  .tl-u { height: 28px; border-radius: 14px; padding: 0 10px; border: 1.5px solid var(--accent); background: #fff; color: var(--accent);
    font: inherit; font-size: 13px; cursor: pointer; margin-right: 6px; }   /* v30: úvod (záměrně bez .tl-b) */
  .tl-u.cur { background: var(--accent); color: #fff; border: 2.5px solid var(--text); }
  .tl-nav { flex: 0 0 auto; display: flex; gap: 6px; align-self: flex-end; }
  .tl-nav button { width: 34px; height: 30px; border-radius: 7px; border: 2px solid var(--accent); background: #fff; color: var(--accent);
    font: 700 18px/1 -apple-system, "Segoe UI", Roboto, sans-serif; cursor: pointer; padding: 0; }
  .tl-nav button:disabled { opacity: .35; cursor: default; }

  /* při tvorbě PDF skryj ovládací prvky */
  body.capturing .no-pdf { display: none !important; }
</style>
</head>
<body>
<div id="panel">
  <div class="panel-title"><span id="pTitle"></span> <span class="ver" id="pVer"></span><span class="timer" id="timer"></span></div>
  <div class="panel-actions">
    <div class="draw-tools" id="drawTools">
      <button class="swatch on" data-color="#1d1d1b" style="background:#1d1d1b" aria-label="černá"></button>
      <button class="swatch" data-color="#2b5cab" style="background:#2b5cab" aria-label="modrá"></button>
      <button class="swatch" data-color="#b3261e" style="background:#b3261e" aria-label="červená"></button>
      <button class="swatch" data-color="#1f8a3c" style="background:#1f8a3c" aria-label="zelená"></button>
      <button class="swatch" data-color="#e0529c" style="background:#e0529c" aria-label="růžová"></button>
      <span class="sep"></span>

}

    for (let i = 0; i <= QS.length; i++) {
      const el = i < QS.length ? QS[i]._page : $("summary");
      QS.forEach((q, k) => q._page.hidden = k !== i); $("summary").hidden = i !== QS.length;
      if (i < QS.length && QS[i]._sit) QS[i]._sit.prekresli();
      await nextFrame();
      const scale = Math.min(2, 3800 / el.offsetWidth);
      const c = await html2canvas(el, { scale, backgroundColor: "#ffffff", logging: false });
      const item = { c, w: W, h: c.height * W / c.width };
      if (i < QS.length) {
        const s = Paper.snapshot(QS[i], 1.2);
        if (s) { let w = s.w / PAPER_W * W, h = s.h / PAPER_W * W; if (h > PH - 2 * M) { w *= (PH - 2 * M) / h; h = PH - 2 * M; } item.paper = { url: s.url, w, h }; }
      }
      shots.push(item);
    }

    document.body.classList.remove("capturing");
    QS.forEach((q, k) => q._page.hidden = k !== back); $("summary").hidden = back !== QS.length;
    if ($("uvodPage")) $("uvodPage").hidden = back !== -1;
    stage.scrollTop = st;
  }
  // souhrn (poslední snímek) na začátek
  shots.unshift(shots.pop());
  let y = M;
  const put = (url, w, h, fmtImg) => {
    if (y + h > PH - M && y > M) { doc.addPage(); y = M; }
    doc.addImage(url, fmtImg, M, y, w, h); y += h + 3;
  };
  shots.forEach((s, i) => {
    let h = s.h, w = s.w; if (h > PH - 2 * M) { w *= (PH - 2 * M) / h; h = PH - 2 * M; }
    // zadání drž na stejné stránce s papírem, pokud se vejdou
    if (s.paper && y + h + s.paper.h + 3 > PH - M && y > M && h + s.paper.h + 3 <= PH - 2 * M) { doc.addPage(); y = M; }
    put(s.c.toDataURL("image/jpeg", 0.9), w, h, "JPEG");
    if (s.paper) put(s.paper.url, s.paper.w, s.paper.h, "JPEG");
    y += i === 0 ? 4 : 3;
  });
  const n = doc.getNumberOfPages();
  for (let i = 1; i <= n; i++) { doc.setPage(i); doc.setFontSize(9); doc.setTextColor(140); doc.text(`${i} / ${n}`, PW - M, PH - 5, { align: "right" }); }
  return new File([doc.output("blob")], pdfName(), { type: "application/pdf" });
}
function download(file) {
  const a = document.createElement("a"); a.href = URL.createObjectURL(file); a.download = file.name;
  document.body.appendChild(a); a.click(); a.remove();
  setTimeout(() => URL.revokeObjectURL(a.href), 10000);
}
async function share(f) {
  try { await navigator.share({ files: [f], title: f.name }); return true; }
  catch (e) {
    if (e.name === "AbortError") return true;
    if (e.name === "NotAllowedError") return false;
    download(f); return true;
  }
}
async function onPdf() {
  const b = $("btnPdf");
  if (b.dataset.busy) return;
  if (pdfFile) { await share(pdfFile); return; }
  b.dataset.busy = "1"; b.textContent = "PDF…";
  const startVersion = version;
  try {
    const f = await makePdf();
    delete b.dataset.busy;
    if (version !== startVersion) { pdfReset(); return; }
    Zaznam.zapis({ udalost: "pdf", detail: { soubor: f.name } });
    const canShare = navigator.canShare && navigator.canShare({ files: [f] });
    if (!canShare) { download(f); pdfReset(); return; }
    if (await share(f)) { pdfReset(); }
    else { pdfFile = f; b.textContent = "Uložit PDF"; b.classList.add("ready"); }
  } catch (e) {
    delete b.dataset.busy; pdfReset();
    alert("PDF se nepodařilo vytvořit: " + e.message);
  }
}
