<!doctype html>
<html lang="cs">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Test</title>
<!--
  ŠABLONA HTML TESTU – Ann School (system/Sablona_test_vXX.html)
  Nový test = kopie této šablony do složky předmětu: <předmět>/<tema>_test_vXX.html.
  Měň JEN blok „KONFIGURACE TESTU“ níže. Postup: system/Navod_test_vXX.md.
  Knihovny: ../system/lib/ (stránka musí ležet o jednu složku pod rootem):
  PDF (html2canvas, jsPDF), vektorová síť (vektory.js + vektory.css), záznam výsledků (zaznam.js).
  v16: jedna stránka na příklad (zadání → odpověď → papír), časová osa dole, 3 pokusy,
       záznam výsledků do Google tabulky, iPad na výšku i na šířku.
  Horní panel: nová systémová tlačítka přidávej do <div class="panel-actions">.
-->
<script src="../system/lib/html2canvas-1.4.1.min.js"></script>
<script src="../system/lib/jspdf-2.5.2.min.js"></script>
<link rel="stylesheet" href="../system/lib/vektory.css">
<script src="../system/lib/vektory.js"></script>
<script src="../system/lib/zaznam.js"></script>
<style>
  :root {
    --bg: #fafaf7; --paper: #ffffff; --text: #1d1d1b; --muted: #6b6b66; --line: #dcdcd5;
    --ok: #1f7a3a; --ok-bg: #e6f4ea; --bad: #b3261e; --bad-bg: #fbe9e7;
    --accent: #2b5cab; --panel-h: 48px; --tl-h: 56px;
    --st-zelena: #1f8a3c; --st-oranzova: #e08a00; --st-cervena: #b3261e; --st-seda: #a9a9a2; --st-hotovo: #2b5cab;
  }
  * { box-sizing: border-box; }
  html { -webkit-text-size-adjust: 100%; }
  html, body { height: 100%; overflow: hidden; }
  body { margin: 0; background: var(--bg); color: var(--text);
    font: 17px/1.4 -apple-system, "Segoe UI", Roboto, sans-serif; }

  /* ---------- horní panel ---------- */
  #panel { position: fixed; top: 0; left: 0; right: 0; z-index: 20;
    min-height: var(--panel-h); padding: 6px 12px; padding-top: calc(6px + env(safe-area-inset-top));
    background: rgba(255,255,255,.97); border-bottom: 1px solid var(--line);
    display: flex; align-items: center; gap: 12px; }
  .panel-title { flex: 1 1 auto; min-width: 0; font-size: 15px; font-weight: 600;
    white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .panel-title .ver { color: var(--muted); font-weight: 400; }
  .panel-title .timer { margin-left: 10px; color: var(--accent); }
  .panel-title .timer.over { color: var(--bad); }
  .panel-actions { flex: 0 0 auto; display: flex; align-items: center; gap: 6px; }
  .panel-actions .sep { width: 1px; height: 24px; background: var(--line); margin: 0 4px; }
  .panel-actions button { font: inherit; font-size: 14px; padding: 5px 10px; border-radius: 8px;
    border: 2px solid var(--accent); background: var(--paper); color: var(--accent); cursor: pointer; white-space: nowrap; }
  .panel-actions button.on { background: var(--accent); color: #fff; }
  .panel-actions button.ready { background: var(--ok); border-color: var(--ok); color: #fff; }
  .panel-actions .swatch { width: 26px; height: 26px; border-radius: 50%; padding: 0; border: 3px solid transparent; }
  .panel-actions .swatch.on { border-color: var(--text); background-clip: padding-box; }
  .panel-actions button.width { width: 34px; height: 30px; padding: 0 6px; display: inline-flex; align-items: center; }
  .panel-actions button.width i { display: block; width: 100%; background: currentColor; border-radius: 3px; }
  .draw-tools { display: flex; align-items: center; gap: 6px; }
  @media (max-width: 700px) {
    .panel-actions .swatch { width: 24px; height: 24px; }
    .panel-actions button { padding: 6px 8px; font-size: 14px; }
    .panel-actions button.width { width: 28px; }
  }

  /* ---------- plocha mezi panelem a časovou osou ---------- */
  #stage { position: fixed; left: 0; right: 0; top: var(--panel-h); bottom: var(--tl-h);
    overflow-y: auto; -webkit-overflow-scrolling: touch; padding: 10px 16px 12px; }
  .qpage { max-width: 1160px; margin: 0 auto; }
  .qpage[hidden] { display: none; }
  .q-head { display: flex; align-items: baseline; gap: 10px; flex-wrap: wrap; font-size: 13px; color: var(--muted); }
  .q-head .q-num { font-weight: 600; color: var(--text); font-size: 14px; }
  .q-head .q-state { margin-left: auto; font-weight: 600; }
  .q-head .q-state.st-zelena { color: var(--st-zelena); }
  .q-head .q-state.st-oranzova { color: var(--st-oranzova); }
  .q-head .q-state.st-cervena { color: var(--st-cervena); }
  .q-head .q-state.st-hotovo { color: var(--st-hotovo); }
  .intro { margin: 4px 0 0; font-size: 14px; color: var(--muted); }
  .q-text { font-size: 19px; margin-top: 6px; }
  .q-row { display: flex; align-items: center; flex-wrap: wrap; gap: 8px; font-size: 19px; margin-top: 8px; }
  input.ans { width: 8em; font-size: 19px; padding: 4px 8px; border: 2px solid var(--line);
    border-radius: 6px; background: var(--paper); color: var(--text); text-align: right; }
  input.ans:focus { outline: none; border-color: var(--accent); }
  input.ans:disabled { color: var(--text); -webkit-text-fill-color: var(--text); opacity: 1; }
  input.ans.f-ok { border-color: var(--ok); background: var(--ok-bg); }
  input.ans.f-bad { border-color: var(--bad); background: var(--bad-bg); }
  .q-row.multi input.ans { width: 4.6em; }
  /* šipka nad písmenem: {F} v textu konfigurace (CSS rámečky – html2canvas ji přenese do PDF) */
  .vec { position: relative; display: inline-block; font-family: Georgia, "Times New Roman", serif; font-style: italic; padding: 0 1px; }
  .vec::before { content: ""; position: absolute; left: 2px; right: 2px; top: 1px; border-top: 1.3px solid currentColor; }
  .vec::after { content: ""; position: absolute; right: 0; top: -1.6px; width: 0; height: 0;
    border-left: 5px solid currentColor; border-top: 3px solid transparent; border-bottom: 3px solid transparent; }
  sup { font-size: .72em; line-height: 0; }
  .per { text-decoration: overline; }
  /* výběr z možností */
  .opts { display: inline-flex; flex-wrap: wrap; gap: 8px; }
  .opts button { font: inherit; font-size: 17px; padding: 6px 14px; border-radius: 8px; border: 2px solid var(--line);
    background: var(--paper); color: var(--text); cursor: pointer; }
  .opts button.on { border-color: var(--accent); background: #e8eefa; font-weight: 600; }
  .opts button:disabled { cursor: default; }
  .opts.f-ok button.on { border-color: var(--ok); background: var(--ok-bg); }
  .opts.f-bad button.on { border-color: var(--bad); background: var(--bad-bg); }
  /* vektorová síť */
  .q-grid { max-width: 560px; margin-top: 6px; }
  .grid-tools { display: flex; flex-wrap: wrap; align-items: center; gap: 6px; margin-top: 6px; font-size: 14px; color: var(--muted); }
  .grid-tools button { font: inherit; font-size: 15px; padding: 3px 10px; border-radius: 8px; border: 2px solid var(--line);
    background: var(--paper); color: var(--text); cursor: pointer; }
  .grid-tools button.on { border-color: var(--accent); background: #e8eefa; font-weight: 600; }
  .grid-tools button:disabled { opacity: .5; cursor: default; }
  /* tlačítka příkladu */
  .q-actions { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; margin-top: 10px; }
  button.btn { font: inherit; font-size: 15px; padding: 6px 14px; border-radius: 8px;
    border: 2px solid var(--accent); background: var(--paper); color: var(--accent); cursor: pointer; }
  button.btn.primary { background: var(--accent); color: #fff; }
  button.btn:disabled { opacity: .4; cursor: default; }
  .q-actions .push { margin-left: auto; }
  .fb { font-size: 15px; margin-top: 6px; }
  .fb:empty { display: none; }
  .fb.ok { color: var(--ok); } .fb.bad { color: var(--bad); }
  .hint { font-size: 15px; color: var(--muted); margin-top: 6px; padding: 4px 10px; border-left: 3px solid var(--line); }
  .hint[hidden], .reseni[hidden] { display: none; }
  .reseni { margin-top: 6px; padding: 6px 10px; border-left: 3px solid var(--accent); background: #f2f5fb; font-size: 15px; line-height: 1.5; }
  .reseni b { color: var(--accent); }

  /* ---------- papír (jeden, sdílený; tahy má každý příklad vlastní) ---------- */
  #paperBox { max-width: 1160px; margin: 10px auto 0; border: 1px solid var(--line); border-radius: 8px; background: var(--paper); overflow: hidden; }
  #paperBox[hidden] { display: none; }
  .paper-bar { display: flex; align-items: center; gap: 6px; padding: 4px 6px 4px 10px; border-bottom: 1px solid #ecece6; font-size: 12px; color: #9a9a93; }
  .paper-bar span { flex: 1 1 auto; }
  .paper-bar button { font-size: 12px; padding: 3px 8px; border-radius: 6px; border: 1px solid var(--line); background: #fff; color: var(--text); cursor: pointer; }
  #paperView { overflow: auto; -webkit-overflow-scrolling: touch; overscroll-behavior: contain; height: 300px; }
  #paperView.finger { touch-action: none; }
  #paper { display: block; background-color: #fff;
    background-image: linear-gradient(#edf1f6 1px, transparent 1px), linear-gradient(90deg, #edf1f6 1px, transparent 1px);
    background-size: 24px 24px; }

  /* ---------- souhrn ---------- */
  .sum h1 { font-size: 22px; margin: 4px 0 2px; }
  .sum .meta { color: var(--muted); font-size: 13px; }
  .sum .big { font-size: 26px; font-weight: 700; margin: 10px 0 2px; }
  .sum table { border-collapse: collapse; margin-top: 10px; font-size: 15px; }
  .sum td, .sum th { padding: 4px 10px; border-bottom: 1px solid #ecece6; text-align: left; }
  .sum .legend { display: flex; gap: 14px; flex-wrap: wrap; font-size: 13px; color: var(--muted); margin-top: 12px; }
  .sum .legend i { display: inline-block; width: 12px; height: 12px; border-radius: 50%; vertical-align: -1px; margin-right: 4px; border: 1px solid #0002; }
  .sum .send { font-size: 13px; color: var(--muted); margin-top: 14px; }
  .note { font-size: 13px; color: var(--muted); margin-top: 12px; }

  /* ---------- časová osa ---------- */
  #timeline { position: fixed; left: 0; right: 0; bottom: 0; z-index: 20; background: rgba(255,255,255,.97);
    border-top: 1px solid var(--line); padding: 6px 10px; padding-bottom: calc(6px + env(safe-area-inset-bottom));
    display: flex; flex-wrap: wrap; align-items: center; gap: 4px 12px; }
  .tl-sec { display: inline-flex; align-items: center; gap: 4px; flex-wrap: wrap; }
  .tl-sec .tl-lbl { font-size: 11px; color: var(--muted); max-width: 9em; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; margin-right: 2px; }
  .tl-b { width: 34px; height: 34px; border-radius: 50%; border: 2px solid var(--line); background: #fff; color: var(--text);
    font: 600 13px/1 -apple-system, "Segoe UI", Roboto, sans-serif; cursor: pointer; padding: 0; }
  .tl-b.st-seda { background: var(--st-seda); border-color: var(--st-seda); color: #fff; }
  .tl-b.st-zelena { background: var(--st-zelena); border-color: var(--st-zelena); color: #fff; }
  .tl-b.st-oranzova { background: var(--st-oranzova); border-color: var(--st-oranzova); color: #fff; }
  .tl-b.st-cervena { background: var(--st-cervena); border-color: var(--st-cervena); color: #fff; }
  .tl-b.st-hotovo { background: var(--st-hotovo); border-color: var(--st-hotovo); color: #fff; }
  .tl-b.cur { box-shadow: 0 0 0 3px #fff, 0 0 0 5px var(--text); }
  .tl-b.sum-b { width: auto; border-radius: 17px; padding: 0 12px; border-color: var(--accent); color: var(--accent); }
  .tl-b.sum-b.cur { background: var(--accent); color: #fff; }

  /* při tvorbě PDF skryj ovládací prvky */
  body.capturing .no-pdf { display: none !important; }
</style>
</head>
<body>
<div id="panel">
  <div class="panel-title"><span id="pTitle"></span> <span class="ver" id="pVer"></span><span class="timer" id="timer"></span></div>
  <div class="panel-actions">
    <div class="draw-tools" id="drawTools">
      <button class="swatch on" data-color="#1d1d1b" style="background:#1d1d1b" aria-label="černá"></button>
      <button class="swatch" data-color="#2b5cab" style="background:#2b5cab" aria-label="modrá"></button>
      <button class="swatch" data-color="#b3261e" style="background:#b3261e" aria-label="červená"></button>
      <button class="swatch" data-color="#1f8a3c" style="background:#1f8a3c" aria-label="zelená"></button>
      <button class="swatch" data-color="#e0529c" style="background:#e0529c" aria-label="růžová"></button>
      <span class="sep"></span>
      <button class="width on" data-w="1.1" aria-label="tenké pero"><i style="height:1.5px"></i></button>
      <button class="width" data-w="2" aria-label="střední pero"><i style="height:3px"></i></button>
      <button class="width" data-w="3.4" aria-label="silné pero"><i style="height:5px"></i></button>
      <span class="sep"></span>
      <button id="toolPen" class="on">Pero</button>
      <button id="toolFinger" title="Kreslit i prstem">Prst</button>
      <button id="toolEraser">Guma</button>
      <span class="sep"></span>
    </div>
    <!-- systémová tlačítka – další přidávej sem -->
    <button id="btnNew" hidden>Nová sada</button>
    <button id="btnPdf">PDF</button>
  </div>
</div>

<div id="stage">
  <div id="pages"></div>
  <div id="paperBox" class="no-pdf">
    <div class="paper-bar"><span>Místo na výpočty – Pencil píše, prst posouvá papír</span>
      <button type="button" id="pUndo">Zpět</button><button type="button" id="pClear">Smazat</button><button type="button" id="pHome">↖ Na začátek</button></div>
    <div id="paperView"><canvas id="paper"></canvas></div>
  </div>
</div>

<nav id="timeline" class="no-pdf"></nav>

<script>
/* =====================================================================
   KONFIGURACE TESTU – měň jen tuto část
   ---------------------------------------------------------------------
   title, version     … název a verze (zobrazí se v panelu a v PDF)
   intro              … pokyny (zobrazí se u 1. příkladu a v souhrnu)
   topic              … téma pro název PDF (bez diakritiky, pomlčky)
   timeLimitMin       … časový limit v minutách (0 = bez limitu)
   showHints          … u příkladů tlačítko „Nápověda“ (otevření se zaznamená)
   finalScratch, sideScratch, scratch … od v16 bez účinku (papír má každý příklad),
                        zůstávají kvůli převodu starších testů
   questions          … pevná sada; { section: "…" } začíná novou sekci (skupina na časové ose)
   generate           … funkce vracející novou náhodnou sadu (nebo null);
                        pokud je zadaná, použije se místo questions
                        a v panelu se zobrazí tlačítko „Nová sada“

   PRŮBĚH (v16): každý příklad má vlastní stránku a „Vyhodnotit“. Nejvýš 3 pokusy;
   po špatném pokusu se správný výsledek neukáže, po 3. špatném ano a příklad se zamkne.
   Barvy na časové ose: bílá = neotevřeno, šedá = otevřeno/nedokončeno, zelená = napoprvé,
   oranžová = napodruhé, červená = napotřetí nebo vůbec; modrá = důkaz (řešení zobrazeno).
   Body: zelená 1, oranžová ½, červená 0.

   TYPY PŘÍKLADŮ (type; všechny části příkladu musí být správně)
   V textech {F} = písmeno se šipkou nad ním (vektor), a^(2/3) = exponent nahoře,
   0,‾(56) = perioda s čarou nahoře. Podrobně: Navod_test_vXX.md.
   - číslo (bez type):
       { before: "5 m =", after: "mm", answer: 5000,
         tol: 0,           … povolená odchylka (např. 0.05 u zaokrouhlení)
         hint: "…",        … nápověda; po 3. špatném pokusu se ukáže jako vysvětlení
         text: "…" }       … (nepovinné) zadání nad řádkem s polem
   - "vyber": { type: "vyber", text, options: ["…", "…", "…", "…", "…"], answer: 2 }   (answer = index;
                 aspoň 5 možností, kromě otázek, kde smysluplně existují jen 2)
   - "pole":  { type: "pole", text, fields: [ { before: "Δx =", answer: 5 },
                 { before: "Δy =", answer: -2, after: "(záporné = dolů)" },
                 { options: ["doprava", "doleva"], answer: 0 } ] }   … víc polí v jednom příkladu
   - "rysuj": { type: "rysuj", text, sit, dane, nazev: "v", answer: { dx: 4, dy: -4 } }
   - "retez": { type: "retez", text, sit, dane, retez: [ { nazev: "A", dx: 4, dy: 0 }, … ], vysledna: "R" }
   - "dukaz": { type: "dukaz", text, hint, reseni: ["řádek 1", "řádek 2", …] }
                 … píše se na papír; NEBODUJE SE, „Vyhodnotit“ ukáže vzorové řešení
   Síť u kteréhokoli typu: sit: { xmin: -7, xmax: 7, ymin: -6, ymax: 6 } (výchozí, osy bez čísel),
   dane: [ { nazev: "F", x1, y1, x2, y2 } ] … zadané vektory (nejdou chytit).
   ===================================================================== */
const TEST = {
  title: "Číselné obory – test 3",
  version: "v02",
  intro: "Doplň číslo do pole, nebo klepni na správnou možnost. Vpravo od příkladů si můžeš psát. Desetinná čárka i tečka jsou v pořádku, mezery v čísle nevadí, záporné číslo piš s mínusem.",
  topic: "ciselne-obory",
  timeLimitMin: 0,
  showHints: true,
  finalScratch: true,
  sideScratch: true,
  questions: [
    {"section": "Základní tvar zlomku"},
    {"type": "pole", "text": "105/140 =", "fields": [{"answer": 3}, {"before": "/", "answer": 4}], "hint": "D(105, 140) = 35 → 3/4"},
    {"type": "pole", "text": "64/112 =", "fields": [{"answer": 4}, {"before": "/", "answer": 7}], "hint": "D(64, 112) = 16 → 4/7"},
    {"type": "pole", "text": "132/154 =", "fields": [{"answer": 6}, {"before": "/", "answer": 7}], "hint": "D(132, 154) = 22 → 6/7"},
    {"type": "pole", "text": "91/117 =", "fields": [{"answer": 7}, {"before": "/", "answer": 9}], "hint": "91 = 7 · 13, 117 = 9 · 13 → 7/9"},
    {"section": "Porovnávání"},
    {"type": "vyber", "text": "3/7  ?  4/9", "options": ["<", "=", ">"], "answer": 0, "hint": "Do kříže: 3 · 9 = 27, 7 · 4 = 28 → 3/7 < 4/9"},
    {"type": "vyber", "text": "−1/3  ?  −0,3", "options": ["<", "=", ">"], "answer": 0, "hint": "1/3 = 0,333… > 0,3 → u záporných naopak: −1/3 < −0,3"},
    {"type": "vyber", "text": "5/6  ?  0,8‾(3)", "options": ["<", "=", ">"], "answer": 1, "hint": "5 : 6 = 0,8333… = 0,8‾(3) → rovnají se"},
    {"type": "vyber", "text": "1,3‾(6)  ?  1,36", "options": ["<", "=", ">"], "answer": 2, "hint": "1,3666… > 1,36"},
    {"section": "Počítání se zlomky"},
    {"type": "pole", "text": "7/12 + 5/18 =", "fields": [{"answer": 31}, {"before": "/", "answer": 36}], "hint": "n(12, 18) = 36: 21/36 + 10/36 = 31/36"},
    {"type": "pole", "text": "2 − 3/5 · 5/9 =", "fields": [{"answer": 5}, {"before": "/", "answer": 3}], "hint": "Nejdřív násobení: 3/5 · 5/9 = 1/3; 2 − 1/3 = 5/3"},
    {"type": "pole", "text": "(3/4 − 1/6) · 6/7 =", "fields": [{"answer": 1}, {"before": "/", "answer": 2}], "hint": "Závorka: 9/12 − 2/12 = 7/12; 7/12 · 6/7 = 6/12 = 1/2"},
    {"type": "pole", "text": "5/6 − (0,7 · 0,16) : 0,24 =", "fields": [{"answer": 11}, {"before": "/", "answer": 30}], "hint": "0,7 · 0,16 = 0,112; 0,112 : 0,24 = 112/240 = 7/15; 5/6 − 7/15 = 25/30 − 14/30 = 11/30"},
    {"section": "Desetinná a periodická čísla"},
    {"before": "3/40 =", "answer": 0.075, "hint": "3/40 = 75/1000 = 0,075"},
    {"type": "pole", "text": "1,36 =", "fields": [{"answer": 34}, {"before": "/", "answer": 25}], "hint": "136/100, krátím 4 → 34/25"},
    {"type": "pole", "text": "0,‾(68) =", "fields": [{"answer": 68}, {"before": "/", "answer": 99}], "hint": "Perioda dvou číslic → 68/99"},
    {"type": "pole", "text": "1,‾(2) =", "fields": [{"answer": 11}, {"before": "/", "answer": 9}], "hint": "0,‾(2) = 2/9 → 1 + 2/9 = 11/9"},
    {"section": "Smíšená čísla"},
    {"type": "pole", "text": "17/5 =", "fields": [{"answer": 3, "after": "celých"}, {"answer": 2}, {"before": "/", "answer": 5}], "hint": "17 : 5 = 3 zbytek 2 → 3 2/5"},
    {"type": "pole", "text": "−14/3 = −", "fields": [{"answer": 4, "after": "celých"}, {"answer": 2}, {"before": "/", "answer": 3}], "hint": "14 : 3 = 4 zbytek 2 → −4 2/3"},
    {"type": "pole", "text": "Zapiš jako zlomek: 3 5/6 =", "fields": [{"answer": 23}, {"before": "/", "answer": 6}], "hint": "3 · 6 + 5 = 23 → 23/6"},

    q._st = { pokusy: 0, hotovo: false, spravne: false, navstiveno: false, cas: 0, napoveda: false, odchody: 0, odchodCas: 0, papirOdeslan: -1 };
    q._strokes = []; q._locked = false; q._lockedPaper = false; q._paperVer = 0;
    sec.qs.push(q); QS.push(q);
  });
  QS.forEach(q => {
    const p = document.createElement("div"); p.className = "qpage"; p.hidden = true;

    if (q.text) { const t = document.createElement("div"); t.className = "q-text"; t.innerHTML = rich(q.text); p.appendChild(t); }
    const hasGrid = q.sit || q.dane || q._typ === "rysuj" || q._typ === "retez";
    if (hasGrid) makeGrid(q, p);

      q._fields.forEach(f => makeField(f, row, q));

      `<span class="push"></span><button class="btn" data-a="prev">← Předchozí</button><button class="btn" data-a="next">Další →</button>`;
    act.querySelector('[data-a="eval"]').onclick = () => evaluateQ(q);

  const s = document.createElement("div"); s.className = "qpage sum"; s.hidden = true; s.id = "summary";
  box.appendChild(s);

  relace = Zaznam.noveId(8);
  Zaznam.nastavKontext({ relace, test: location.pathname.replace(/^.*\/annschool\//, "").replace(/^\//, ""), nazev: TEST.title, verze: TEST.version });
  Zaznam.zapis({ udalost: "start", detail: { pocet: QS.length, sekce: SECTIONS.map(x => x.name), orientace: orient(),
    sirka: innerWidth, vyska: innerHeight, nahodna: typeof TEST.generate === "function" } });

function orient() { return innerWidth > innerHeight ? "na šířku" : "na výšku"; }

/* ---------- měření času na příkladu ---------- */
let aktivniOd = 0;
function casStop() { if (aktivniOd && QS[cur]) QS[cur]._st.cas += Date.now() - aktivniOd; aktivniOd = 0; }
function casStart() { aktivniOd = (document.visibilityState === "visible" && QS[cur]) ? Date.now() : 0; }
function casQ(q) { return q._st.cas + (QS[cur] === q && aktivniOd ? Date.now() - aktivniOd : 0); }

/* ---------- přechod mezi příklady ---------- */
function show(i) {
  i = Math.max(0, Math.min(QS.length, i));
  casStop();
  if (QS[cur]) Paper.detach();
  if (document.activeElement && document.activeElement.blur) document.activeElement.blur();
  cur = i;
  QS.forEach((q, k) => q._page.hidden = k !== i);
  $("summary").hidden = i !== QS.length;
  $("paperBox").hidden = i === QS.length;
  if (i < QS.length) {
    const q = QS[i];
    q._st.navstiveno = true;
    Paper.attach(q);
    if (q._sit) requestAnimationFrame(() => q._sit.prekresli());

    renderSummary();

}
// výška papíru = zbytek obrazovky (aspoň 260 px); když je zadání vysoké (síť), posouvá se celá plocha
function fitLayout() {
  const panel = $("panel"), tl = $("timeline"), stage = $("stage");
  document.documentElement.style.setProperty("--panel-h", panel.offsetHeight + "px");
  document.documentElement.style.setProperty("--tl-h", tl.offsetHeight + "px");
  if (cur < 0 || cur >= QS.length) return;
  const page = QS[cur]._page, cs = getComputedStyle(stage);
  const free = stage.clientHeight - parseFloat(cs.paddingTop) - parseFloat(cs.paddingBottom) - page.offsetHeight - 10 - 26 - 2;
  $("paperView").style.height = Math.max(260, Math.floor(free)) + "px";
}

/* ---------- vyhodnocení příkladu ---------- */
function toggleHint(q) {
  q._hint.hidden = !q._hint.hidden;
  if (!q._hint.hidden && !q._st.napoveda) {
    q._st.napoveda = true;
    Zaznam.zapis({ udalost: "napoveda", priklad: q._n, sekce: plain(q._sec.name), typ: q._typ, zadani: zadaniText(q),
      pokus: q._st.pokusy, doba_s: Math.round(casQ(q) / 1000) });

}
function zadaniText(q) {

  return plain([q.text, f].filter(Boolean).join(" | "));
}
function papirProZaznam(q) {
  if ((q._paperVer || 0) === q._st.papirOdeslan) return "";
  q._st.papirOdeslan = q._paperVer || 0;
  const s = Paper.snapshot(q, 0.6);
  return s ? s.url : "";
}
function evaluateQ(q) {

  if (q._typ === "dukaz") {
    q._res.hidden = false; q._st.hotovo = true; q._st.pokusy = 1; q._evalBtn.disabled = true;
    Zaznam.zapis({ udalost: "reseni", priklad: q._n, sekce: plain(q._sec.name), typ: q._typ, zadani: zadaniText(q),
      pokus: 1, doba_s: Math.round(casQ(q) / 1000), napoveda: q._st.napoveda, odchody: q._st.odchody, papir: papirProZaznam(q) });
    updateTimeline(); pdfReset(); return;
  }
  const grid = q._typ === "rysuj" || q._typ === "retez";
  const prazdne = q._fields.every(fieldEmpty) && (!grid || !annIds(q).some(id => q._sit.vektor(id)));
  if (prazdne) { q._fb.className = "fb bad"; q._fb.textContent = "Nejdřív doplň odpověď."; fitLayout(); return; }
  q._st.pokusy++;
  let good = true;
  q._fields.forEach(f => { const g = fieldOk(f); f._el.classList.toggle("f-ok", g); f._el.classList.toggle("f-bad", !g); if (!g) good = false; });
  let kresba = null;
  if (grid) { q._sit.pomocne = []; kresba = checkDrawing(q); if (!kresba.ok) good = false; }
  const konec = good || q._st.pokusy >= MAX_POKUSU;
  const odpoved = [q._fields.map(fieldValue).join(" · "), kresbaText(q)].filter(Boolean).join(" | ");
  const spravna = [q._fields.map(fieldText).join(" · "), kresbaSpravne(q)].filter(Boolean).join(" | ");
  if (konec) {
    q._st.hotovo = true; q._st.spravne = good;
    q._locked = true; q._evalBtn.disabled = true;
    q._fields.forEach(f => { if (f.options) f._el.querySelectorAll("button").forEach(b => b.disabled = true); else f._el.disabled = true; });
    if (grid) lockGrid(q, true);
    if (good) {
      q._fb.className = "fb ok";
      q._fb.textContent = q._st.pokusy === 1 ? "Správně!" : `Správně (napo${q._st.pokusy === 2 ? "druhé" : "třetí"}).`;
    } else {
      const casti = [];
      if (kresba && !kresba.ok) casti.push(kresba.msg);
      if (q._fields.some(f => !fieldOk(f))) casti.push("Správně je " + rich(q._fields.map(fieldText).join(", ")) + ".");
      q._fb.className = "fb bad";
      q._fb.innerHTML = "Ani napotřetí to nevyšlo. " + casti.join(" ") + (q.hint ? " – " + rich(q.hint) : "");
    }
  } else {
    if (grid) { q._sit.pomocne = []; q._sit.prekresli(); }   // správné řešení se zatím neukazuje
    const zbyva = MAX_POKUSU - q._st.pokusy;
    q._fb.className = "fb bad";
    q._fb.textContent = `Špatně – zkus to znovu (${zbyva === 1 ? "zbývá poslední pokus" : "zbývají " + zbyva + " pokusy"}).`;
  }
  Zaznam.zapis({ udalost: "vyhodnoceni", priklad: q._n, sekce: plain(q._sec.name), typ: q._typ, zadani: zadaniText(q),
    pokus: q._st.pokusy, vysledek: good ? "spravne" : "spatne", konecny: konec, odpoved: plain(odpoved), spravna: plain(spravna),
    doba_s: Math.round(casQ(q) / 1000), napoveda: q._st.napoveda, odchody: q._st.odchody, odchody_s: Math.round(q._st.odchodCas / 1000),
    papir: papirProZaznam(q) });

}

/* ---------- souhrn ---------- */
function renderSummary() {

  const pocty = {}; QS.forEach(q => { const t = stav(q); pocty[t] = (pocty[t] || 0) + 1; });

  if (TEST.intro) h += `<p class="intro no-pdf">${rich(TEST.intro)}</p>`;
  h += sk.max ? `<div class="big">${fmt(sk.b)} / ${sk.max} bodů (${pct} %)</div>` : "";
  h += `<table><tr><th>Sekce</th><th>Body</th><th>Příklady</th></tr>`;
  SECTIONS.forEach(sec => {
    let b = 0, m = 0;
    sec.qs.forEach(q => { if (q._typ !== "dukaz") { m++; b += BODY[stav(q)] || 0; } });
    const kol = sec.qs.map(q => `<span title="${STAV_TEXT[stav(q)]}" style="display:inline-block;width:20px;height:20px;line-height:20px;border-radius:50%;text-align:center;font-size:11px;margin-right:3px;color:${["nove"].includes(stav(q)) ? "#1d1d1b" : "#fff"};background:${barva(stav(q))};border:1px solid #0002">${q._n}</span>`).join("");
    h += `<tr><td>${rich(sec.name)}</td><td>${m ? fmt(b) + " / " + m : "–"}</td><td>${kol}</td></tr>`;
  });
  h += `</table><div class="legend">` + ["zelena", "oranzova", "cervena", "seda", "nove", "hotovo"].filter(t => pocty[t] || ["zelena", "oranzova", "cervena"].includes(t))
    .map(t => `<span><i style="background:${barva(t)}"></i>${STAV_TEXT[t]}: ${pocty[t] || 0}</span>`).join("") + `</div>`;
  h += `<div class="send no-pdf" id="sendState"></div>`;
  h += `<div class="send no-pdf">Zařízení ${Zaznam.zarizeni}${Zaznam.prezdivka ? " · " + Zaznam.prezdivka : ""}</div>`;
  h += `<p class="note no-pdf">Hotovo? Ulož si PDF tlačítkem nahoře. Na příklady se můžeš vrátit přes čísla dole.</p>`;

}
function barva(t) { return ({ zelena: "#1f8a3c", oranzova: "#e08a00", cervena: "#b3261e", seda: "#a9a9a2", hotovo: "#2b5cab", nove: "#ffffff" })[t]; }
let stavOdeslani = ["", 0];
function zobrazStavOdeslani() {

  const [st, n] = stavOdeslani;
  el.textContent = st === "vypnuto" ? "Výsledky se neodesílají (není nastavená adresa)." :
    st === "odesláno" ? "Výsledky jsou odeslané." : `Výsledky se odesílají… (čeká ${n})` + (st.includes("offline") ? " – zkusím znovu, až bude internet." : "");
}
function zapisSouhrn(udalost) {

  const posl = zapisSouhrn.posledni = zapisSouhrn.posledni || {};
  if (podpis === posl[udalost]) return;                  // beze změny se znovu neposílá
  posl[udalost] = podpis;
  Zaznam.zapis({ udalost, detail: { body: sk.b, max: sk.max, celkem_s: Math.round(QS.reduce((a, q) => a + casQ(q), 0) / 1000),
    priklady: QS.map(q => ({ n: q._n, sekce: plain(q._sec.name), typ: q._typ, zadani: zadaniText(q), stav: stav(q), pokusy: q._st.pokusy,
      doba_s: Math.round(casQ(q) / 1000), napoveda: q._st.napoveda, odchody: q._st.odchody, odchody_s: Math.round(q._st.odchodCas / 1000) })) } });
}

/* ---------- odchody z testu (jiná aplikace, jiný panel, zamčení) ---------- */
let odchodOd = 0, odchodQ = null;
document.addEventListener("visibilitychange", () => {
  if (document.visibilityState === "hidden") {
    casStop(); odchodOd = Date.now(); odchodQ = cur;
    zapisSouhrn("stav");
  } else if (odchodOd) {
    const d = Date.now() - odchodOd, q = QS[odchodQ];
    if (q) { q._st.odchody++; q._st.odchodCas += d; }
    Zaznam.zapis({ udalost: "odchod", priklad: q ? q._n : 0, sekce: q ? plain(q._sec.name) : "souhrn", doba_s: Math.round(d / 1000) });
    odchodOd = 0; casStart();

/* ---------- časovač ---------- */
function startTimer() {
  if (!TEST.timeLimitMin) return;
  const end = Date.now() + TEST.timeLimitMin * 60000, el = $("timer");
  const tick = () => {
    const s = Math.max(0, Math.round((end - Date.now()) / 1000));
    el.textContent = s ? `⏱ ${Math.floor(s / 60)}:${String(s % 60).padStart(2, "0")}` : "Čas vypršel";
    el.classList.toggle("over", !s);
    if (s) setTimeout(tick, 1000);
  };
  tick();
}

/* ---------- PDF: souhrn + každý příklad (zadání, odpověď, výsledek) + jeho papír ---------- */
let pdfFile = null, version = 0;
function changed() { version++; pdfReset(); }
function pdfReset() {
  pdfFile = null; const b = $("btnPdf");
  if (b.dataset.busy) return;
  b.textContent = "PDF"; b.classList.remove("ready");
}
function pdfName() {
  const d = new Date(), p = x => String(x).padStart(2, "0");
  const date = `${d.getFullYear()}-${p(d.getMonth() + 1)}-${p(d.getDate())}`;
  const base = ["Test", TEST.topic || "test", TEST.version, date].filter(Boolean).join("_");
  let n = 1;
  try { n = (parseInt(localStorage.getItem("pdfcount:" + base), 10) || 0) + 1; localStorage.setItem("pdfcount:" + base, n); }
  catch (e) { n = (pdfName.n = (pdfName.n || 0) + 1); }
  return `${base}_${p(n)}.pdf`;
}
const nextFrame = () => new Promise(r => requestAnimationFrame(() => requestAnimationFrame(r)));
async function makePdf() {
  const { jsPDF } = window.jspdf;
  const doc = new jsPDF({ unit: "mm", format: "a4" });
  const PW = 210, PH = 297, M = 12, W = PW - 2 * M;
  const back = cur, stage = $("stage"), st = stage.scrollTop;
  const shots = [];
  document.body.classList.add("capturing");
  try {
    renderSummary();
    for (let i = 0; i <= QS.length; i++) {
      const el = i < QS.length ? QS[i]._page : $("summary");
      QS.forEach((q, k) => q._page.hidden = k !== i); $("summary").hidden = i !== QS.length;
      if (i < QS.length && QS[i]._sit) QS[i]._sit.prekresli();
      await nextFrame();
      const scale = Math.min(2, 3800 / el.offsetWidth);
      const c = await html2canvas(el, { scale, backgroundColor: "#ffffff", logging: false });
      const item = { c, w: W, h: c.height * W / c.width };
      if (i < QS.length) {
        const s = Paper.snapshot(QS[i], 1.2);
        if (s) { let w = s.w / PAPER_W * W, h = s.h / PAPER_W * W; if (h > PH - 2 * M) { w *= (PH - 2 * M) / h; h = PH - 2 * M; } item.paper = { url: s.url, w, h }; }
      }
      shots.push(item);
    }
  } finally {
    document.body.classList.remove("capturing");
    QS.forEach((q, k) => q._page.hidden = k !== back); $("summary").hidden = back !== QS.length;
    stage.scrollTop = st;
  }
  // souhrn (poslední snímek) na začátek
  shots.unshift(shots.pop());
  let y = M;
  const put = (url, w, h, fmtImg) => {
    if (y + h > PH - M && y > M) { doc.addPage(); y = M; }
    doc.addImage(url, fmtImg, M, y, w, h); y += h + 3;
  };
  shots.forEach((s, i) => {
    let h = s.h, w = s.w; if (h > PH - 2 * M) { w *= (PH - 2 * M) / h; h = PH - 2 * M; }
    // zadání drž na stejné stránce s papírem, pokud se vejdou
    if (s.paper && y + h + s.paper.h + 3 > PH - M && y > M && h + s.paper.h + 3 <= PH - 2 * M) { doc.addPage(); y = M; }
    put(s.c.toDataURL("image/jpeg", 0.9), w, h, "JPEG");
    if (s.paper) put(s.paper.url, s.paper.w, s.paper.h, "JPEG");
    y += i === 0 ? 4 : 3;
  });
  const n = doc.getNumberOfPages();
  for (let i = 1; i <= n; i++) { doc.setPage(i); doc.setFontSize(9); doc.setTextColor(140); doc.text(`${i} / ${n}`, PW - M, PH - 5, { align: "right" }); }
  return new File([doc.output("blob")], pdfName(), { type: "application/pdf" });
}
function download(file) {
  const a = document.createElement("a"); a.href = URL.createObjectURL(file); a.download = file.name;
  document.body.appendChild(a); a.click(); a.remove();
  setTimeout(() => URL.revokeObjectURL(a.href), 10000);
}
async function share(f) {
  try { await navigator.share({ files: [f], title: f.name }); return true; }
  catch (e) {
    if (e.name === "AbortError") return true;
    if (e.name === "NotAllowedError") return false;
    download(f); return true;
  }
}
async function onPdf() {
  const b = $("btnPdf");
  if (b.dataset.busy) return;
  if (pdfFile) { await share(pdfFile); return; }
  b.dataset.busy = "1"; b.textContent = "PDF…";
  const startVersion = version;
  try {
    const f = await makePdf();
    delete b.dataset.busy;
    if (version !== startVersion) { pdfReset(); return; }
    Zaznam.zapis({ udalost: "pdf", detail: { soubor: f.name } });
    const canShare = navigator.canShare && navigator.canShare({ files: [f] });
    if (!canShare) { download(f); pdfReset(); return; }
    if (await share(f)) { pdfReset(); }
    else { pdfFile = f; b.textContent = "Uložit PDF"; b.classList.add("ready"); }
  } catch (e) {
    delete b.dataset.busy; pdfReset();
    alert("PDF se nepodařilo vytvořit: " + e.message);
  }
}

/* ---------- start ---------- */
document.title = `${TEST.title} (${TEST.version})`;
$("pTitle").textContent = TEST.title;
$("pVer").textContent = TEST.version ? "· " + TEST.version : "";
if (typeof TEST.generate === "function") {
  $("btnNew").hidden = false;
  $("btnNew").onclick = () => {
    if (!confirm("Vytvořit novou sadu příkladů? Odpovědi i kresby se smažou.")) return;
    casStop(); zapisSouhrn("souhrn"); build();
  };
}
$("btnPdf").onclick = onPdf;
document.querySelectorAll(".panel-actions .swatch").forEach(b => b.onclick = () => {
  document.querySelectorAll(".panel-actions .swatch").forEach(x => x.classList.remove("on"));
  b.classList.add("on"); draw.color = b.dataset.color; setEraser(false);
});
function setEraser(on) { draw.eraser = on; $("toolEraser").classList.toggle("on", on); $("toolPen").classList.toggle("on", !on); }
$("toolPen").onclick = () => setEraser(false);
document.querySelectorAll(".panel-actions .width").forEach(b => b.onclick = () => {
  document.querySelectorAll(".panel-actions .width").forEach(x => x.classList.remove("on"));
  b.classList.add("on"); draw.width = parseFloat(b.dataset.w); setEraser(false);
});
$("toolEraser").onclick = () => setEraser(true);
$("toolFinger").onclick = () => {
  draw.finger = !draw.finger; $("toolFinger").classList.toggle("on", draw.finger);
  $("paperView").classList.toggle("finger", draw.finger);
  if (window.Vektory) Vektory.nastavPrst(draw.finger);
};
let rT;
window.addEventListener("resize", () => { clearTimeout(rT); rT = setTimeout(fitLayout, 120); });
if (window.ResizeObserver) { new ResizeObserver(() => fitLayout()).observe($("timeline")); new ResizeObserver(() => fitLayout()).observe($("panel"));
  new ResizeObserver(() => fitLayout()).observe($("pages")); }
Zaznam.naStav((st, n) => { stavOdeslani = [st, n]; zobrazStavOdeslani(); });
window.addEventListener("pagehide", () => { casStop(); zapisSouhrn("stav"); });
Paper.init();
build();
startTimer();
</script>
