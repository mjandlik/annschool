<!--
  PŘEHLED VÝSLEDKŮ – Ann School (vysledky.html, stálá adresa, proto bez _vXX; historie je v gitu)
  Načte data z webové aplikace Google Apps Script (adresa v system/lib/zaznam.js, ENDPOINT).
  Nové testy se přidávají samy – stačí, že pošlou první výsledek. Návod: system/Navod_test_vXX.md, kap. 9.
  „Období“ načte jen události od zvoleného data (parametr od=YYYY-MM-DD), aby se přehled časem nezpomaloval.
  Zadání a správné odpovědi všech příkladů (i neodeslaných): ze startu testu (šablona v21+), jinak z konfigurace
  souboru testu v repozitáři (aktuální cesta, pak archiv/). „papír teď“ u příkladu: poslední stav papíru
  (náhled každých 20 s u šablony v21+, jinak papír z posledního vyhodnocení), tlačítko „obnovit“ načte znovu.
  Poloha v testu: šablona v23+ posílá „pozice“ (skript v04, list Stav) – přehled ukáže „● teď: příklad N“ s časem
  a dokud nějaký test běží, každých 20 s se sám zeptá na stav (akce=stav). U starších testů jen přibližně
  podle poslední události. U pokusů po otevření nápovědy: za jak dlouho (čas na příkladu) po nápovědě odpověděla.
  Reset (šablona v31, „Začít znovu“ / „Nová sada“): událost „reset“ uzavře relaci se stavem v okamžiku resetu –
  v seznamu i v detailu šedý štítek „resetováno“ (místo polohy), body a kolečka podle stavu při resetu.
  „📋 Pro Clauda“ (04.11.2026) u každého pokusu a u „papír teď“: složí jeden obrázek PNG – nahoře zadání, správná
  odpověď, pokusy (vybraný zvýrazněný), nápověda a pokyn pro Clauda, pod tím papír (u pokusu bez vlastního papíru
  poslední známý stav před pokusem, jinak „bez papíru“). Obrázek jde rovnou do schránky; „Kopírovat“ a „Sdílet“
  (iPad, Android – do aplikace Claude) jsou i pod náhledem. Návod: Navod_test kap. 9.
-->

<style>
  :root {

  /* Vyzkoušej se (stránky s teorií, šablona v02) */

  @media (max-width: 700px) {

<body>
<div id="panel">
  <div class="title">Výsledky testů <img src="system/img/cat.svg" alt=""></div>
  <select id="fWho" aria-label="Uživatel"></select>
  <select id="fTest" aria-label="Test"></select>
  <button id="btnReload" type="button">Obnovit</button>
  <a class="btn" href="./">Rozcestník</a>
</div>
<main>
  <div class="tabs" id="tabs">
    <button data-t="relace" class="on">Testy</button>
    <button data-t="chyby">Chyby k procvičení</button>
    <button data-t="teorie">Teorie a stránky</button>
    <button data-t="zarizeni">Zařízení</button>
  </div>
  <div class="opts">Rychlá odpověď = první pokus za méně než <input type="number" id="fFast" min="0" max="120" value="10"> s
    <span>· Odpověď rychle po nápovědě = za méně než <input type="number" id="fNap" min="0" max="300" value="20"> s</span>
    <label><input type="checkbox" id="fUnknown"> zobrazit i neznámá zařízení</label>
    <label>Období <select id="fOd"><option value="30">30 dní</option><option value="90">90 dní</option><option value="365">rok</option><option value="0">vše</option></select></label></div>
  <div id="out"><p class="meta">Načítám…</p></div>

<script>
const $ = id => document.getElementById(id);
const esc = s => String(s == null ? "" : s).replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;");
const N = v => { const n = Number(String(v).replace(",", ".")); return isFinite(n) ? n : 0; };
const B = v => v === true || v === "ano" || v === "true" || v === "TRUE";
const STAV = { zelena: "správně napoprvé", oranzova: "správně napodruhé", cervena: "napotřetí / špatně", seda: "nedokončeno", nove: "nezačato", hotovo: "řešení zobrazeno" };
const BODY = { zelena: 1, oranzova: 0.5, cervena: 0 };
const fmtN = n => String(Math.round(n * 10) / 10).replace(".", ",");
const fmtS = s => { s = Math.round(N(s)); return s < 60 ? s + " s" : Math.floor(s / 60) + " min " + String(s % 60).padStart(2, "0") + " s"; };
const fmtD = iso => { const d = new Date(iso); return isNaN(d) ? "" : d.toLocaleDateString("cs-CZ") + " " + d.toLocaleTimeString("cs-CZ", { hour: "2-digit", minute: "2-digit" }); };
const pref = k => { try { return localStorage.getItem("annschool:vys:" + k); } catch (e) { return null; } };
const setPref = (k, v) => { try { localStorage.setItem("annschool:vys:" + k, v); } catch (e) { /* nic */ } };

let STRANKY = [], detailS = null;
let DATA = null, RELACE = [], ZAR = {}, tab = "relace", detail = null;

/* ---------- zpracování událostí na „relace“ (= jedno otevření testu) ---------- */
function zpracuj(d) {
  ZAR = {};
  (d.zarizeni || []).forEach(z => ZAR[z.zarizeni] = z);
  const by = {};
  d.udalosti.forEach(u => {
    if (!u.relace) return;
    const r = by[u.relace] || (by[u.relace] = { id: u.relace, ev: [], q: {}, zarizeni: u.zarizeni, prezdivka: "", test: u.test, nazev: u.nazev, verze: u.verze });
    r.ev.push(u);
    if (u.prezdivka) r.prezdivka = u.prezdivka;
  });
  RELACE = Object.values(by).map(r => {
    r.ev.sort((a, b) => new Date(a.cas) - new Date(b.cas));
    r.start = r.ev[0].cas; r.konec = r.ev[r.ev.length - 1].cas;
    const st = r.ev.find(u => u.udalost === "start");
    let det = {}; try { det = st && st.detail ? JSON.parse(st.detail) : {}; } catch (e) { /* nic */ }
    r.pocet = N(det.pocet) || 0;
    r.sablona = det.sablona || "";
    r.konfig = Array.isArray(det.priklady) ? det.priklady : null;     // zadání + správné odpovědi (šablona v21+)
    // poslední souhrn/stav/reset = doby a stavy všech příkladů (i přeskočených)
    const sum = r.ev.filter(u => u.udalost === "souhrn" || u.udalost === "stav" || u.udalost === "reset").pop();
    const rst = r.ev.filter(u => u.udalost === "reset").pop();       // v31: test resetován („Začít znovu“)
    r.reset = rst ? rst.cas : null;
    let sd = null; try { sd = sum && sum.detail ? JSON.parse(sum.detail) : null; } catch (e) { sd = null; }
    const Q = n => r.q[n] || (r.q[n] = { n, pokusy: [], napoveda: false, odchody: 0, odchody_s: 0, doba: 0, stav: "nove", zadani: "", sekce: "", typ: "" });
    if (sd && sd.priklady) sd.priklady.forEach(p => Object.assign(Q(p.n), { stav: p.stav, doba: N(p.doba_s), napoveda: !!p.napoveda, odchody: N(p.odchody), odchody_s: N(p.odchody_s), sekce: p.sekce, typ: p.typ, zadani: p.zadani || "", navstiveno: p.navstiveno, zacala: !!p.zacala }));
    r.odchody = 0; r.odchody_s = 0;
    r.ev.forEach(u => {
      const n = N(u.priklad);
      if (u.udalost === "vyhodnoceni" || u.udalost === "reseni") {
        const q = Q(n);
        q.pokusy.push({ pokus: N(u.pokus), ok: u.vysledek === "spravne", odpoved: u.odpoved, doba: N(u.doba_s), papir: u.papir, cas: u.cas, napoveda: B(u.napoveda), reseni: u.udalost === "reseni" });
        q.zadani = u.zadani || q.zadani; q.sekce = u.sekce; q.typ = u.typ; q.spravna = u.spravna;
        q.doba = Math.max(q.doba, N(u.doba_s));
        if (B(u.napoveda)) q.napoveda = true;
        if (u.udalost === "reseni") q.stav = "hotovo";
        else if (B(u.konecny)) q.stav = u.vysledek === "spravne" ? (N(u.pokus) === 1 ? "zelena" : N(u.pokus) === 2 ? "oranzova" : "cervena") : "cervena";
        else if (q.stav === "nove") q.stav = "seda";
      } else if (u.udalost === "napoveda") { const q = Q(n); q.napoveda = true; q.zadani = q.zadani || u.zadani; if (q.napDoba === undefined) q.napDoba = N(u.doba_s); }
      else if (u.udalost === "odchod") { r.odchody++; r.odchody_s += N(u.doba_s); if (n) { const q = Q(n); q._odch = (q._odch || 0) + 1; q._odchS = (q._odchS || 0) + N(u.doba_s); } }
    });
    Object.values(r.q).forEach(q => { if (q._odch > q.odchody) { q.odchody = q._odch; q.odchody_s = q._odchS; } });
    // šedá (nedokončeno) jen rozpracovaný příklad: pokus, nápověda, nebo (šablona v24+) něco na papíře / v odpovědi;
    // otevřený a přeskočený = bílá se štítkem „jen prohlédnuto“ (u starších testů se papír nepozná)
    Object.values(r.q).forEach(q => {
      if (q.stav === "seda" && !q.pokusy.length && !q.napoveda && !q.zacala) { q.stav = "nove"; q.prohlednuto = true; }
      else if (q.stav === "nove" && q.navstiveno) q.prohlednuto = true;
    });
    // za jak dlouho po otevření nápovědy (čas na příkladu) přišla odpověď
    Object.values(r.q).forEach(q => { if (q.napDoba !== undefined) q.pokusy.forEach(p => { if (p.napoveda && !p.reseni) p.poNap = Math.max(0, p.doba - q.napDoba); }); });
    r._Q = Q;
    if (!r.pocet) r.pocet = Math.max(0, ...Object.keys(r.q).map(Number));
    for (let n = 1; n <= r.pocet; n++) Q(n);
    if (r.konfig) doplnKonfig(r, r.konfig);
    const qs = Object.values(r.q).filter(q => q.n >= 1).sort((a, b) => a.n - b.n);
    r.qs = qs;
    r.body = qs.reduce((a, q) => a + (BODY[q.stav] || 0), 0);
    r.max = qs.filter(q => q.typ !== "dukaz").length;
    r.doba = sd ? N(sd.celkem_s) : qs.reduce((a, q) => a + q.doba, 0);
    r.napovedy = qs.filter(q => q.napoveda).length;
    r.pokusu = qs.reduce((a, q) => a + q.pokusy.length, 0);
    return r;
  }).filter(r => r.pocet || r.pokusu).sort((a, b) => new Date(b.start) - new Date(a.start));
}
/* ---------- stránky s teorií (materiály, taháky, pracovní listy, simulátory, zápisky) a rozcestník: události otevreni / stranka / odchod / klik ---------- */
const TYPY = { material: "materiál", tahak: "tahák", "pracovni-list": "pracovní list", simulator: "simulátor", zapisky: "zápisky", rozcestnik: "" };
/* ---------- zadání a správné odpovědi všech příkladů ----------
   Šablona v21+ je posílá při startu (detail.priklady). U starších testů se načte soubor testu z repozitáře
   a z bloku KONFIGURACE TESTU se zadání a správné odpovědi spočítají stejně jako v šabloně (zadaniText, fieldText). */
function doplnKonfig(r, list) {
  list.forEach(k => {
    const q = r._Q(N(k.n));
    if (!q.zadani) q.zadani = k.zadani || "";
    if (!q.spravna) q.spravna = k.spravna || "";
    if (!q.sekce) q.sekce = k.sekce || "";
    if (!q.typ) q.typ = k.typ || "";
    if (q.hintText === undefined && k.napoveda !== undefined) q.hintText = k.napoveda || "";
  });
  if (list.length > r.pocet) r.pocet = list.length;
}
const KONF = {};
const CESTA_TESTU = /^[a-z0-9-]+\/[a-z0-9-]+_test[a-z0-9-]*_v\d\d\.html$/;      // jen testy z repozitáře
const fmtT = n => Number(n.toFixed(10)).toLocaleString("cs-CZ", { maximumFractionDigits: 10 }).replace(/^[-−]/, "−");
const fmtV = n => { let x = Math.round(n * 10) / 10; if (Object.is(x, -0)) x = 0; return (x < 0 ? "−" : "") + String(Math.abs(x)).replace(".", ","); };
const plainT = s => String(s == null ? "" : s).replace(/\{([^{}]+)\}/g, "$1⃗").replace(/\^\(([^()]+)\)/g, "^($1)");
const popisV = (dx, dy) => { const p = []; if (dx) p.push(fmtV(Math.abs(dx)) + (dx > 0 ? " doprava" : " doleva"));
  if (dy) p.push(fmtV(Math.abs(dy)) + (dy > 0 ? " nahoru" : " dolů")); return p.length ? p.join(", ") : "nulový vektor"; };
function prikladyZKonfigurace(T) {
  const out = []; let sec = null;
  (T.questions || []).forEach(q => {
    if (q.section !== undefined) { sec = q.section || "Příklady"; return; }
    const typ = q.type || "cislo";
    const fields = typ === "cislo" ? [{ before: q.before, after: q.after, answer: q.answer, tol: q.tol }]
      : typ === "vyber" ? [{ options: q.options, answer: q.answer }] : typ === "dukaz" ? [] : (q.fields || []);
    const f = fields.map(f => [f.before, f.options ? "[" + f.options.join(" / ") + "]" : "[ ]", f.after].filter(Boolean).join(" ")).join(" · ");
    const fieldText = f => { const dec = f.tol ? Math.max(0, Math.ceil(-Math.log10(2 * f.tol))) : null;
      const v = f.options ? f.options[f.answer] : fmtT(dec === null ? f.answer : Number(f.answer.toFixed(dec)));
      return [f.before, v, f.after].filter(Boolean).join(" "); };
    let kresba = "";
    if (typ === "rysuj") kresba = (q.nazev || "v") + ": " + popisV(q.answer.dx, q.answer.dy);
    if (typ === "retez") { const s = q.retez.reduce((a, x) => ({ dx: a.dx + x.dx, dy: a.dy + x.dy }), { dx: 0, dy: 0 });
      kresba = q.retez.map(x => x.nazev + ": " + popisV(x.dx, x.dy)).concat((q.vysledna || "R") + ": " + popisV(s.dx, s.dy)).join("; "); }
    out.push({ n: out.length + 1, sekce: plainT(sec || "Příklady"), typ,
      zadani: plainT([q.text, f].filter(Boolean).join(" | ")),
      spravna: plainT([fields.map(fieldText).join(" · "), kresba].filter(Boolean).join(" | ")), napoveda: plainT(q.hint || "") });
  });
  return out;
}
function konfigTestu(cesta, verze) {
  const klic = cesta + "|" + verze;
  if (!KONF[klic]) KONF[klic] = (async () => {
    if (!CESTA_TESTU.test(cesta)) return null;
    for (const p of [cesta, "archiv/" + cesta.replace("/", "-")]) {
      try {
        const res = await fetch(p, { cache: "no-cache" }); if (!res.ok) continue;
        const t = await res.text();
        const a = t.indexOf("const TEST = {"), b = t.indexOf("/* ===================== KONEC KONFIGURACE");
        if (a < 0 || b < a) continue;
        const T = new Function("fmt", t.slice(a, b) + "\n;return TEST;")(fmtT);
        if (!T || T.version !== verze || typeof T.generate === "function") continue;   // jiná verze / náhodná sada
        return prikladyZKonfigurace(T);
      } catch (e) { /* další možnost */ }
    }
    return null;
  })();
  return KONF[klic];
}
// doplní zadání u relací bez detail.priklady a přepočítá; pak znovu vykreslí
async function doplnZadani() {

    if (!vysl[i]) return;

    r.qs = Object.values(r.q).filter(q => q.n >= 1).sort((a, b) => a.n - b.n);

// klepnutí na „📋 Pro Clauda“: připraví obrázek, hned ho zkopíruje a ukáže náhled s Kopírovat / Sdílet
function proClauda(b) {
  const r = RELACE.find(x => x.id === detail); if (!r) return;
  const q = r.qs.find(x => x.n === N(b.dataset.n)), k = N(b.dataset.k); if (!q) return;
  const klic = clKlic(r, q, k), kam = b.closest(".att, .ted");

  const blob = hotovo.then(v => v.blob);
  clKopiruj(blob)
    .then(() => ukaz("✓ zkopírováno – vlož do chatu s Claudem (Ctrl+V / podržet → Vložit)", true))
    .catch(e => hotovo.then(() => ukaz("obrázek je připravený – kopírování nevyšlo (" + e.message + "), klepni na Kopírovat nebo Sdílet"),
      e2 => ukaz("nepodařilo se připravit: " + e2.message)))

}

      e => { st.textContent = "kopírování nevyšlo: " + e.message; st.className = "clstav"; });

function zpracujStranky(d) {
  const by = {};
  d.udalosti.forEach(u => {
    if (!u.relace || !["otevreni", "stranka", "odchod", "klik", "porozumeni", "vyzkousej", "preskoceni"].includes(u.udalost)) return;
    const r = by[u.relace] || (by[u.relace] = { id: u.relace, ev: [], zarizeni: u.zarizeni, prezdivka: "", test: u.test, nazev: u.nazev, verze: u.verze });
    r.ev.push(u); if (u.prezdivka) r.prezdivka = u.prezdivka;
  });
  STRANKY = Object.values(by).filter(r => r.ev.some(u => u.udalost === "otevreni")).map(r => {
    r.ev.sort((a, b) => new Date(a.cas) - new Date(b.cas));
    const ot = r.ev.find(u => u.udalost === "otevreni");
    let od = {}; try { od = JSON.parse(ot.detail || "{}"); } catch (e) { /* nic */ }
    r.start = ot.cas; r.konec = r.ev[r.ev.length - 1].cas; r.typ = ot.typ || od.typ || ""; r.odkud = od.odkud || "";
    // nejnovější souhrn (čísla jen rostou)
    r.s = {}; r.ev.filter(u => u.udalost === "stranka").forEach(u => { try { const x = JSON.parse(u.detail || "{}"); if (N(x.otevreno_s) >= N(r.s.otevreno_s || -1)) r.s = x; } catch (e) { /* nic */ } });
    const odch = r.ev.filter(u => u.udalost === "odchod");

    r.porKliky = r.ev.filter(u => u.udalost === "porozumeni").map(u => { let x = {}; try { x = JSON.parse(u.detail || "{}"); } catch (e) { /* nic */ } return Object.assign({ cas: u.cas }, x); });

    r.vyz = {}; r.ev.filter(u => u.udalost === "vyzkousej").map(det).forEach(x => {
      if (!x.cast) return;
      const pred = r.vyz[x.cast];

      r.vyz[x.cast] = x; });

    return r;

      <div class="kpi"><b>${f.size}</b><span>rychlých odpovědí</span></div></div>
    <div style="margin-top:8px">${dots(r)}</div></div>`;
  h += `<table><tr><th>#</th><th>Příklad</th><th>Pokusy</th><th class="num">Čas</th><th class="hide-m">Poznámky</th></tr>`;
  r.qs.forEach(q => {
    const att = q.pokusy.map((p, i) => `<div class="att">${p.reseni ? "řešení zobrazeno" : `${p.pokus}. <span class="${p.ok ? "ok" : "bad"}">${p.ok ? "✓" : "✗"}</span> ${esc(p.odpoved)}`}
      <span class="small">(${fmtS(p.doba)})</span>${p.poNap !== undefined ? ` <span class="${p.ok && p.poNap < lim ? "flag red" : "small"}">${fmtS(p.poNap)} po nápovědě</span>` : ""}${p.papir && !String(p.papir).startsWith("chyba") ? ` <button class="pap" data-id="${esc(p.papir)}">papír</button><span class="imgbox"></span>` : ""}<button class="cl" type="button" data-n="${q.n}" data-k="${i}" title="Obrázek se zadáním, odpověďmi a papírem do schránky – pro rozbor chyby s Claudem">📋 Pro Clauda</button>${CL[clKlic(r, q, i)] ? clBoxHtml(r, q, i) : ""}</div>`).join("");
    const rp = q.pokusy.find(p => p.ok && p.poNap !== undefined && p.poNap < lim);
    const pozn = [q.napoveda ? `<span class="flag">nápověda${q.napDoba !== undefined ? " po " + fmtS(q.napDoba) : ""}</span>` : "",
      rp ? `<span class="flag red">správně ${fmtS(rp.poNap)} po nápovědě</span>` : "", f.has(q.n) ? `<span class="flag">rychlá odpověď</span>` : "",
      q.odchody ? `<span class="flag">odchody: ${q.odchody} (${fmtS(q.odchody_s)})</span>` : "", q.stav === "seda" && !q.pokusy.length ? `<span class="flag">rozpracováno</span>` : "",
      q.prohlednuto ? `<span class="flag gray">jen prohlédnuto</span>` : ""].join("");
    h += `<tr${pol && pol.n === q.n ? ' class="here"' : ""}><td><span class="dot st-${q.stav}">${q.n}</span></td>
      <td>${esc(q.zadani || "–")}<div class="small">${esc(q.sekce)}${q.spravna ? " · správně: " + esc(q.spravna) : ""}</div>${q.napoveda && q.hintText ? `<div class="hinttxt">nápověda: ${esc(q.hintText)}</div>` : ""}</td>
      <td>${att || '<span class="small">bez odpovědi</span>'}
        <div class="ted"><button class="pap-ted" data-n="${q.n}">${q.ted ? "obnovit" : "papír teď"}</button><span class="small tedinfo">${q.ted ? esc(q.ted.info) : ""}</span><button class="cl" type="button" data-n="${q.n}" data-k="-1" title="Obrázek se zadáním, všemi pokusy a aktuálním papírem do schránky – pro rozbor chyby s Claudem">📋 Pro Clauda</button><div class="imgbox">${q.ted ? q.ted.html : ""}</div>${CL[clKlic(r, q, -1)] ? clBoxHtml(r, q, -1) : ""}</div></td><td class="num">${fmtS(q.doba)}</td><td class="hide-m">${pozn}</td></tr>`;
  });
  return h + `</table>`;
}
function renderChyby() {
  // všechny příklady, které nebyly zeleně (napoprvé správně) – podklad pro opravné testy
  const rs = filtr(), rows = [];
  rs.forEach(r => r.qs.forEach(q => { if (["oranzova", "cervena", "seda"].includes(q.stav) && q.typ !== "dukaz") rows.push({ r, q }); }));
  if (!rows.length) return `<p class="meta">Žádné chyby pro tento výběr.</p>`;
  let h = `<p class="meta">Příklady, které nebyly správně napoprvé (oranžové, červené a nedokončené). Podle nich připraví Claude opravné testy.</p>`;
  h += `<table><tr><th>Kdy</th><th>Kdo</th><th>Test · příklad</th><th>Chybné odpovědi</th><th>Správně</th></tr>`;
  rows.forEach(({ r, q }) => {
    const spatne = q.pokusy.filter(p => !p.ok && !p.reseni).map(p => esc(p.odpoved)).join("<br>") || '<span class="small">bez odpovědi</span>';
    h += `<tr class="click" data-r="${esc(r.id)}"><td>${fmtD(r.start)}</td><td class="who">${esc(kdo(r).jm)}</td>
      <td><span class="dot st-${q.stav}">${q.n}</span> ${esc(r.nazev)}<div class="small">${esc(q.zadani)}</div></td>
      <td>${spatne}</td><td>${esc(q.spravna || "")}</td></tr>`;
  });
  return h + `</table>`;
}
function renderZarizeni() {
  const z = DATA.zarizeni || [];
  let h = `<p class="meta">Zařízení se zapisují sama při prvním výsledku. Schválení a přiřazení přezdívky se dělá v Google tabulce, list <b>Zarizeni</b>:
    sloupec <b>schvaleno</b> = ano, případně <b>prirazena_prezdivka</b> (přebije přezdívku ze zařízení).</p>`;
  if (!z.length) return h + `<p class="meta">Zatím žádná zařízení.</p>`;
  h += `<table><tr><th>ID</th><th>Přezdívka ze zařízení</th><th>Přiřazená</th><th>Schváleno</th><th class="hide-m">Poprvé</th><th>Naposledy</th><th class="num">Událostí</th></tr>`;
  z.forEach(x => {
    h += `<tr><td>${esc(x.zarizeni)}</td><td>${esc(x.prezdivka_ze_zarizeni) || '<span class="flag red">žádná</span>'}</td><td>${esc(x.prirazena_prezdivka)}</td>
      <td>${String(x.schvaleno).toLowerCase() === "ano" ? "ano" : '<span class="flag">ne</span>'}</td><td class="hide-m">${fmtD(x.prvni)}</td><td>${fmtD(x.posledni)}</td><td class="num">${esc(x.udalosti)}</td></tr>`;
  });
  return h + `</table>`;
}
function render() {
  document.querySelectorAll("#tabs button").forEach(b => b.classList.toggle("on", b.dataset.t === tab));
  const out = $("out");
  if (!DATA) return;
  if (detail) { const r = RELACE.find(x => x.id === detail); out.innerHTML = r ? renderDetail(r) : ""; }
  else if (detailS) { const r = STRANKY.find(x => x.id === detailS); out.innerHTML = r ? renderStranka(r) : ""; }
  else out.innerHTML = tab === "relace" ? renderRelace() : tab === "chyby" ? renderChyby() : tab === "teorie" ? renderTeorie() : renderZarizeni();
  out.querySelectorAll("tr[data-s]").forEach(tr => tr.onclick = () => { detailS = tr.dataset.s; render(); scrollTo(0, 0); });
  out.querySelectorAll("tr[data-r]").forEach(tr => tr.onclick = () => { detail = tr.dataset.r; render(); scrollTo(0, 0); });
  const back = $("back"); if (back) back.onclick = () => { detail = null; detailS = null; render(); };
  out.querySelectorAll("button.pap").forEach(b => b.onclick = async () => {
    const box = b.nextElementSibling;
    if (box.innerHTML) { box.innerHTML = ""; return; }
    b.disabled = true; b.textContent = "načítám…";
    try { const j = await Zaznam.nacti("obrazek", { id: b.dataset.id }); box.innerHTML = `<img class="paperimg" src="${j.url}" alt="papír">`; }
    catch (e) { box.textContent = " nepodařilo se načíst: " + e.message; }
    b.disabled = false; b.textContent = "papír";
  });
  out.querySelectorAll("button.pap-ted").forEach(b => b.onclick = () => papirTed(b));
  out.querySelectorAll("button.cl").forEach(b => b.onclick = () => proClauda(b));
  vazbyCl(out);
  out.querySelectorAll("button.pap.auto").forEach(b => b.click());          // papír z „Vyzkoušej se“ – poslední verze hned
  out.querySelectorAll(".vyz details").forEach(d => d.addEventListener("toggle", () => { if (d.open) d.querySelectorAll("button.pap:not([data-nacteno])").forEach(b => { b.dataset.nacteno = "1"; b.click(); }); }));
}
function plnFiltry() {
  const who = [...new Set(RELACE.concat(STRANKY).map(r => kdo(r)).filter(k => k.znamy || $("fUnknown").checked).map(k => k.jm))].sort((a, b) => a.localeCompare(b, "cs"));
  const tests = {}; RELACE.forEach(r => { if (!tests[r.test] || r.verze > tests[r.test].verze) tests[r.test] = r; });
  const w = $("fWho").value || pref("who") || "", t = $("fTest").value || "";
  $("fWho").innerHTML = `<option value="">Všichni</option>` + who.map(x => `<option${x === w ? " selected" : ""}>${esc(x)}</option>`).join("");
  $("fTest").innerHTML = `<option value="">Všechny testy</option>` + Object.keys(tests).sort().map(x => `<option value="${esc(x)}"${x === t ? " selected" : ""}>${esc(tests[x].nazev)} (${esc(x.split("/")[0])})</option>`).join("");
}
async function load() {
  $("out").innerHTML = `<p class="meta">Načítám…</p>`;
  try {
    const dni = N($("fOd").value);
    const od = dni ? new Date(Date.now() - dni * 864e5).toISOString().slice(0, 10) : "";
    DATA = await Zaznam.nacti("data", od ? { od } : {});
    STAV_R = {}; nactiStav(DATA);
    zpracuj(DATA); zpracujStranky(DATA); plnFiltry(); render();
    doplnZadani();
  } catch (e) {
    $("out").innerHTML = `<p class="err">Výsledky se nepodařilo načíst: ${esc(e.message)}</p>`;
  }
}
$("tabs").onclick = e => { const b = e.target.closest("button"); if (!b) return; tab = b.dataset.t; detail = null; detailS = null; render(); };
$("fWho").onchange = () => { setPref("who", $("fWho").value); render(); };
$("fTest").onchange = render;
$("fFast").value = pref("fast") || 10;
$("fFast").oninput = () => { setPref("fast", $("fFast").value); render(); };
$("fNap").value = pref("nap") || 20;
$("fNap").oninput = () => { setPref("nap", $("fNap").value); render(); };
$("fUnknown").onchange = () => { plnFiltry(); render(); };
$("fOd").value = pref("od") || "365";
$("fOd").onchange = () => { setPref("od", $("fOd").value); load(); };
$("btnReload").onclick = load;
load();
</script>
