<!-- ===== KONEC HLAVIČKY ===== -->
<!--
  ŠABLONA RYCHLOUČENÍ – Ann School (system/Sablona_rychlouceni_vXX.html)
  Nové Rychloučení = kopie této šablony do složky předmětu: <předmět>/<tema>_rychlouceni_vXX.html.
  Měň JEN bloky HLAVIČKA (<title>), NÁZEV V PANELU (název a verze) a KONFIGURACE RYCHLOUČENÍ. Postup: system/Navod_rychlouceni_vXX.md.
  v01 (09.11.2026): učení formou testu.
  v02 (09.11.2026): časová osa dole – kolečko za každý fakt v pořadí kapitol (šedá = ještě nebylo, oranžová = učí se,
       červená = poslední odpověď špatně, zelená = naučeno; aktuální otázka orámovaná).
  - Fakt = jedna věc, kterou má žák umět (stálé id, kapitola, priorita jadro / doplnek, 2+ varianty otázky).
    Otázka = výběr z 5 zamíchaných možností + „Nevím“ (počítá se jako špatně). Po odpovědi hned vyhodnocení,
    vysvětlení, pomůcka a co znamená vybraná špatná možnost (ze slovníku POJMY). „Další“ je pod vyhodnocením,
    400 ms po vyhodnocení se na klepnutí nereaguje (dvojité klepnutí nepřeskočí vysvětlení).
  - Plánovač (čistá funkce bez DOM, Rychlouceni.planovac): fronta podle toho, kdy je fakt na řadě – špatně za 3 otázky,
    správně za 6; vždy fakt, který je na řadě nejdřív; když nic není na řadě a v práci je < 8 faktů, přidá nový
    (nejdřív jadro, kapitoly v pořadí); jinak nejbližší i dřív. Nikdy stejný fakt dvakrát po sobě (kromě posledního).
    Naučený = 2 správné odpovědi za sebou s jinou otázkou mezi nimi (u posledního faktu je mezi nimi výplň = naučený
    fakt s nejvíc chybami). Varianta = nejdéle nepoužitá, jiná než minule.
  - Kapitola s kostra: true – možnosti až po „Ukázat možnosti“ (nejdřív si odpověď řekne v duchu).
  - Závěrečné kolo: fakta s aspoň jednou chybou, promíchaná, každé jednou v jiné variantě.
  - Ranní opakování: nejslabší fakta (nejvíc chyb, pak nejméně správných), stačí 1 správná odpověď; po 10 min
    nebo 30 otázkách nabídne „Pokračovat“. Bez uloženého stavu: nejdřív kostra, pak náhodně.
  - Pauza po 25 min učení, po 60 min „Zbytek nech na ráno“. Odhad zbývajícího času podle úspěšnosti a tempa.
  - Stav po každé odpovědi v localStorage „annschool:rychlouceni:<cesta>“; nová verze stránky převezme stav
    z nejvyšší starší verze (Sledovani.zPredchoziVerze), fakta podle id.
  - Záznam (sledovani.js, Sledovani.udalost): rychlo_start, rychlo_odpoved, rychlo_naucen, rychlo_souhrn,
    rychlo_reset, rychlo_rano; oblast = kapitola. Pro kontrolu jen pro čtení window.Rychlouceni { stav(), otazka() }.
  - Na stránce se nic neoznačuje dlouhým stiskem (jako šablona testu v22), malá tlačítka, touch-action: manipulation.
-->

<script>
/* =====================================================================
   KONFIGURACE RYCHLOUČENÍ – měň jen tuto část (návod: system/Navod_rychlouceni_vXX.md)
   kapitoly: [{ id, nazev, kostra?: true }] – pořadí = pořadí učení (kostra první)
   pojmy:    { "pojem": "krátká definice ze slidů" } – vysvětlení špatných možností se skládá samo
   fakta:    [{ id (stálé mezi verzemi), kap, pri: "jadro" | "doplnek", vysv (1–2 věty ke správné odpovědi),
               pomucka?, var: [{ t: zadání, ok: správná možnost, s: [[špatná možnost, pojem nebo vlastní vysvětlení] ×4],
               vyjimka5?: "důvod" (méně než 5 možností) }, …] }]
   ===================================================================== */
const RYCHLO = {
  title: "Ukázka – Rychloučení",
  version: "v02",
  topic: "ukazka",
  kapitoly: [
    { id: "kostra", nazev: "Kostra", kostra: true },
    { id: "k1", nazev: "1. Ukázková kapitola" }
  ],
  pojmy: {
    "jádro": "obsahuje DNA, řídicí centrum buňky",
    "ribosom": "syntéza bílkovin",
    "mitochondrie": "buněčné dýchání, hlavní producent ATP",
    "lysozom": "měchýřek s trávicími enzymy",
    "vakuola": "organela ohraničená tonoplastem"
  },
  fakta: [
    { id: "u-jadro", kap: "kostra", pri: "jadro", vysv: "Jádro obsahuje DNA a řídí buňku.", var: [
      { t: "Která organela je řídicím centrem buňky?", ok: "jádro", s: [["ribosom", "ribosom"], ["mitochondrie", "mitochondrie"], ["lysozom", "lysozom"], ["vakuola", "vakuola"]] },
      { t: "Co je jádro?", ok: "řídicí centrum buňky s DNA", s: [["místo syntézy bílkovin", "ribosom"], ["místo buněčného dýchání", "mitochondrie"],
        ["měchýřek s trávicími enzymy", "lysozom"], ["organela ohraničená tonoplastem", "vakuola"]] } ] },
    { id: "u-ribosom", kap: "k1", pri: "jadro", vysv: "Ribozomy syntetizují bílkoviny.", pomucka: "ribosom = továrna na bílkoviny", var: [
      { t: "Co dělají ribozomy?", ok: "syntéza bílkovin", s: [["buněčné dýchání", "mitochondrie"], ["trávení", "lysozom"], ["řízení buňky", "jádro"], ["zásoba vody", "vakuola"]] },
      { t: "Která organela syntetizuje bílkoviny?", ok: "ribosom", s: [["jádro", "jádro"], ["mitochondrie", "mitochondrie"], ["lysozom", "lysozom"], ["vakuola", "vakuola"]] } ] },
    { id: "u-mito", kap: "k1", pri: "doplnek", vysv: "Mitochondrie zajišťují buněčné dýchání.", var: [
      { t: "Která organela zajišťuje buněčné dýchání?", ok: "mitochondrie", s: [["jádro", "jádro"], ["ribosom", "ribosom"], ["lysozom", "lysozom"], ["vakuola", "vakuola"]] },
      { t: "Co zajišťují mitochondrie?", ok: "buněčné dýchání", s: [["syntéza bílkovin", "ribosom"], ["trávení", "lysozom"], ["řízení buňky", "jádro"], ["zásoba vody", "vakuola"]] } ] }
  ]
};
/* ===================== KONEC KONFIGURACE ===================== */

"use strict";
/* ---------- nastavení metody (stejné pro všechna Rychloučení) ---------- */
const NAST = { maxPrace: 8, spatneZa: 3, spravneZa: 6, naucenoPo: 2, ranoMin: 10, ranoOtazek: 30,
  pauzaMin: 25, naRanoMin: 60, odhadS: 14, zamekMs: 400, necinnostS: 120 };

/* =====================================================================
   PLÁNOVAČ – čisté funkce bez DOM (stav + odpověď → nový stav a další otázka)
   F = [{ id, nVar, kap }] v pořadí, ve kterém se nová fakta přidávají
   ===================================================================== */
const Planovac = (function () {
  const kopie = o => JSON.parse(JSON.stringify(o));
  function rnd(stav) {                        // mulberry32 se stavem v objektu (deterministické)
    let t = (stav.seed = (stav.seed + 0x6D2B79F5) >>> 0);
    t = Math.imul(t ^ (t >>> 15), t | 1); t ^= t + Math.imul(t ^ (t >>> 7), t | 61);
    return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
  }
  function zamichej(stav, a) { a = a.slice(); for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(rnd(stav) * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; }
  function novaFronta(ids, potreba) { return { potreba, nove: ids.slice(), prace: {}, posledni: null }; }
  function novy(F, seed) {
    const stav = { seed: (seed >>> 0) || 1, n: 0, rezim: "uceni", fakta: {}, fronta: null, uceni: null, zaver: null };
    F.forEach(f => { stav.fakta[f.id] = { spatne: 0, spravne: 0, napoprve: null, naucen: false, vybrala: [], varPosl: Array(f.nVar).fill(-1), varMinule: -1 }; });
    stav.fronta = novaFronta(F.map(f => f.id), NAST.naucenoPo);
    return stav;
  }
  function vyberVariantu(fs) {
    let best = -1;
    fs.varPosl.forEach((p, i) => { if (i === fs.varMinule && fs.varPosl.length > 1) return; if (best < 0 || p < fs.varPosl[best]) best = i; });
    return best < 0 ? 0 : best;
  }
  // další fakt z fronty (null = fronta je hotová)
  function zFronty(stav, vypln) {
    const fr = stav.fronta, q = stav.n, ids = Object.keys(fr.prace);
    const jine = ids.filter(id => id !== fr.posledni);
    if (!fr.nove.length && ids.length === 1) {   // poslední zbývající fakt: mezi opakování výplň z naučených (po chybě 2, jinak 1)
      const nauc = vypln ? Object.keys(stav.fakta).filter(id => stav.fakta[id].naucen && id !== fr.posledni) : [];
      const w = fr.prace[ids[0]], odstup = w.posl < 0 ? 0 : w.streak === 0 ? 2 : 1;
      if (q - w.posl - 1 < odstup && nauc.length) {
        nauc.sort((a, b) => stav.fakta[b].spatne - stav.fakta[a].spatne || Math.max(...stav.fakta[a].varPosl) - Math.max(...stav.fakta[b].varPosl));
        return { vypln: nauc[0] };
      }
      return ids[0];
    }
    const poradi = (a, b) => fr.prace[a].due - fr.prace[b].due || fr.prace[b].streak - fr.prace[a].streak || ids.indexOf(a) - ids.indexOf(b);
    // závěr fronty (nic nového, v práci ≤ 3): přednost má fakt, kterému chybí jen jedna správná odpověď
    if (!fr.nove.length && ids.length <= 3) {
      const skoro = jine.filter(id => fr.prace[id].streak >= 1 && fr.prace[id].streak < fr.potreba);
      if (skoro.length) return skoro.sort(poradi)[0];
    }
    const naRade = jine.filter(id => fr.prace[id].due <= q).sort(poradi);
    if (naRade.length) return naRade[0];
    if (ids.length < NAST.maxPrace && fr.nove.length) {
      const id = fr.nove.shift(); fr.prace[id] = { due: q, streak: 0, posl: -1 }; return id;
    }
    // nic není na řadě a nový fakt přidat nejde: nejbližší fakt i dřív; právě zchybovaný fakt (méně než 2 otázky
    // od chyby) jen tehdy, když jiný není
    if (jine.length) {
      const s = jine.sort(poradi), ok = s.filter(id => !(fr.prace[id].streak === 0 && fr.prace[id].posl >= 0 && q - fr.prace[id].posl - 1 < 2));
      return (ok.length ? ok : s)[0];
    }
    if (ids.length) return ids[0];
    return null;
  }
  function dalsi(stav0, F) {
    const stav = kopie(stav0);
    let id = null;
    if (stav.rezim === "uceni" || stav.rezim === "rano") {
      id = zFronty(stav, stav.rezim === "uceni");
      if (id && id.vypln) {
        const v = vyberVariantu(stav.fakta[id.vypln]);
        return { stav, otazka: { id: id.vypln, v, poradi: stav.n + 1, rezim: stav.rezim, vypln: true } };
      }
      if (id === null && stav.rezim === "uceni") {
        const chybna = F.filter(f => stav.fakta[f.id].spatne > 0).map(f => f.id);
        stav.rezim = chybna.length ? "zaver" : "hotovo";
        stav.zaver = { seznam: zamichej(stav, chybna), i: 0 };
      }
    }
    if (stav.rezim === "zaver") {

const $ = id => document.getElementById(id);
const CESTA = location.pathname.replace(/^.*\/annschool\//, "").replace(/^\//, "") || "rychlouceni.html";
const KLIC = "annschool:rychlouceni:" + CESTA;
const KAP = Object.fromEntries(RYCHLO.kapitoly.map((k, i) => [k.id, Object.assign({ i }, k)]));

const F = RYCHLO.fakta.map((f, i) => ({ id: f.id, nVar: f.var.length, kap: f.kap, pri: f.pri, i }))
  .sort((a, b) => (a.pri === "doplnek") - (b.pri === "doplnek") || KAP[a.kap].i - KAP[b.kap].i || a.i - b.i);

/* v22 šablony testu: dlouhý stisk nic neoznačuje (na stránce nejsou pole) */
document.addEventListener("selectstart", e => e.preventDefault());

let S = null;            // uložený stav: { planovac, cas, ulozeno, prevzato }

let zamekDo = 0, prevzato = "";

function seedNahodny() { return (Math.random() * 4294967296) >>> 0; }
function novyStav() { return { planovac: Planovac.novy(F, seedNahodny()), cas: { uceni_s: 0, rano_s: 0, rano_otazek: 0, pauza: false, naRano: false }, ulozeno: 0, otazka: null }; }
function nactiStav() {
  let raw = null;

  if (raw) { try { const s = JSON.parse(raw); if (s && s.planovac) return doplnFakta(s); } catch (e) { /* poškozené → znovu */ } }
  // nová verze stránky: převzít stav z nejvyšší starší verze (fakta podle id)
  const st = window.Sledovani && Sledovani.zPredchoziVerze ? Sledovani.zPredchoziVerze("annschool:rychlouceni:") : null;

}
// starý stav → nová konfigurace: statistiky podle id, neznámá fakta pryč, nová fakta jako nová, fronta znovu
function prevzit(s) {
  const n = novyStav(), p = n.planovac, st = s.planovac;
  p.n = st.n || 0;
  F.forEach(f => {
    const o = st.fakta && st.fakta[f.id];
    if (!o) return;
    const fs = p.fakta[f.id];
    ["spatne", "spravne", "napoprve", "naucen"].forEach(k => { if (k in o) fs[k] = o[k]; });
    fs.vybrala = Array.isArray(o.vybrala) ? o.vybrala.slice(-20) : [];
    fs.varPosl = Array(f.nVar).fill(-1).map((x, i) => (o.varPosl && o.varPosl[i] !== undefined ? o.varPosl[i] : -1));
    fs.varMinule = typeof o.varMinule === "number" && o.varMinule < f.nVar ? o.varMinule : -1;
  });
  const vPraci = st.fronta && st.rezim === "uceni" ? Object.keys(st.fronta.prace || {}).filter(id => FAKT[id]) : [];
  p.fronta.nove = F.map(f => f.id).filter(id => !p.fakta[id].naucen && !vPraci.includes(id));
  vPraci.forEach(id => { if (!p.fakta[id].naucen) p.fronta.prace[id] = Object.assign({ due: p.n, streak: 0, posl: -1 }, st.fronta.prace[id], { due: p.n }); });

function doplnFakta(s) {           // stav uložený touto verzí – jen pro jistotu doplnit chybějící fakta
  const p = s.planovac;
  F.forEach(f => { if (!p.fakta[f.id]) { p.fakta[f.id] = Planovac.novy([f], 1).fakta[f.id]; if (p.fronta && p.rezim === "uceni") p.fronta.nove.push(f.id); } });
  s.cas = Object.assign({ uceni_s: 0, rano_s: 0, rano_otazek: 0, pauza: false, naRano: false }, s.cas || {});
  return s;
}

/* ---------- pomocné ---------- */
const esc = s => String(s).replace(/[&<>"]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
function zamichej(a) { a = a.slice(); for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; }
function pocetNaucenych(p) { return F.filter(f => p.fakta[f.id].naucen).length; }
function statistika(p) {
  let odp = 0, nap = 0, napOk = 0;
  F.forEach(f => { const x = p.fakta[f.id]; odp += x.spatne + x.spravne; if (x.napoprve !== null) { nap++; if (x.napoprve) napOk++; } });
  return { odpovedi: odp, spravne_napoprve_pct: nap ? Math.round(napOk / nap * 100) : null };
}
// odhad zbývajícího času učení (min): potřebné správné odpovědi / úspěšnost + závěrečné kolo, × tempo
function odhadMin(p) {
  let ok = 0, vse = 0;
  F.forEach(f => { const x = p.fakta[f.id]; ok += x.spravne; vse += x.spatne + x.spravne; });
  const usp = Math.min(.95, Math.max(.3, vse >= 5 ? ok / vse : .7));
  const tempo = vse >= 5 && S.cas.uceni_s > 0 ? Math.min(40, Math.max(6, S.cas.uceni_s / vse)) : NAST.odhadS;
  let otazek = 0;
  if (p.rezim === "uceni") {
    const fr = p.fronta;
    F.forEach(f => { if (p.fakta[f.id].naucen) return; const w = fr.prace[f.id]; otazek += (NAST.naucenoPo - (w ? w.streak : 0)) / usp; });
    const chybne = F.filter(f => p.fakta[f.id].spatne > 0).length, zbyva = F.filter(f => !p.fakta[f.id].naucen && !p.fakta[f.id].spatne).length;
    otazek += chybne + zbyva * (1 - usp);
  } else if (p.rezim === "zaver") otazek = p.zaver.seznam.length - p.zaver.i;
  return Math.max(0, Math.round(otazek * tempo / 60));
}

    fakta: F.filter(f => p.fakta[f.id].spatne + p.fakta[f.id].spravne > 0).map(f => {

      return { id: f.id, kap: f.kap, spatne: x.spatne, spravne: x.spravne, napoprve: x.napoprve, naucen: x.naucen, vybrala: x.vybrala.slice(-6) };

}

  const vy = $("vyhodnoceni");
  vy.className = spravne ? "ok" : "bad";
  $("vVerdikt").textContent = spravne ? (o.naucen ? "✓ Správně – naučeno!" : "✓ Správně") : nevim ? "✗ Nevím – teď se to nauč:" : "✗ Špatně";
  $("vSpravna").innerHTML = "Správně: <b>" + esc(v.ok) + "</b>";
  $("vVysv").textContent = f.vysv;
  $("vPomucka").hidden = !f.pomucka; $("vPomucka").textContent = f.pomucka ? "Pomůcka: " + f.pomucka : "";
  const volba = !spravne && !nevim ? vysvetliSpatnou(f, v, text) : "";
  $("vVolba").hidden = !volba; $("vVolba").innerHTML = volba ? "Tvoje volba: " + volba : "";
  vy.hidden = false;
  vykresliOsu();
  zamekDo = Date.now() + NAST.zamekMs;
  // vyhodnocení i „Další“ musí být vidět
  requestAnimationFrame(() => { const r = $("btnDalsi").getBoundingClientRect(), dole = $("osa").getBoundingClientRect().top; if (r.bottom > dole - 10) window.scrollBy(0, r.bottom - dole + 20); });
}
function dalsiKlik() {
  if (!zodpovezeno || Date.now() < zamekDo) return;
  const p = S.planovac;
  if (p.rezim === "rano" && (S.cas.rano_otazek >= NAST.ranoOtazek || S.cas.rano_s >= NAST.ranoMin * 60) && !S.cas.ranoNabidnuto) {
    S.cas.ranoNabidnuto = true; uloz();
    dialog(`Ranní opakování: ${S.cas.rano_otazek} otázek za ${Math.round(S.cas.rano_s / 60)} min. Chceš pokračovat?`, [
      ["Konec", () => { posliSouhrn(true); S.planovac = Planovac.konecRano(S.planovac); uloz(); uvod(); }],
      ["Pokračovat", () => { S.cas.rano_otazek = 0; S.cas.rano_s = 0; S.cas.ranoNabidnuto = false; uloz(); dalsiOtazka(false); }, true]]);
    return;
  }
  dalsiOtazka(false);
}
// pauza po 25 min, po 60 min „zbytek na ráno“ (jen při učení, mezi otázkami)
function nabidkaCasu() {
  const p = S.planovac;
  if (p.rezim !== "uceni") return false;
  if (!S.cas.naRano && S.cas.uceni_s >= NAST.naRanoMin * 60) {
    S.cas.naRano = true; S.cas.pauza = true; uloz();
    udalost("rychlo_souhrn", "nabídka na ráno", Object.assign(souhrnDetail(), { nabidka: "na_rano" }));
    dialog(`Učíš se už hodinu (naučeno ${pocetNaucenych(p)} z ${F.length}). Zbytek nech na ráno – ráno klepni na „Ranní opakování“, nebo „Pokračovat“.`, [
      ["Konec na dnes", () => uvod()], ["Ještě pokračovat", () => dalsiOtazka(false), true]]);
    return true;
  }
  if (!S.cas.pauza && S.cas.uceni_s >= NAST.pauzaMin * 60) {
    S.cas.pauza = true; uloz();
    dialog(`Učíš se už ${NAST.pauzaMin} minut. Dej si krátkou pauzu (5 minut) – protáhni se, napij se. Pak pokračuj.`, [["Pokračovat", () => dalsiOtazka(false), true]]);
    return true;
  }
  return false;
}
function mezistrankaZaver(prvni) {
  ukaz("scMezi"); oblast("Závěrečné kolo");
  const n = S.planovac.zaver.seznam.length;
  $("mNadpis").textContent = "Všechno naučeno!";
  $("mText").textContent = `Teď závěrečné kolo: ${n} ${n === 1 ? "otázka" : n < 5 ? "otázky" : "otázek"} z toho, co ti dělalo potíže – každá jednou, jinak položená.`;
  $("mTabulka").innerHTML = "";
  const t = $("mTlacitka"); t.innerHTML = "";
  const b = document.createElement("button"); b.type = "button"; b.className = "btn hl"; b.id = "btnZaver"; b.textContent = "Spustit závěrečné kolo";
  b.onclick = () => pripravOtazku(prvni); t.appendChild(b);
  posliSouhrn(true);
}
function konecRezimu(rezim) {
  if (rezim === "rano") {
    posliSouhrn(true);
    S.planovac = Planovac.konecRano(S.planovac); uloz();
    ukaz("scMezi"); oblast("Souhrn");
    $("mNadpis").textContent = "Ranní opakování hotové";
    $("mText").textContent = "Všechno z ranního opakování jsi odpověděla správně. Hodně štěstí v testu!";
    $("mTabulka").innerHTML = "";
    tlacitkaSouhrnu();
    return;
  }
  souhrn();
}
function souhrn() {
  const p = S.planovac, st = statistika(p);
  ukaz("scMezi"); oblast("Souhrn");
  posliSouhrn(true);
  $("mNadpis").textContent = "Hotovo!";
  $("mText").textContent = `Naučeno ${pocetNaucenych(p)} z ${F.length}. Odpovědí ${st.odpovedi}, správně napoprvé ${st.spravne_napoprve_pct ?? 0} %, ` +
    `čas asi ${Math.round(S.cas.uceni_s / 60)} min. Ráno si dej „Ranní opakování“.`;
  const slabe = F.filter(f => p.fakta[f.id].spatne > 0).sort((a, b) => p.fakta[b.id].spatne - p.fakta[a.id].spatne).slice(0, 12);
  $("mTabulka").innerHTML = slabe.length ? "<table class='slabe'><tr><th>Co ti dělalo potíže</th><th>chyb</th></tr>" +
    slabe.map(f => `<tr><td>${esc(FAKT[f.id].var[0].t)}<br><span class="muted">${esc(FAKT[f.id].var[0].ok)}</span></td><td>${p.fakta[f.id].spatne}</td></tr>`).join("") + "</table>" : "";
  tlacitkaSouhrnu();
}
function tlacitkaSouhrnu() {
  const t = $("mTlacitka"); t.innerHTML = "";
  [["Ranní opakování", ranniOpakovani, true], ["Úvod", uvod], ["Začít znovu", zacitZnovu]].forEach(([l, fn, hl]) => {
    const b = document.createElement("button"); b.type = "button"; b.className = "btn" + (hl ? " hl" : ""); b.textContent = l; b.onclick = fn; t.appendChild(b);
  });
}

/* ---------- čas učení (jen viditelná stránka s otázkou, bez dlouhé nečinnosti) ---------- */
let tik = Date.now(), posledniVstup = Date.now();
["pointerdown", "keydown", "touchstart"].forEach(t => window.addEventListener(t, () => { posledniVstup = Date.now(); }, { passive: true, capture: true }));
setInterval(() => {
  const now = Date.now(), d = Math.min(now - tik, 5000) / 1000; tik = now;
  if (!S || document.visibilityState !== "visible" || $("scOtazka").hidden || now - posledniVstup > NAST.necinnostS * 1000) return;
  if (S.planovac.rezim === "rano") S.cas.rano_s += d; else S.cas.uceni_s += d;
}, 1000);
setInterval(() => { if (S && document.visibilityState === "visible") uloz(); }, 15000);
document.addEventListener("visibilitychange", () => { if (document.visibilityState === "hidden") { uloz(); posliSouhrn(false); } else tik = Date.now(); });
window.addEventListener("pagehide", () => { uloz(); posliSouhrn(false); });

/* ---------- ovládání ---------- */
$("btnZacit").onclick = () => zacit(false);
$("btnPokracovat").onclick = () => zacit(true);
$("btnRano").onclick = ranniOpakovani;
$("btnZnovu").onclick = zacitZnovu;
$("btnUkazat").onclick = odkryj;
$("btnNevim").onclick = () => { if (!OT || zodpovezeno) return; if (!OT.odkryto) { OT.odkryto = true; } odpovez("", true); };
$("btnDalsi").onclick = dalsiKlik;
$("btnUvod").onclick = () => { uloz(); uvod(); };
$("btnHome").onclick = () => { uloz(); posliSouhrn(false); if (window.Zaznam) Zaznam.beacon(); location.href = "../index.html"; };

/* ---------- jen pro čtení (kontrola) ---------- */
window.Rychlouceni = Object.freeze({
  stav: () => (S ? JSON.parse(JSON.stringify(S)) : null),
  otazka: () => {
    if (!OT) return null;
    const f = FAKT[OT.id], v = f.var[OT.v];
    return { id: OT.id, varianta: OT.v, rezim: OT.rezim, poradi: OT.poradi, text: v.t, moznosti: OT.moznosti.slice(), spravna: OT.moznosti.indexOf(v.ok),
      spravnaText: v.ok, kostra: !!KAP[f.kap].kostra, odkryto: !!OT.odkryto, zodpovezeno: !!zodpovezeno };
  },
  planovac: Planovac,
  poradiFaktu: () => F.map(f => Object.assign({}, f)),
  nastaveni: Object.freeze(Object.assign({}, NAST))
});

S = nactiStav();
if (S && prevzato) { uloz(); toast("Pokračuješ, kde jsi skončila ve starší verzi."); }
uvod();
</script>
