<!doctype html>
<html lang="cs">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="apple-mobile-web-app-title" content="Ann School">
<title>Ann School</title>
<link rel="icon" type="image/svg+xml" href="system/img/cat.svg">
<link rel="apple-touch-icon" href="system/img/apple-touch-icon.png">
<script src="system/lib/zaznam.js"></script>
<script src="system/lib/sledovani.js" data-typ="rozcestnik"></script>
<!--
  ROZCESTNÍK – Ann School (index.html, stálá adresa, proto bez _vXX; historie je v gitu)
  Otevření rozcestníku a klepnutí na položky se zaznamenávají (system/lib/sledovani.js). PDF (jen vstupy: školní materiály, sešit) se nesledují.
  Seznam souborů se načítá automaticky z GitHubu (aktuální = nejvyšší _vXX v každé složce předmětu).
  Při novém tématu nebo předmětu doplň jen český název do NAZVY níže (nové téma na konec NAZVY.temata – určuje pořadí).
  PŘEPÍNAČ PŘEDMĚTŮ (22.11.2026, Martin): druhý řádek horního panelu (stále nahoře) s tlačítkem pro každý předmět,
  klepnutí odscrolluje na předmět, aktuální předmět je zvýrazněný. Srdíčko mají předměty v SRDICKO.
  PORADI_TEMAT: pořadí témat jen pro jeden předmět (má přednost před pořadím v NAZVY.temata).
  PŘÍPRAVA NA TEST (14.11.2026, Martin): rámeček se soubory k nejbližšímu testu (PRIPRAVA níže). Každá položka je
  „předmět/téma_typ“ – odkaz vede na nejvyšší verzi; položka, která ještě neexistuje, se nezobrazí. Po testu blok smaž (PRIPRAVA = []).
  Od 24.11.2026 (Martin): blok s predmet: "fyzika" se ukáže uvnitř sekce toho předmětu hned pod jeho nadpisem;
  blok bez predmet zůstává nahoře nad všemi předměty.
-->
<style>
  :root {
    --bg: #fafaf7; --paper: #fff; --text: #1d1d1b; --muted: #6b6b66; --line: #dcdcd5;
    --accent: #2b5cab; --panel-h: 48px;
  }
  * { box-sizing: border-box; }
  html { -webkit-text-size-adjust: 100%; }
  body { margin: 0; background: var(--bg); color: var(--text);
    font: 17px/1.4 -apple-system, "Segoe UI", Roboto, sans-serif; }
  #panel { position: fixed; top: 0; left: 0; right: 0; z-index: 20;
    min-height: var(--panel-h); padding: 6px 12px; padding-top: calc(6px + env(safe-area-inset-top));
    background: rgba(255,255,255,.97); border-bottom: 1px solid var(--line);
    display: flex; align-items: center; flex-wrap: wrap; gap: 6px 12px; }
  .panel-title { flex: 1 1 0; min-width: 0; font-size: 15px; font-weight: 600;
    white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .panel-title .logo { width: 26px; height: 26px; vertical-align: -7px; margin-left: 6px; }
  .panel-actions { flex: 0 0 auto; display: flex; align-items: center; gap: 6px; }
  .panel-actions a, .panel-actions button { font: inherit; font-size: 14px; padding: 5px 10px; border-radius: 8px;
    border: 2px solid var(--accent); background: var(--paper); color: var(--accent); cursor: pointer;
    text-decoration: none; white-space: nowrap; }
  #prepinac { flex: 1 1 100%; display: flex; gap: 6px; overflow-x: auto; scrollbar-width: none; padding: 1px 0 2px; }
  #prepinac::-webkit-scrollbar { display: none; }
  #prepinac:empty { display: none; }
  #prepinac a { flex: 0 0 auto; font-size: 14px; padding: 4px 11px; border-radius: 999px; border: 2px solid var(--line);
    color: var(--text); background: var(--paper); text-decoration: none; white-space: nowrap; }
  #prepinac a.akt { border-color: var(--accent); background: var(--accent); color: #fff; }
  main { max-width: 860px; margin: 0 auto; padding: calc(var(--panel-h) + 14px) 16px 60px; }
  .subj { scroll-margin-top: calc(var(--panel-h) + 6px); }
  h1 { font-size: 22px; margin: 0 0 2px; }
  .meta { color: var(--muted); font-size: 13px; }
  .subj { margin-top: 14px; border-top: 1px solid var(--line); padding-top: 10px; }
  .subj h2 { font-size: 18px; margin: 0 0 4px; }
  .topic { padding: 8px 0 8px; border-bottom: 1px solid #ecece6; }
  .topic .name { font-size: 17px; font-weight: 600; margin-bottom: 4px; }
  .grp { display: flex; align-items: baseline; gap: 8px; flex-wrap: wrap; padding: 3px 0 3px 12px; }
  .grp .lbl { flex: 0 0 9.5em; font-size: 13px; color: var(--muted); }
  .items { display: flex; gap: 6px; flex-wrap: wrap; flex: 1 1 200px; }
  .item { font-size: 14px; padding: 4px 10px; border-radius: 8px; border: 2px solid var(--accent);
    color: var(--accent); text-decoration: none; background: var(--paper); white-space: nowrap; }
  .item.test { background: var(--accent); color: #fff; }
  .item .v { opacity: .7; font-size: 12px; margin-left: 3px; }
  @media (max-width: 500px) { .grp .lbl { flex-basis: 100%; } }
  .empty, .err { color: var(--muted); font-size: 15px; padding: 6px 0; }
  .err { color: #b3261e; }
  .note { font-size: 13px; color: var(--muted); margin-top: 18px; }
  .subj .priprava { margin: 8px 0 10px; }
  .priprava { margin-top: 12px; padding: 10px 14px 12px; background: var(--paper); border: 2px solid var(--accent); border-radius: 10px; }
  .priprava h2 { font-size: 18px; margin: 0 0 2px; color: var(--accent); }
  .priprava .info { font-size: 14px; color: var(--muted); margin-bottom: 8px; }
  .priprava .krok { display: flex; align-items: baseline; gap: 8px; padding: 4px 0; flex-wrap: wrap; }
  .priprava .krok .c { flex: 0 0 auto; font-weight: 700; color: var(--accent); }
  .priprava .krok .pop { font-size: 13px; color: var(--muted); flex: 1 1 14em; }
</style>
</head>
<body>
<div id="panel">
  <div class="panel-title">Ann School <img class="logo" src="system/img/cat.svg" alt=""></div>
  <div class="panel-actions">
    <!-- systémová tlačítka rozcestníku – další přidávej sem -->
    <a href="vysledky.html">Výsledky</a>
    <button id="btnReload" type="button">Obnovit</button>
    <a id="btnZip" href="https://github.com/mjandlik/annschool/archive/refs/heads/main.zip">Stáhnout ZIP</a>
  </div>
  <nav id="prepinac" aria-label="Předměty"></nav>
</div>

<main>
  <h1>Materiály a testy</h1>
  <div class="meta" id="meta">Načítám…</div>
  <div id="priprava"></div>
  <div id="list"></div>
  <p class="note">„Stáhnout ZIP“ stáhne celý repozitář (všechny materiály, testy i archiv) do Souborů v iPadu.<br>
    Tip: v Safari Sdílet → Přidat na plochu – rozcestník pak bude jako ikona.</p>
</main>

<script>
/* ===================== NÁZVY (doplňuj při novém tématu / předmětu) ===================== */
const NAZVY = {
  predmety: { matematika: "Matematika", fyzika: "Fyzika", chemie: "Chemie", biologie: "Biologie", geografie: "Geografie", dejepis: "Dějepis" },
  // Pořadí témat v rozcestníku = pořadí zde (podle probírání). Nové téma přidej na konec.
  // Obecné položky (OBECNE níže) jsou vždy úplně dole.
  temata: {
    "prirozena-a-cela-cisla": "Přirozená a celá čísla",
    "delitelnost": "Dělitelnost, NSD, nsn",
    "ciselne-obory": "Číselné obory",
    "absolutni-hodnota": "Absolutní hodnota",
    "mocniny-a-odmocniny": "Mocniny a odmocniny",
    "prevody-jednotek": "Převody jednotek",
    "vektory": "Vektory",
    "kinematika": "Kinematika – rovnoměrný a zrychlený pohyb",
    "nazvoslovi": "Názvosloví anorganických sloučenin",
    "sesit": "Sešit",
    "pokyny": "Pokyny ke známkování",
    "souhrnny": "Souhrnné opakování",
    "bunka": "Buňka",
    "latky-a-atom": "Látky, směsi a atom",
    "znacky-prvku": "Značky prvků",
    "planetarni-geografie": "Planetární geografie",
    "pravek-a-starovek": "Pravěk a starověk"
  },
  // typ = část názvu souboru mezi tématem a verzí. Skupiny podle začátku typu:
  // test… → Testy, zapisky… → Zápisky, skolni-material… → Školní materiály, rychlouceni… → Rychloučení, ostatní → Výukové materiály
  typy: { zapisky: "Zápisky ze sešitu", "skolni-material": "Školní materiál", "zapisky-strana-7": "Zápisky – strana 7 (zvětšená)",
    "skolni-material-priklady": "Příklady", "skolni-material-cviceni": "Cvičení", "skolni-material-procvicovani": "Procvičování",
    "skolni-material-pracovni-list": "Pracovní list", "skolni-material-pracovni-list-doplneny": "Pracovní list (doplněný)",
    "skolni-material-reseni": "Řešení (kartičky)", "skolni-material-zakladni-pojmy": "Základní pojmy chemie", "skolni-material-soustavy": "Soustavy a směsi", "skolni-material-atom": "Atom, molekula, prvek", "skolni-material-izotopy": "Izotopy, izobary, ionty", "skolni-material-separacni-metody": "Oddělování složek směsí", material: "Studijní materiál", tahak: "Tahák", "pracovni-list": "Pracovní list", test: "Test", "test-1": "Test 1", "test-2": "Test 2", "test-3": "Test 3", "test-4": "Test 4", "test-5": "Test 5", "test-sesit": "Test – příklady ze sešitu", "test-vzorce": "Test – vzorce a výrazy", "test-dukazy": "Test – důkazy", "test-dvojkova": "Test – dvojková soustava", "test-teorie": "Test – teorie", "test-opravny": "Opravný test", simulator: "Simulátor", rychlouceni: "Rychloučení", "rychlouceni-pravek": "Rychloučení – pravěk", "rychlouceni-starovek": "Rychloučení – starověk", "rychlouceni-kapitoly-6-12": "Rychloučení – kapitoly 6–12 (důkladné)", karticky: "Kartičky" }
};
/* ========================================================================================= */

/* ===================== PŘÍPRAVA NA TEST (po testu blok smaž; prázdné = PRIPRAVA = []) =====================
   predmet: "fyzika" = rámeček uvnitř sekce předmětu hned pod nadpisem; bez predmet = nahoře nad všemi předměty. */
const PRIPRAVA = [   // 22.11.2026: blok chemie (test 16. 11.) zrušen; 24.11.2026: fyzika – písemka 27. 11. (27.11.: přidány řešené příklady); 25.11.2026: dějepis – písemka 26. 11.
  { predmet: "fyzika", nadpis: "Příprava na písemku z fyziky",
    info: "Písemka je v pátek 27. 11.: rovnoměrný a rovnoměrně zrychlený pohyb. Stačí projít tyhle čtyři kroky po pořadě.",
    polozky: [
      { soubor: "fyzika/kinematika_simulator", text: "Zlomek v akci", popis: "3 minuty hraní: co dělá číslo nahoře a co dole" },
      { soubor: "fyzika/kinematika_material", text: "Teorie v sedmi misích", popis: "všechno na písemku, krátce a na příkladech ze života" },
      { soubor: "fyzika/kinematika_zapisky", text: "Řešené příklady ze sešitu", popis: "9 příkladů ze školy krok za krokem: vzorec, postup, graf" },
      { soubor: "fyzika/kinematika_test", text: "Test na zkoušku", popis: "8 příkladů – vyzkoušej si, co už umíš" }
    ] },
  { predmet: "dejepis", nadpis: "Příprava na písemku z dějepisu",
    info: "Písemka je ve čtvrtek 26. 11.: Nejstarší civilizace. Stačí tyhle dva kroky – a zvládneš to.",
    polozky: [
      { soubor: "dejepis/pravek-a-starovek_zapisky", text: "Zápisky – kapitoly 6 až 12", popis: "Ötzi, první civilizace, písmo, Mezopotámie, Egypt, Čína a Indie" },
      { soubor: "dejepis/pravek-a-starovek_rychlouceni-kapitoly-6-12", text: "Rychloučení – kapitoly 6–12", popis: "učíš se odpovídáním; co nevíš, se ti vrací, dokud to neumíš" }
    ] }
];
/* ========================================================================================= */

const REPO = "mjandlik/annschool";
const SKIP = new Set(["system", "archiv", "lib"]);
const ORDER = ["matematika", "fyzika", "chemie"];
const SRDICKO = new Set(["matematika", "fyzika", "chemie"]);
// Pořadí témat pro jeden předmět (podle toho, jak na sebe navazují); ostatní témata za nimi podle NAZVY.temata
const PORADI_TEMAT = { chemie: ["latky-a-atom", "znacky-prvku", "nazvoslovi", "souhrnny"] };
const $ = id => document.getElementById(id);
const nice = slug => slug.charAt(0).toUpperCase() + slug.slice(1).replace(/-/g, " ");

async function load() {
  $("meta").textContent = "Načítám…"; $("list").innerHTML = ""; $("prepinac").innerHTML = "";
  let tree;
  try {
    const r = await fetch(`https://api.github.com/repos/${REPO}/git/trees/main?recursive=1`, { cache: "no-store" });
    if (!r.ok) throw new Error("GitHub odpověděl " + r.status);
    tree = (await r.json()).tree;
  } catch (e) {
    $("meta").textContent = "";
    $("list").innerHTML = `<p class="err">Seznam se nepodařilo načíst (${e.message}). Zkus „Obnovit“ za chvíli.</p>`;
    return;
  }
  // <předmět>/<tema>_<typ>_vXX.<přípona> → nejvyšší verze pro každé téma a typ
  const re = /^([a-z0-9-]+)\/([a-z0-9-]+)_([a-z0-9-]+)_v(\d\d)\.(pdf|html)$/;
  const data = {};
  tree.forEach(f => {
    const m = f.type === "blob" && f.path.match(re);
    if (!m || SKIP.has(m[1])) return;
    const [, subj, topic, typ, ver] = m;
    const t = ((data[subj] ??= {})[topic] ??= {});
    if (!t[typ] || ver > t[typ].ver) t[typ] = { ver, path: f.path };
  });
  // Příprava na test: odkazy na nejvyšší verze; blok s predmet patří do sekce předmětu (PRIPRAVA_PREDMET), ostatní nahoru
  $("priprava").innerHTML = "";
  const PRIPRAVA_PREDMET = {};
  PRIPRAVA.forEach(p => {
    const kroky = p.polozky.map(it => {
      const m = it.soubor.match(/^([a-z0-9-]+)\/([a-z0-9-]+)_([a-z0-9-]+)$/);
      const f = m && data[m[1]] && data[m[1]][m[2]] && data[m[1]][m[2]][m[3]];
      return f ? { ...it, f, typ: m[3] } : null;
    }).filter(Boolean);
    if (!kroky.length) return;
    const box = document.createElement("div"); box.className = "priprava";
    box.innerHTML = '<h2></h2><div class="info"></div>';
    box.querySelector("h2").textContent = p.nadpis; box.querySelector(".info").textContent = p.info;
    kroky.forEach((k, i) => {
      const r = document.createElement("div"); r.className = "krok";
      r.innerHTML = '<span class="c"></span><a></a><span class="pop"></span>';
      r.querySelector(".c").textContent = (i + 1) + ".";
      const a = r.querySelector("a"); a.className = "item" + (k.typ.startsWith("test") ? " test" : ""); a.href = k.f.path;
      a.textContent = k.text;
      const v = document.createElement("span"); v.className = "v"; v.textContent = "v" + k.f.ver; a.appendChild(v);
      a.onclick = () => { if (window.Sledovani) Sledovani.klik(k.f.path, "Příprava: " + k.text + " v" + k.f.ver); };
      r.querySelector(".pop").textContent = k.popis || "";
      box.appendChild(r);
    });
    if (p.predmet && data[p.predmet]) (PRIPRAVA_PREDMET[p.predmet] ??= []).push(box);
    else $("priprava").appendChild(box);
  });
  const subjects = [...new Set([...ORDER, ...Object.keys(data).sort()])].filter(s => data[s]);
  let count = 0;
  subjects.forEach(subj => {
    const sec = document.createElement("div"); sec.className = "subj"; sec.id = "p-" + subj;
    const nazev = NAZVY.predmety[subj] || nice(subj);
    const h = document.createElement("h2"); h.textContent = nazev; sec.appendChild(h);
    (PRIPRAVA_PREDMET[subj] || []).forEach(box => sec.appendChild(box));
    const tl = document.createElement("a"); tl.href = "#p-" + subj; tl.dataset.subj = subj;
    tl.textContent = nazev + (SRDICKO.has(subj) ? " ❤️" : "");
    tl.onclick = e => { e.preventDefault(); sec.scrollIntoView({ behavior: "smooth", block: "start" }); }
    $("prepinac").appendChild(tl);
    const POR = Object.keys(NAZVY.temata), OBECNE = ["sesit", "pokyny"], VLASTNI = PORADI_TEMAT[subj] || [];
    const pos = t => OBECNE.includes(t) ? 2e9 + OBECNE.indexOf(t) : VLASTNI.includes(t) ? -1e9 + VLASTNI.indexOf(t) :
      (POR.indexOf(t) < 0 ? 1e9 : POR.indexOf(t));
    const topics = Object.keys(data[subj]).sort((a, b) => pos(a) - pos(b) ||
      (NAZVY.temata[a] || nice(a)).localeCompare(NAZVY.temata[b] || nice(b), "cs"));
    topics.forEach(topic => {
      const row = document.createElement("div"); row.className = "topic";
      const nm = document.createElement("span"); nm.className = "name"; nm.textContent = NAZVY.temata[topic] || nice(topic);
      row.appendChild(nm);
      const types = Object.keys(data[subj][topic]).sort();
      const PREF = [["Zápisky", "zapisky"], ["Školní materiály", "skolni-material"], ["Rychloučení", "rychlouceni"], ["Testy", "test"]];
      const isP = (t, p) => t === p || t.startsWith(p + "-");
      const groups = [
        ["Výukové materiály", types.filter(t => !PREF.some(([, p]) => isP(t, p)))],
        ...PREF.map(([label, p]) => [label, types.filter(t => isP(t, p))])
      ];
      groups.forEach(([label, list]) => {
        if (!list.length) return;
        const g = document.createElement("div"); g.className = "grp";
        g.innerHTML = '<span class="lbl"></span><span class="items"></span>';
        g.querySelector(".lbl").textContent = label;
        list.forEach(typ => {
          const it = data[subj][topic][typ];
          const a = document.createElement("a"); a.className = "item" + (typ.startsWith("test") ? " test" : "");
          a.href = it.path;
          const pre = PREF.find(([, p]) => isP(typ, p));
          const sub = pre ? typ.slice(pre[1].length).replace(/^-/, "") : "";
          const opr = typ.match(/^test-opravny-(\d+)$/);
          const text = NAZVY.typy[typ] || (opr ? "Opravný test " + opr[1] : pre ? (NAZVY.typy[pre[1]] || nice(pre[1])) + (sub ? " – " + nice(sub) : "") : nice(typ));
          a.textContent = text;
          const v = document.createElement("span"); v.className = "v"; v.textContent = "v" + it.ver; a.appendChild(v);
          a.onclick = () => { if (window.Sledovani) Sledovani.klik(it.path, text + " v" + it.ver); };
          g.querySelector(".items").appendChild(a); count++;
        });
        row.appendChild(g);
      });
      sec.appendChild(row);
    });
    $("list").appendChild(sec);
  });
  $("meta").textContent = count ? `Aktuální verze · ${new Date().toLocaleDateString("cs-CZ")}` : "";
  if (!count) $("list").innerHTML = '<p class="empty">Zatím tu nic není.</p>';
  vyskaPanelu(); zvyrazni();
}
// Výška panelu (dva řádky) → odsazení obsahu a cíle scrollování
function vyskaPanelu() { document.documentElement.style.setProperty("--panel-h", $("panel").offsetHeight + "px"); }
// Zvýrazní v přepínači předmět, který je právě nahoře
function zvyrazni() {
  const hranice = $("panel").offsetHeight + 20; let akt = null;
  document.querySelectorAll(".subj").forEach(sec => { if (sec.getBoundingClientRect().top <= hranice) akt = sec.id.slice(2); });
  const prvni = document.querySelector(".subj"); if (!akt && prvni) akt = prvni.id.slice(2);
  if (window.innerHeight + window.scrollY >= document.documentElement.scrollHeight - 2) {
    const vse = document.querySelectorAll(".subj"); if (vse.length) akt = vse[vse.length - 1].id.slice(2);
  }
  $("prepinac").querySelectorAll("a").forEach(a => {
    const je = a.dataset.subj === akt; a.classList.toggle("akt", je);
    if (je && a.offsetLeft + a.offsetWidth > $("prepinac").scrollLeft + $("prepinac").clientWidth) a.scrollIntoView({ block: "nearest", inline: "nearest" });
  });
}
window.addEventListener("scroll", zvyrazni, { passive: true });
window.addEventListener("resize", () => { vyskaPanelu(); zvyrazni(); });
$("btnReload").onclick = load;
load();
</script>
</body>
</html>
