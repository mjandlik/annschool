<!doctype html>
<html lang="cs">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="apple-mobile-web-app-title" content="Ann School">
<title>Ann School</title>
<link rel="icon" type="image/svg+xml" href="system/img/cat.svg">
<link rel="apple-touch-icon" href="system/img/apple-touch-icon.png">
<!--
  ROZCESTNÍK – Ann School (index.html, stálá adresa, proto bez _vXX; historie je v gitu)
  Seznam souborů se načítá automaticky z GitHubu (aktuální = nejvyšší _vXX v každé složce předmětu).
  Při novém tématu nebo předmětu doplň jen český název do NAZVY níže.
-->
<style>
  :root {
    --bg: #fafaf7; --paper: #fff; --text: #1d1d1b; --muted: #6b6b66; --line: #dcdcd5;
    --accent: #2b5cab; --panel-h: 48px;
  }
  * { box-sizing: border-box; }
  html { -webkit-text-size-adjust: 100%; }
  body { margin: 0; background: var(--bg); color: var(--text);
    font: 17px/1.4 -apple-system, "Segoe UI", Roboto, sans-serif; }
  #panel { position: fixed; top: 0; left: 0; right: 0; z-index: 20;
    min-height: var(--panel-h); padding: 6px 12px; padding-top: calc(6px + env(safe-area-inset-top));
    background: rgba(255,255,255,.97); border-bottom: 1px solid var(--line);
    display: flex; align-items: center; gap: 12px; }
  .panel-title { flex: 1 1 auto; min-width: 0; font-size: 15px; font-weight: 600;
    white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .panel-title .logo { width: 26px; height: 26px; vertical-align: -7px; margin-left: 6px; }
  .panel-actions { flex: 0 0 auto; display: flex; align-items: center; gap: 6px; }
  .panel-actions a, .panel-actions button { font: inherit; font-size: 14px; padding: 5px 10px; border-radius: 8px;
    border: 2px solid var(--accent); background: var(--paper); color: var(--accent); cursor: pointer;
    text-decoration: none; white-space: nowrap; }
  main { max-width: 860px; margin: 0 auto; padding: calc(var(--panel-h) + 14px) 16px 60px; }
  h1 { font-size: 22px; margin: 0 0 2px; }
  .meta { color: var(--muted); font-size: 13px; }
  .subj { margin-top: 14px; border-top: 1px solid var(--line); padding-top: 10px; }
  .subj h2 { font-size: 18px; margin: 0 0 4px; }
  .topic { padding: 8px 0 8px; border-bottom: 1px solid #ecece6; }
  .topic .name { font-size: 17px; font-weight: 600; margin-bottom: 4px; }
  .grp { display: flex; align-items: baseline; gap: 8px; flex-wrap: wrap; padding: 3px 0 3px 12px; }
  .grp .lbl { flex: 0 0 9.5em; font-size: 13px; color: var(--muted); }
  .items { display: flex; gap: 6px; flex-wrap: wrap; flex: 1 1 200px; }
  .item { font-size: 14px; padding: 4px 10px; border-radius: 8px; border: 2px solid var(--accent);
    color: var(--accent); text-decoration: none; background: var(--paper); white-space: nowrap; }
  .item.test { background: var(--accent); color: #fff; }
  .item .v { opacity: .7; font-size: 12px; margin-left: 3px; }
  @media (max-width: 500px) { .grp .lbl { flex-basis: 100%; } }
  .empty, .err { color: var(--muted); font-size: 15px; padding: 6px 0; }
  .err { color: #b3261e; }
  .note { font-size: 13px; color: var(--muted); margin-top: 18px; }
</style>
</head>
<body>
<div id="panel">
  <div class="panel-title">Ann School <img class="logo" src="system/img/cat.svg" alt=""></div>
  <div class="panel-actions">
    <!-- systémová tlačítka rozcestníku – další přidávej sem -->
    <button id="btnReload" type="button">Obnovit</button>
    <a id="btnZip" href="https://github.com/mjandlik/annschool/archive/refs/heads/main.zip">Stáhnout ZIP</a>
  </div>
</div>

<main>
  <h1>Materiály a testy</h1>
  <div class="meta" id="meta">Načítám…</div>
  <div id="list"></div>
  <p class="note">„Stáhnout ZIP“ stáhne celý repozitář (všechny materiály, testy i archiv) do Souborů v iPadu.<br>
    Tip: v Safari Sdílet → Přidat na plochu – rozcestník pak bude jako ikona.</p>
</main>

<script>
/* ===================== NÁZVY (doplňuj při novém tématu / předmětu) ===================== */
const NAZVY = {
  predmety: { matematika: "Matematika", fyzika: "Fyzika", chemie: "Chemie" },
  temata: {
    "prevody-jednotek": "Převody jednotek",
    "vektory": "Vektory",
    "prirozena-a-cela-cisla": "Přirozená a celá čísla",
    "sesit": "Sešit"
  },
  // typ = část názvu souboru mezi tématem a verzí. Skupiny podle začátku typu:
  // test… → Testy, zapisky… → Zápisky, skolni-material… → Školní materiály, ostatní → Výukové materiály
  typy: { zapisky: "Zápisky ze sešitu", "skolni-material": "Školní materiál", material: "Studijní materiál", tahak: "Tahák", "pracovni-list": "Pracovní list", test: "Test", "test-1": "Test 1", "test-2": "Test 2", "test-3": "Test 3", simulator: "Simulátor" }
};
/* ========================================================================================= */

const REPO = "mjandlik/annschool";
const SKIP = new Set(["system", "archiv", "lib"]);
const ORDER = ["matematika", "fyzika", "chemie"];
const $ = id => document.getElementById(id);
const nice = slug => slug.charAt(0).toUpperCase() + slug.slice(1).replace(/-/g, " ");

async function load() {
  $("meta").textContent = "Načítám…"; $("list").innerHTML = "";
  let tree;
  try {
    const r = await fetch(`https://api.github.com/repos/${REPO}/git/trees/main?recursive=1`, { cache: "no-store" });
    if (!r.ok) throw new Error("GitHub odpověděl " + r.status);
    tree = (await r.json()).tree;
  } catch (e) {
    $("meta").textContent = "";
    $("list").innerHTML = `<p class="err">Seznam se nepodařilo načíst (${e.message}). Zkus „Obnovit“ za chvíli.</p>`;
    return;
  }
  // <předmět>/<tema>_<typ>_vXX.<přípona> → nejvyšší verze pro každé téma a typ
  const re = /^([a-z0-9-]+)\/([a-z0-9-]+)_([a-z0-9-]+)_v(\d\d)\.(pdf|html)$/;
  const data = {};
  tree.forEach(f => {
    const m = f.type === "blob" && f.path.match(re);
    if (!m || SKIP.has(m[1])) return;
    const [, subj, topic, typ, ver] = m;
    const t = ((data[subj] ??= {})[topic] ??= {});
    if (!t[typ] || ver > t[typ].ver) t[typ] = { ver, path: f.path };
  });
  const subjects = [...new Set([...ORDER, ...Object.keys(data).sort()])].filter(s => data[s]);
  let count = 0;
  subjects.forEach(subj => {
    const sec = document.createElement("div"); sec.className = "subj";
    const h = document.createElement("h2"); h.textContent = NAZVY.predmety[subj] || nice(subj); sec.appendChild(h);
    const topics = Object.keys(data[subj]).sort((a, b) =>
      (NAZVY.temata[a] || nice(a)).localeCompare(NAZVY.temata[b] || nice(b), "cs"));
    topics.forEach(topic => {
      const row = document.createElement("div"); row.className = "topic";
      const nm = document.createElement("span"); nm.className = "name"; nm.textContent = NAZVY.temata[topic] || nice(topic);
      row.appendChild(nm);
      const types = Object.keys(data[subj][topic]).sort();
      const PREF = [["Zápisky", "zapisky"], ["Školní materiály", "skolni-material"], ["Testy", "test"]];
      const isP = (t, p) => t === p || t.startsWith(p + "-");
      const groups = [
        ["Výukové materiály", types.filter(t => !PREF.some(([, p]) => isP(t, p)))],
        ...PREF.map(([label, p]) => [label, types.filter(t => isP(t, p))])
      ];
      groups.forEach(([label, list]) => {
        if (!list.length) return;
        const g = document.createElement("div"); g.className = "grp";
        g.innerHTML = '<span class="lbl"></span><span class="items"></span>';
        g.querySelector(".lbl").textContent = label;
        list.forEach(typ => {
          const it = data[subj][topic][typ];
          const a = document.createElement("a"); a.className = "item" + (typ.startsWith("test") ? " test" : "");
          a.href = it.path;
          const pre = PREF.find(([, p]) => isP(typ, p));
          const sub = pre ? typ.slice(pre[1].length).replace(/^-/, "") : "";
          const text = NAZVY.typy[typ] || (pre ? (NAZVY.typy[pre[1]] || nice(pre[1])) + (sub ? " – " + nice(sub) : "") : nice(typ));
          a.textContent = text;
          const v = document.createElement("span"); v.className = "v"; v.textContent = "v" + it.ver; a.appendChild(v);
          g.querySelector(".items").appendChild(a); count++;
        });
        row.appendChild(g);
      });
      sec.appendChild(row);
    });
    $("list").appendChild(sec);
  });
  $("meta").textContent = count ? `Aktuální verze · ${new Date().toLocaleDateString("cs-CZ")}` : "";
  if (!count) $("list").innerHTML = '<p class="empty">Zatím tu nic není.</p>';
}
$("btnReload").onclick = load;
load();
</script>
</body>
</html>
