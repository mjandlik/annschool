<!doctype html>
<html lang="cs">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>PDF – Ann School</title>
<link rel="icon" type="image/svg+xml" href="system/img/cat.svg">
<!--
  PROHLÍŽEČ PDF – Ann School (pdf.html, stálá adresa, proto bez _vXX; historie je v gitu)
  Použití: pdf.html?f=<předmět>/<soubor>.pdf  (rozcestník na PDF odkazuje takto)
  Zobrazí PDF (pdf.js 6.4.299, legacy build v system/lib/pdfjs-6.4.299) a zaznamená čtení:
  otevření, dobu, aktivitu, odchody, posouvání a čas na jednotlivých stranách (system/lib/sledovani.js).
  Návod: system/Navod_material_vXX.md (sledování stránek).
-->
<script src="system/lib/zaznam.js"></script>
<script src="system/lib/sledovani.js" data-typ="pdf"></script>
<style>
  :root { --bg: #e9e9e4; --paper: #fff; --text: #1d1d1b; --muted: #6b6b66; --line: #dcdcd5; --accent: #2b5cab; --bar-h: 46px; }
  * { box-sizing: border-box; }
  html { -webkit-text-size-adjust: 100%; }
  body { margin: 0; background: var(--bg); color: var(--text); font: 16px/1.4 -apple-system, "Segoe UI", Roboto, sans-serif; }
  #bar { position: sticky; top: 0; z-index: 10; min-height: var(--bar-h); display: flex; align-items: center; gap: 6px;
    padding: 5px 10px; padding-top: calc(5px + env(safe-area-inset-top)); background: rgba(255,255,255,.97); border-bottom: 1px solid var(--line); }
  #title { flex: 1 1 auto; min-width: 0; font-weight: 600; font-size: 14px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  #page { font-size: 13px; color: var(--muted); white-space: nowrap; }
  #bar button, #bar a { font: inherit; font-size: 13px; padding: 4px 9px; border-radius: 7px; border: 2px solid var(--accent);
    background: #fff; color: var(--accent); text-decoration: none; cursor: pointer; white-space: nowrap; }
  #pages { padding: 10px 6px 40px; }
  .pg { margin: 0 auto 10px; background: var(--paper); box-shadow: 0 1px 4px #0002; position: relative; }
  .pg canvas { display: block; width: 100%; height: 100%; }
  .pg .no { position: absolute; right: 6px; bottom: 4px; font-size: 11px; color: #9a9a93; }
  .msg { max-width: 560px; margin: 30px auto; padding: 14px 16px; background: #fff; border-radius: 8px; color: var(--muted); }
  @media (max-width: 520px) { #zoomOut, #zoomIn { display: none; } }
</style>
</head>
<body>
<div id="bar">
  <div id="title">PDF</div>
  <span id="page"></span>
  <button id="zoomOut" type="button" aria-label="zmenšit">−</button>
  <button id="zoomIn" type="button" aria-label="zvětšit">+</button>
  <a id="orig" href="#" target="_blank" rel="noopener">PDF</a>
  <a href="./">Rozcestník</a>
</div>
<div id="pages"><p class="msg">Načítám…</p></div>
<script type="module">
import * as pdfjs from "./system/lib/pdfjs-6.4.299/pdf.min.mjs";
pdfjs.GlobalWorkerOptions.workerSrc = "./system/lib/pdfjs-6.4.299/pdf.worker.min.mjs";
const $ = id => document.getElementById(id);
const f = new URLSearchParams(location.search).get("f") || "";
// jen PDF z tohoto repozitáře: <složka>/<soubor>.pdf, bez „..“ a cizích adres
if (!/^[a-z0-9-]+\/[A-Za-z0-9._-]+\.pdf$/.test(f) || f.includes("..")) {
  $("pages").innerHTML = '<p class="msg">Neplatný odkaz na PDF.</p>';
  throw new Error("neplatny soubor");
}
const NAZVY = { material: "studijní materiál", tahak: "tahák", "pracovni-list": "pracovní list", zapisky: "zápisky ze sešitu", "skolni-material": "školní materiál" };
const m = f.match(/^([a-z0-9-]+)\/([a-z0-9-]+)_([a-z0-9-]+)_v(\d\d)\.pdf$/);
const hezky = s => s.charAt(0).toUpperCase() + s.slice(1).replace(/-/g, " ");
const titul = m ? `${hezky(m[2])} – ${NAZVY[m[3]] || NAZVY[Object.keys(NAZVY).find(k => m[3].startsWith(k + "-"))] || m[3].replace(/-/g, " ")}` : f;
document.title = titul + " (PDF)";
$("title").textContent = titul + (m ? ` · v${m[4]}` : "");
$("orig").href = f;

let zoom = 1, pdf = null;
const pages = [];
const DPR = Math.min(2, window.devicePixelRatio || 1);
function sirka() { return Math.min(document.documentElement.clientWidth - 12, 1100) * zoom; }
async function vykresli(p) {
  if (p.rendered === p.w || p.busy) return;
  p.busy = true;
  try {
    const page = await pdf.getPage(p.n);
    const vp1 = page.getViewport({ scale: 1 });
    const scale = p.w / vp1.width * DPR;
    const vp = page.getViewport({ scale });
    const c = p.cv;
    c.width = Math.floor(vp.width); c.height = Math.floor(vp.height);
    await page.render({ canvas: c, canvasContext: c.getContext("2d"), viewport: vp }).promise;
    p.rendered = p.w;
  } catch (e) { console.warn("strana", p.n, e); }
  p.busy = false;
}
function uvolni(p) { if (p.rendered) { p.cv.width = p.cv.height = 1; p.rendered = 0; } }
function rozmery() {
  const w = sirka();
  pages.forEach(p => { p.w = Math.round(w); p.el.style.width = p.w + "px"; p.el.style.height = Math.round(p.w * p.ratio) + "px"; });
}
let viditelne = new Map();
const io = new IntersectionObserver(entries => {
  entries.forEach(e => {
    const p = pages[+e.target.dataset.i];
    if (e.isIntersecting) { viditelne.set(p.n, e.intersectionRatio); vykresli(p); }
    else { viditelne.delete(p.n); }
  });
  aktualni();
}, { rootMargin: "800px 0px", threshold: [0, 0.25, 0.5, 0.75, 1] });
// aktuální strana = ta, která zabírá nejvíc obrazovky
function aktualni() {
  let best = 0, bn = 1;
  pages.forEach(p => {
    const r = p.el.getBoundingClientRect();
    const vis = Math.max(0, Math.min(innerHeight, r.bottom) - Math.max(0, r.top));
    if (vis > best) { best = vis; bn = p.n; }
    // stránky daleko od obrazovky uvolnit (paměť iPadu)
    if (r.bottom < -3 * innerHeight || r.top > 4 * innerHeight) uvolni(p);
  });
  $("page").textContent = pdf ? `${bn} / ${pdf.numPages}` : "";
  if (window.Sledovani) Sledovani.oblast("s. " + bn);
}
let sT;
window.addEventListener("scroll", () => { clearTimeout(sT); sT = setTimeout(aktualni, 120); }, { passive: true });
window.addEventListener("resize", () => { clearTimeout(sT); sT = setTimeout(() => { rozmery(); pages.forEach(p => { if (viditelne.has(p.n)) vykresli(p); }); aktualni(); }, 200); });
function zmenZoom(z) {
  const y = (window.scrollY + innerHeight / 2) / document.documentElement.scrollHeight;
  zoom = Math.min(3, Math.max(0.6, z)); rozmery();
  window.scrollTo(0, y * document.documentElement.scrollHeight - innerHeight / 2);
  pages.forEach(p => { if (viditelne.has(p.n)) vykresli(p); });
}
$("zoomIn").onclick = () => zmenZoom(zoom * 1.25);
$("zoomOut").onclick = () => zmenZoom(zoom / 1.25);

try {
  pdf = await pdfjs.getDocument({ url: f, standardFontDataUrl: "./system/lib/pdfjs-6.4.299/standard_fonts/",
  }).promise;
  $("pages").innerHTML = "";
  if (window.Sledovani) Sledovani.pocetOblasti(pdf.numPages);
  for (let n = 1; n <= pdf.numPages; n++) {
    const page = await pdf.getPage(n);
    const vp = page.getViewport({ scale: 1 });
    const el = document.createElement("div"); el.className = "pg"; el.dataset.i = n - 1;
    const cv = document.createElement("canvas"); el.appendChild(cv);
    const no = document.createElement("span"); no.className = "no"; no.textContent = n; el.appendChild(no);
    $("pages").appendChild(el);
    pages.push({ n, el, cv, ratio: vp.height / vp.width, w: 0, rendered: 0 });
  }
  rozmery();
  pages.forEach(p => io.observe(p.el));
  aktualni();
} catch (e) {
  $("pages").innerHTML = `<p class="msg">PDF se nepodařilo otevřít (${e.message}). Zkus tlačítko „PDF“ nahoře.</p>`;
}
</script>
</body>
</html>
