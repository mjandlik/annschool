<!doctype html>
<html lang="cs">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Test</title>
<!--
  ŠABLONA HTML TESTU – Ann School (Sablona_test_vXX.html)
  Nový test = kopie této šablony. Měň JEN blok „KONFIGURACE TESTU“ níže.
  Knihovny pro PDF leží v repozitáři v lib/ (stránka musí běžet z GitHub Pages).
-->
<script src="lib/html2canvas-1.4.1.min.js"></script>
<script src="lib/jspdf-2.5.2.min.js"></script>
<style>
  :root {
    --bg: #fafaf7; --paper: #ffffff; --text: #1d1d1b; --muted: #6b6b66; --line: #dcdcd5;
    --ok: #1f7a3a; --ok-bg: #e6f4ea; --bad: #b3261e; --bad-bg: #fbe9e7;
    --accent: #2b5cab; --grid: #d6e2f0;
  }
  * { box-sizing: border-box; }
  html { -webkit-text-size-adjust: 100%; }
  body { margin: 0; background: var(--bg); color: var(--text);
    font: 20px/1.45 -apple-system, "Segoe UI", Roboto, sans-serif; }
  main { max-width: 860px; margin: 0 auto; padding: 24px 16px 120px; }
  h1 { font-size: 28px; margin: 0 0 4px; }
  h2.section { font-size: 21px; margin: 28px 0 4px; padding-top: 18px; border-top: 1px solid var(--line); }
  .meta { color: var(--muted); font-size: 16px; display: flex; gap: 18px; flex-wrap: wrap; }
  .intro { margin: 10px 0 0; font-size: 17px; }
  .score { font-size: 22px; font-weight: 600; margin-top: 10px; }
  .score:empty { display: none; }
  .timer { font-weight: 600; color: var(--accent); }
  .timer.over { color: var(--bad); }
  #header { padding-bottom: 6px; }

  .q { padding: 14px 0; border-bottom: 1px solid var(--line); }
  .q-row { display: flex; align-items: center; flex-wrap: wrap; gap: 10px; font-size: 24px; }
  .num { color: var(--muted); font-size: 18px; min-width: 2em; }
  input.ans { width: 9em; font-size: 24px; padding: 8px 10px; border: 2px solid var(--line);
    border-radius: 8px; background: var(--paper); color: var(--text); text-align: right; }
  input.ans:focus { outline: none; border-color: var(--accent); }
  .q.ok input.ans { border-color: var(--ok); background: var(--ok-bg); }
  .q.bad input.ans { border-color: var(--bad); background: var(--bad-bg); }
  .fb { font-size: 17px; margin-top: 6px; }
  .fb:empty { display: none; }
  .q.ok .fb { color: var(--ok); }
  .q.bad .fb { color: var(--bad); }
  .hint { font-size: 16px; color: var(--muted); margin-top: 6px; }
  .hint[hidden] { display: none; }
  .link { font-size: 15px; color: var(--accent); background: none; border: 0; padding: 4px 0; cursor: pointer; }

  .pad { position: relative; margin-top: 10px; border: 1px solid var(--line); border-radius: 8px;
    overflow: hidden; background: var(--paper); }
  .pad canvas { display: block; width: 100%; }
  .pad-btns { position: absolute; top: 6px; right: 6px; display: flex; gap: 6px; }
  .pad-btns button { font-size: 14px; padding: 4px 10px; border-radius: 6px; border: 1px solid var(--line);
    background: rgba(255,255,255,.9); color: var(--text); cursor: pointer; }

  .buttons { display: flex; gap: 12px; flex-wrap: wrap; margin-top: 24px; }
  button.btn { font: inherit; font-size: 19px; padding: 12px 20px; border-radius: 10px;
    border: 2px solid var(--accent); background: var(--paper); color: var(--accent); cursor: pointer; }
  button.btn.primary { background: var(--accent); color: #fff; }
  button.btn.ready { background: var(--ok); border-color: var(--ok); color: #fff; }
  button.btn:disabled { opacity: .6; }

  /* plovoucí lišta nástrojů pro kreslení */
  #tools { position: fixed; left: 0; right: 0; bottom: 0; background: rgba(250,250,247,.96);
    border-top: 1px solid var(--line); padding: 8px 12px calc(8px + env(safe-area-inset-bottom));
    display: flex; gap: 8px; align-items: center; justify-content: center; flex-wrap: wrap; z-index: 10; }
  #tools[hidden] { display: none; }
  #tools button { font-size: 16px; padding: 8px 12px; border-radius: 8px; border: 2px solid var(--accent);
    background: var(--paper); color: var(--accent); cursor: pointer; }
  #tools button.on { background: var(--accent); color: #fff; }
  #tools .swatch { width: 34px; height: 34px; border-radius: 50%; padding: 0; border: 3px solid transparent; }
  #tools .swatch.on { border-color: var(--text); }
  .note { font-size: 15px; color: var(--muted); margin-top: 10px; }

  /* při tvorbě PDF skryj ovládací prvky */
  body.capturing .no-pdf { display: none !important; }
  body.capturing #header, body.capturing .q, body.capturing #finalScratch, body.capturing h2.section { background: #fff; }
</style>
</head>
<body>
<main>
  <div id="header">
    <h1 id="title"></h1>
    <div class="meta"><span id="date"></span><span id="timer" class="timer"></span></div>
    <p class="intro" id="intro"></p>
    <div class="score" id="score"></div>
  </div>

  <div id="questions"></div>

  <div id="finalScratch" hidden>
    <h2 class="section">Místo na výpočty</h2>
  </div>

  <div class="buttons no-pdf">
    <button class="btn primary" id="btnCheck">Vyhodnotit</button>
    <button class="btn" id="btnReset">Zkusit znovu</button>
    <button class="btn" id="btnNew" hidden>Nová sada</button>
    <button class="btn" id="btnPdf">Uložit PDF</button>
  </div>
  <p class="note no-pdf" id="padNote" hidden>Apple Pencil kreslí, prstem se posouvá stránka. Kresby a odpovědi se po zavření stránky neukládají – před zavřením použij „Uložit PDF“.</p>
</main>

<div id="tools" class="no-pdf" hidden>
  <button class="swatch on" data-color="#1d1d1b" style="background:#1d1d1b" aria-label="černá"></button>
  <button class="swatch" data-color="#2b5cab" style="background:#2b5cab" aria-label="modrá"></button>
  <button class="swatch" data-color="#b3261e" style="background:#b3261e" aria-label="červená"></button>
  <button id="toolPen" class="on">Pero</button>
  <button id="toolEraser">Guma</button>
  <button id="toolFinger">Kreslit prstem: ne</button>
</div>

<script>
/* =====================================================================
   KONFIGURACE TESTU – měň jen tuto část
   ---------------------------------------------------------------------
   title, intro       … nadpis a pokyny
   topic              … téma pro název PDF (bez diakritiky, pomlčky)
   timeLimitMin       … časový limit v minutách (0 = bez limitu)
   showHints          … u příkladů tlačítko „Nápověda“
   finalScratch       … velká plocha na výpočty na konci testu
   questions          … pevná sada příkladů
   generate           … funkce vracející novou náhodnou sadu (nebo null);
                        pokud je zadaná, použije se místo questions
                        a zobrazí se tlačítko „Nová sada“
   Příklad:
     { section: "Délka" }                 … mezinadpis (okruh)
     { before: "5 m =", after: "mm", answer: 5000,
       tol: 0,           … povolená odchylka (např. 0.05 u zaokrouhlení)
       hint: "…",        … nápověda / vysvětlení u chyby
       scratch: false }  … plocha na výpočet pod příkladem
   ===================================================================== */
const TEST = {
  title: "Převody jednotek – ukázkový test",
  intro: "Doplň číslo do prázdného pole. Desetinná čárka i tečka jsou v pořádku, mezery v čísle nevadí.",
  topic: "prevody-jednotek",
  timeLimitMin: 0,
  showHints: true,
  finalScratch: true,
  questions: [
    { section: "Délka" },
    { before: "5 m =", after: "mm", answer: 5000, hint: "dolů = násobím: m → mm, ×1000 (10³)" },
    { before: "320 mm =", after: "m", answer: 0.32, hint: "nahoru = dělím: mm → m, :1000 (10³)" },
    { section: "Čas" },
    { before: "2,5 min =", after: "s", answer: 150, hint: "1 min = 60 s → 2,5 · 60" },
    { section: "Složené jednotky" },
    { before: "36 km/h =", after: "m/s", answer: 10, hint: "km/h → m/s: dělím 3,6", scratch: true },
    { before: "23 500 s ≈", after: "h (na 1 des. místo)", answer: 6.5, tol: 0.05,
      hint: "1 h = 3600 s → 23 500 : 3600 ≈ 6,53 ≈ 6,5", scratch: true },
    { section: "Plocha" },
    { before: "3 m² =", after: "cm²", answer: 30000, hint: "1 m² = 100 · 100 cm² = 10 000 cm²" },
    { section: "Mocniny deseti" },
    { before: "4500 m =", after: "· 10³ m", answer: 4.5, hint: "4500 = 4,5 · 1000" }
  ],
  generate: null
  /* Ukázka náhodné sady:
  generate: () => {
    const r = (a, b) => a + Math.floor(Math.random() * (b - a + 1));
    const out = [{ section: "Délka" }];
    for (let i = 0; i < 5; i++) { const m = r(2, 95) / 10;
      out.push({ before: `${fmt(m)} m =`, after: "cm", answer: m * 100, hint: "dolů = násobím, ×100" }); }
    return out;
  } */
};
/* ===================== KONEC KONFIGURACE ===================== */


/* ---------- pomocné funkce ---------- */
function fmt(n) { return Number(n.toFixed(10)).toLocaleString("cs-CZ", { maximumFractionDigits: 10 }); }
function parseAnswer(s) {
  const t = String(s).replace(/[\s  ]/g, "").replace(/−/g, "-").replace(",", ".");
  if (t === "" || !/^[-+]?(\d+\.?\d*|\.\d+)$/.test(t)) return null;
  return Number(t);
}
function isCorrect(value, answer, tol) {
  if (value === null) return false;
  const t = Math.max(tol || 0, Math.abs(answer) * 1e-9, 1e-12);
  return Math.abs(value - answer) <= t;
}
const $ = id => document.getElementById(id);

/* ---------- kreslicí plochy ---------- */
const draw = { color: "#1d1d1b", eraser: false, finger: false };
const pads = [];
const CELL = 24;

class Pad {
  constructor(parent, height) {
    this.wrap = document.createElement("div");
    this.wrap.className = "pad";
    this.canvas = document.createElement("canvas");
    this.canvas.style.height = height + "px";
    this.wrap.appendChild(this.canvas);
    const btns = document.createElement("div");
    btns.className = "pad-btns no-pdf";
    btns.innerHTML = '<button type="button">Zpět</button><button type="button">Smazat</button>';
    btns.children[0].onclick = () => { this.strokes.pop(); this.redraw(); };
    btns.children[1].onclick = () => {
      if (this.strokes.length && confirm("Smazat tuto plochu?")) { this.strokes = []; this.redraw(); }
    };
    this.wrap.appendChild(btns);
    parent.appendChild(this.wrap);
    this.ctx = this.canvas.getContext("2d");
    this.ink = document.createElement("canvas");
    this.ictx = this.ink.getContext("2d");
    this.strokes = []; this.cur = null;
    this.bind(); this.resize();
    pads.push(this);
  }
  resize() {
    const r = this.canvas.getBoundingClientRect(), dpr = window.devicePixelRatio || 1;
    this.w = r.width; this.h = r.height; this.dpr = dpr;
    this.canvas.width = this.ink.width = Math.round(r.width * dpr);
    this.canvas.height = this.ink.height = Math.round(r.height * dpr);
    this.redraw();
  }
  redraw() {
    const { ctx, ictx, dpr } = this;
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    ctx.fillStyle = "#fff"; ctx.fillRect(0, 0, this.w, this.h);
    ctx.strokeStyle = "#d6e2f0"; ctx.lineWidth = 1; ctx.beginPath();
    for (let x = 0.5; x < this.w; x += CELL) { ctx.moveTo(x, 0); ctx.lineTo(x, this.h); }
    for (let y = 0.5; y < this.h; y += CELL) { ctx.moveTo(0, y); ctx.lineTo(this.w, y); }
    ctx.stroke();
    ictx.setTransform(1, 0, 0, 1, 0, 0); ictx.clearRect(0, 0, this.ink.width, this.ink.height);
    ictx.setTransform(dpr, 0, 0, dpr, 0, 0);
    this.strokes.forEach(s => Pad.stroke(ictx, s));     // guma maže jen kresbu, ne síť
    ctx.setTransform(1, 0, 0, 1, 0, 0); ctx.drawImage(this.ink, 0, 0);
  }
  static stroke(c, s) {
    c.save(); c.lineCap = "round"; c.lineJoin = "round";
    c.globalCompositeOperation = s.eraser ? "destination-out" : "source-over";
    c.strokeStyle = c.fillStyle = s.color;
    for (let i = 1; i < s.pts.length; i++) {
      const [x0, y0] = s.pts[i - 1], [x1, y1, p] = s.pts[i];
      c.lineWidth = s.eraser ? 22 : 2.5 * (0.6 + p * 0.8);
      c.beginPath(); c.moveTo(x0, y0); c.lineTo(x1, y1); c.stroke();
    }
    if (s.pts.length === 1) { const [x, y] = s.pts[0];
      c.beginPath(); c.arc(x, y, s.eraser ? 11 : 1.5, 0, 7); c.fill(); }
    c.restore();
  }
  bind() {
    const cv = this.canvas;
    const can = e => e.pointerType === "pen" || e.pointerType === "mouse" || (e.pointerType === "touch" && draw.finger);
    const pos = e => { const r = cv.getBoundingClientRect();
      return [e.clientX - r.left, e.clientY - r.top, e.pointerType === "pen" ? (e.pressure || .5) : .5]; };
    cv.addEventListener("pointerdown", e => {
      if (!can(e)) return;
      e.preventDefault(); cv.setPointerCapture(e.pointerId);
      this.cur = { color: draw.color, eraser: draw.eraser, pts: [pos(e)] };
      this.strokes.push(this.cur); this.redraw();
    });
    cv.addEventListener("pointermove", e => {
      if (!this.cur) return;
      e.preventDefault();
      (e.getCoalescedEvents ? e.getCoalescedEvents() : [e]).forEach(ev => this.cur.pts.push(pos(ev)));
      this.redraw();
    });
    ["pointerup", "pointercancel"].forEach(t => cv.addEventListener(t, () => { this.cur = null; }));
    // iPad: Pencil nesmí posouvat stránku; prst posouvá (pokud není zapnuté kreslení prstem)
    const block = e => { const t = e.touches[0]; if (t && (t.touchType === "stylus" || draw.finger)) e.preventDefault(); };
    cv.addEventListener("touchstart", block, { passive: false });
    cv.addEventListener("touchmove", block, { passive: false });
  }
}

/* ---------- vykreslení testu ---------- */
let QUESTIONS = [];
function build() {
  QUESTIONS = (typeof TEST.generate === "function") ? TEST.generate() : TEST.questions;
  pads.length = 0;
  const box = $("questions"); box.innerHTML = "";
  let n = 0;
  QUESTIONS.forEach(q => {
    if (q.section !== undefined) {
      const h = document.createElement("h2"); h.className = "section"; h.textContent = q.section;
      box.appendChild(h); return;
    }
    n++;
    const d = document.createElement("div"); d.className = "q";
    d.innerHTML = `<div class="q-row"><span class="num">${n}.</span><span class="b"></span>
      <input class="ans" type="text" inputmode="decimal" autocomplete="off" autocorrect="off"
        autocapitalize="off" spellcheck="false" aria-label="odpověď ${n}"><span class="a"></span></div>
      <div class="fb"></div>`;
    d.querySelector(".b").textContent = q.before || "";
    d.querySelector(".a").textContent = q.after || "";
    if (TEST.showHints && q.hint) {
      const hb = document.createElement("button"); hb.className = "link no-pdf"; hb.textContent = "Nápověda";
      const ht = document.createElement("div"); ht.className = "hint"; ht.hidden = true; ht.textContent = q.hint;
      hb.onclick = () => { ht.hidden = !ht.hidden; };
      d.appendChild(hb); d.appendChild(ht);
    }
    q._el = d;
    box.appendChild(d);
    if (q.scratch) new Pad(d, 168);
  });
  const fs = $("finalScratch");
  fs.querySelectorAll(".pad").forEach(p => p.remove());
  fs.hidden = !TEST.finalScratch;
  if (TEST.finalScratch) new Pad(fs, 480);
  $("tools").hidden = $("padNote").hidden = pads.length === 0;
  $("score").textContent = "";
  // Enter = další pole
  const inputs = [...document.querySelectorAll("input.ans")];
  inputs.forEach((inp, i) => inp.addEventListener("keydown", e => {
    if (e.key === "Enter") { e.preventDefault(); (inputs[i + 1] || inp).focus(); if (!inputs[i + 1]) inp.blur(); }
  }));
  pdfReset();
}

function evaluate() {
  let ok = 0, total = 0;
  QUESTIONS.forEach(q => {
    if (!q._el) return;
    total++;
    const v = parseAnswer(q._el.querySelector("input").value);
    const good = isCorrect(v, q.answer, q.tol);
    q._el.classList.toggle("ok", good); q._el.classList.toggle("bad", !good);
    q._el.querySelector(".fb").textContent = good ? "Správně"
      : `Správně je ${fmt(q.answer)}${q.after ? " " + q.after : ""}` + (q.hint ? ` – ${q.hint}` : "");
    if (good) ok++;
  });
  $("score").textContent = `Výsledek: ${ok} / ${total}  (${Math.round(ok / total * 100)} %)`;
  pdfReset();
  window.scrollTo({ top: 0, behavior: "smooth" });
}

function resetAnswers() {
  QUESTIONS.forEach(q => { if (!q._el) return;
    q._el.classList.remove("ok", "bad"); q._el.querySelector("input").value = "";
    q._el.querySelector(".fb").textContent = ""; });
  $("score").textContent = "";
  pdfReset();
}

/* ---------- časovač ---------- */
function startTimer() {
  if (!TEST.timeLimitMin) return;
  const end = Date.now() + TEST.timeLimitMin * 60000, el = $("timer");
  const tick = () => {
    const s = Math.max(0, Math.round((end - Date.now()) / 1000));
    el.textContent = s ? `Zbývá ${Math.floor(s / 60)}:${String(s % 60).padStart(2, "0")}` : "Čas vypršel";
    el.classList.toggle("over", !s);
    if (s) setTimeout(tick, 1000);
  };
  tick();
}

/* ---------- PDF ---------- */
let pdfFile = null;
function pdfReset() { pdfFile = null; const b = $("btnPdf"); b.textContent = "Uložit PDF"; b.classList.remove("ready"); b.disabled = false; }
function pdfName() {
  const d = new Date(), p = x => String(x).padStart(2, "0");
  return `Test_${TEST.topic || "test"}_${d.getFullYear()}-${p(d.getMonth() + 1)}-${p(d.getDate())}.pdf`;
}
async function makePdf() {
  const { jsPDF } = window.jspdf;
  const doc = new jsPDF({ unit: "mm", format: "a4" });
  const PW = 210, PH = 297, M = 12, W = PW - 2 * M;
  const blocks = [$("header"), ...$("questions").children];
  if (TEST.finalScratch) blocks.push($("finalScratch"));
  document.body.classList.add("capturing");
  try {
    let y = M;
    for (const el of blocks) {
      if (el.hidden || !el.offsetHeight) continue;
      const scale = Math.min(2, 3800 / el.offsetWidth);
      const c = await html2canvas(el, { scale, backgroundColor: "#ffffff", logging: false });
      let w = W, h = c.height * W / c.width;
      if (h > PH - 2 * M) { h = PH - 2 * M; w = c.width * h / c.height; }
      if (y + h > PH - M) { doc.addPage(); y = M; }
      doc.addImage(c.toDataURL("image/jpeg", 0.9), "JPEG", M, y, w, h);
      y += h + 2;
    }
  } finally { document.body.classList.remove("capturing"); }
  const n = doc.getNumberOfPages();
  for (let i = 1; i <= n; i++) { doc.setPage(i); doc.setFontSize(9); doc.setTextColor(140);
    doc.text(`${i} / ${n}`, PW - M, PH - 5, { align: "right" }); }
  return new File([doc.output("blob")], pdfName(), { type: "application/pdf" });
}
function download(file) {
  const a = document.createElement("a"); a.href = URL.createObjectURL(file); a.download = file.name;
  document.body.appendChild(a); a.click(); a.remove();
  setTimeout(() => URL.revokeObjectURL(a.href), 10000);
}
async function onPdf() {
  const b = $("btnPdf");
  if (pdfFile) {                     // 2. klepnutí: sdílení (na iPadu musí být přímo z klepnutí)
    try { await navigator.share({ files: [pdfFile], title: pdfFile.name }); }
    catch (e) { if (e.name !== "AbortError") download(pdfFile); }
    return;
  }
  b.disabled = true; b.textContent = "Připravuji PDF…";
  try {
    const f = await makePdf();
    const canShare = navigator.canShare && navigator.canShare({ files: [f] });
    if (canShare) { pdfFile = f; b.textContent = "PDF připraveno – klepni pro uložení"; b.classList.add("ready"); }
    else { download(f); b.textContent = "Uložit PDF"; }
  } catch (e) {
    alert("PDF se nepodařilo vytvořit: " + e.message); b.textContent = "Uložit PDF";
  } finally { b.disabled = false; }
}

/* ---------- start ---------- */
document.title = TEST.title;
$("title").textContent = TEST.title;
$("intro").textContent = TEST.intro || "";
$("date").textContent = "Datum: " + new Date().toLocaleDateString("cs-CZ");
$("btnCheck").onclick = evaluate;
$("btnReset").onclick = () => { if (confirm("Vymazat všechny odpovědi?")) resetAnswers(); };
if (typeof TEST.generate === "function") {
  $("btnNew").hidden = false;
  $("btnNew").onclick = () => { if (confirm("Vytvořit novou sadu příkladů? Odpovědi i kresby se smažou.")) build(); };
}
$("btnPdf").onclick = onPdf;
document.querySelectorAll("#tools .swatch").forEach(b => b.onclick = () => {
  document.querySelectorAll("#tools .swatch").forEach(x => x.classList.remove("on"));
  b.classList.add("on"); draw.color = b.dataset.color; setEraser(false);
});
function setEraser(on) { draw.eraser = on; $("toolEraser").classList.toggle("on", on); $("toolPen").classList.toggle("on", !on); }
$("toolPen").onclick = () => setEraser(false);
$("toolEraser").onclick = () => setEraser(true);
$("toolFinger").onclick = () => { draw.finger = !draw.finger;
  $("toolFinger").textContent = "Kreslit prstem: " + (draw.finger ? "ano" : "ne");
  $("toolFinger").classList.toggle("on", draw.finger); };
let rT; window.addEventListener("resize", () => { clearTimeout(rT); rT = setTimeout(() => pads.forEach(p => p.resize()), 150); });
build();
startTimer();
</script>
</body>
</html>
